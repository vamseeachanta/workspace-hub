# ---------------------------------------------------------------------------
# Client-specific infrastructure / user identifiers
# ---------------------------------------------------------------------------
# Populated 2026-08-01. This section sat EMPTY since v2.0, which is exactly why
# 133 tracked files in this public repo accumulated real machine hostnames while
# every PR reported the PII gate green. The gate was not wrong — it had simply
# never been told that machine and network identifiers are a protected class.
#
# An empty rule list and a satisfied rule list produce the same green tick. That
# is the failure mode this whole class of check keeps hitting: absence of a
# finding reads as absence of a problem.
#
# Routing must use the canonical ROLE aliases (ace-win-1, ace-win-2, dev-primary,
# …) — see deckhand#581. Real hostnames belong only in the private tier, where
# the per-host deckhand policy `host_aliases` block maps them.
# SEVERITY IS `warn`, NOT `block`, AND THAT IS DELIBERATE AND TEMPORARY.
# The sweep that removes these strings is INCOMPLETE — docs/ is clean, but
# scripts/, tests/, config/, .claude/, .planning/, queue/, state/ and data/ still
# carry them. Arming `block` now would fail the scan on every subsequent commit,
# including the commits that finish the cleanup.
#
# This mirrors the same discipline used for the dispatch labels in #3740: do not
# arm the enforcement until the thing it enforces is actually true, or the first
# thing anyone does is route around it.
#
# FLIP TO `block` (delete these three severity lines; default_severity is block)
# once `git grep -ilE "acma-ansys05|acma-ws014|acma-hou-rds02"` returns nothing.
# Until then a warn is honest: it reports the leak without pretending it is fixed.
client_infrastructure:
  - pattern: "acma-ansys05"
    case_sensitive: false
    severity: warn
    description: "Real machine hostname — use the role alias ace-win-1"
  - pattern: "acma-ws014"
    case_sensitive: false
    severity: warn
    description: "Real machine hostname — use the role alias ace-win-2"
  - pattern: "acma-hou-rds02"
    case_sensitive: false
    severity: warn
    description: "Real machine hostname — use the role alias ace-win-1"

# ---------------------------------------------------------------------------
# Files/paths excluded from scanning (glob patterns)
# ---------------------------------------------------------------------------
# IMPORTANT: Internal drive catalogs and knowledge maps are excluded because
# they legitimately reference project/client folder names for navigation.
# The legal gate for THOSE files is manual review, not pattern scanning.
# ---------------------------------------------------------------------------
exclusions:
  - ".legal-deny-list.yaml"
  - ".git/"
  - "*.lock"
  - "node_modules/"
  - "__pycache__/"
  - "docs/document-intelligence/*.md"
  - "data/document-index/conference-paper-catalog.yaml"
  - "data/document-index/dde-*.yaml"
  - "data/document-index/mounted-source-registry.yaml"
  - "data/document-index/cross-drive-dedup-report.json"
  - "scripts/legal/"
  # logs/orchestrator/ contains raw agent operational JSONL dumps (hermes-session-export.sh,
  # codex-session-export.sh). These files legitimately record tool-call logs that mention
  # client project filenames (e.g. "Lakach BoD DRAFT 06252024_VA.xlsx" in GitHub issue
  # close comments). They are INTERNAL operational data — not public code, docs, or exports.
  # The legal gate for client names in these files is access control on the git remote,
  # not pattern scanning. Excluding them here prevents nightly learning pipeline commits
  # from being blocked while keeping the scan effective for actual code and documentation.
  # See: scripts/cron/commit-learning-artifacts.sh, issue #1985.
  - "logs/orchestrator/"
  - "*.sim"
  - "*.dat"

default_severity: "block"

# Riser-projects provenance names (dm#1259 gate-prep, 2026-07-02).
# SCOPE NOTE: only low-collision compound names go here — famous public-domain
# field/rig names (which legitimately appear in worldenergydata's regulatory
# datasets) are enforced instead by digitalmodel's scoped provenance-token
# tripwire (tests/riser_database/test_provenance_tripwire.py), to avoid
# reddening wed scans (lesson from dm#1245 review).
riser_project_provenance:
  - pattern: "Zohr Deep"
    case_sensitive: false
  - pattern: "GEB Deep"
    case_sensitive: false
  - pattern: "Rosa 312"
    case_sensitive: false
  - pattern: "Piklis"
    case_sensitive: false
  - pattern: "Jujak"
    case_sensitive: false
