# ---------------------------------------------------------------------------
# Client-specific infrastructure / user identifiers
# ---------------------------------------------------------------------------
# INTENTIONALLY EMPTY. Do not populate this with machine hostnames or client
# identifiers.
#
# 2026-08-01: I added three real hostnames here as detection patterns, reasoning
# that the section being empty was why a leak went unnoticed. That was wrong on
# both counts, and the Client-PII Gate caught it by flagging the lines I had just
# written.
#
# `scripts/legal/check-client-pii.py` is the authoritative guard, and its design
# note says why: client identifiers live ONLY in a private map, the script
# "contains no client names, and it NEVER prints a matched client string — only
# the file and line number — because CI logs on a public repo would themselves
# leak." It exists precisely as "the recurrence backstop the incomplete
# .legal-deny-list.yaml failed to provide".
#
# So a pattern written here is (a) redundant, the private map already has it, and
# (b) itself a leak, because this file is public. A deny-list that must name the
# secret to detect it cannot live in the open.
#
# Machine identifiers belong to that private map. Routing uses the canonical role
# aliases (deckhand#581); the real-hostname mapping lives per-box in
# ~/.config/workspace-hub/machine-identity.yaml (#3571), off-repo and gitignored.
client_infrastructure: []
  # - pattern: "client-vpc-123"
  #   case_sensitive: false
  #   description: "Example client infra"

# ---------------------------------------------------------------------------
# Files/paths excluded from scanning (glob patterns)
# ---------------------------------------------------------------------------
# IMPORTANT: Internal drive catalogs and knowledge maps are excluded because
# they legitimately reference project/client folder names for navigation.
# The legal gate for THOSE files is manual review, not pattern scanning.
# ---------------------------------------------------------------------------
exclusions:
  - ".legal-deny-list.yaml"
  - ".git/"
  - "*.lock"
  - "node_modules/"
  - "__pycache__/"
  - "docs/document-intelligence/*.md"
  - "data/document-index/conference-paper-catalog.yaml"
  - "data/document-index/dde-*.yaml"
  - "data/document-index/mounted-source-registry.yaml"
  - "data/document-index/cross-drive-dedup-report.json"
  - "scripts/legal/"
  # logs/orchestrator/ contains raw agent operational JSONL dumps (hermes-session-export.sh,
  # codex-session-export.sh). These files legitimately record tool-call logs that mention
  # client project filenames (e.g. "Lakach BoD DRAFT 06252024_VA.xlsx" in GitHub issue
  # close comments). They are INTERNAL operational data — not public code, docs, or exports.
  # The legal gate for client names in these files is access control on the git remote,
  # not pattern scanning. Excluding them here prevents nightly learning pipeline commits
  # from being blocked while keeping the scan effective for actual code and documentation.
  # See: scripts/cron/commit-learning-artifacts.sh, issue #1985.
  - "logs/orchestrator/"
  # data/field-development/ and docs/field-development/ are the world-energy
  # field-development corpus: wholly PUBLIC data (BSEE / SubseaIQ / operator
  # disclosures) about Gulf of Mexico and international fields.
  #
  # The patterns above block strings like "Perdido" and "Prelude FLNG" because
  # they were CLIENT ENGAGEMENT names under /mnt/ace. The same strings are also
  # the public names of those fields, and public field-development analysis is
  # work this ecosystem does deliberately. Exact-string matching cannot tell the
  # two apart: "Perdido" from a client folder is a leak, "Perdido" in a scan of
  # public SubseaIQ data is the subject matter. Scanning the public corpus
  # therefore produces only false positives — 22 of them as of 2026-08-03 — and
  # a gate that is mostly noise stops being read at all.
  #
  # Owner decision 2026-08-03: this corpus is wholly public, vendors are
  # verified from public sources, and the client-name scan does not apply here.
  #
  # SCOPE IS DELIBERATELY NARROW. It is these two directories only. The genuine
  # findings this scan exists for — "2H Offshore" (copyrighted vendor source)
  # and "Shankar Sundararaman" (named author), both from the #1773 incident —
  # live in docs/plans, docs/session-handoffs and scripts/, which stay fully in
  # scope. Do not widen this to `docs/` or `data/`; that would silently disable
  # the #1773 protection. Guarded by
  # tests/legal/test_public_field_data_exclusion.py.
  - "data/field-development/"
  - "docs/field-development/"
  # ── Vendor name in non-#1773 context (owner decision 2026-08-03) ────────
  # The #1773 constraint is a COPYRIGHT one: specific code, its proprietary
  # tool name, and its author. The vendor's company NAME is public and appears
  # here in ordinary market context — competitor analysis, a hiring-company
  # list, an email domain->company map, a competitor list in the job scanner.
  # None of that is derivative of the code, so blocking it produced pure noise.
  # The company name still blocks everywhere else; these are the paths whose
  # hits were individually inspected and found to be market research.
  - "notes/prep/gtm-*.md"
  - "scripts/gtm/"
  - "scripts/email/contact-normalizer.py"
  # This script REDACTS these patterns, and its header comment names them to
  # explain what it redacts. An enforcement artifact must not be blocked by the
  # rule it enforces.
  - "scripts/cron/redact-session-signals.sh"
  # Completes an already-excluded set: the four sibling files above are
  # exempt for the same reason — a document INDEX catalogs source filenames,
  # and a vendor's name inside a filename is a provenance record, not a copy
  # of the vendor's work.
  - "data/document-index/index-other-bucket-*.yaml"
  - "*.sim"
  - "*.dat"

default_severity: "block"

# Riser-projects provenance names (dm#1259 gate-prep, 2026-07-02).
# SCOPE NOTE: only low-collision compound names go here — famous public-domain
# field/rig names (which legitimately appear in worldenergydata's regulatory
# datasets) are enforced instead by digitalmodel's scoped provenance-token
# tripwire (tests/riser_database/test_provenance_tripwire.py), to avoid
# reddening wed scans (lesson from dm#1245 review).
riser_project_provenance:
  - pattern: "Zohr Deep"
    case_sensitive: false
  - pattern: "GEB Deep"
    case_sensitive: false
  - pattern: "Rosa 312"
    case_sensitive: false
  - pattern: "Piklis"
    case_sensitive: false
  - pattern: "Jujak"
    case_sensitive: false
