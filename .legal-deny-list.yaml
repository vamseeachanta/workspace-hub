# =============================================================================
# Global Legal Deny List — applies to ALL submodules
# =============================================================================
# Patterns here are scanned by scripts/legal/legal-sanity-scan.sh.
# Per-project deny lists in each submodule extend (not replace) this file.
#
# Severity levels:
#   block  — fail the scan, PR cannot proceed
#   warn   — flag but allow to proceed
#
# IMPORTANT: These patterns catch client-identifiable content that must not
# leak into public repos, data exports, or generated artifacts.
# Internal documentation (docs/document-intelligence/*) that catalogs
# drive structure is excluded — see exclusions below.
# =============================================================================

version: "2.0"
updated: "2026-04-03"

# ---------------------------------------------------------------------------
# Client project names and codenames (from /mnt/ace project folders)
# ---------------------------------------------------------------------------
# Add specific client project codenames here when porting client work.
# Format: exact string match. Use case_sensitive: false for broad catch.
#
# NOTE: Generic project numbers (0111, 0127, etc.) are NOT blocked because
# they are internal ACE numbering, not client-identifiable.
# ---------------------------------------------------------------------------
# SEVERITY TIERS (owner decision 2026-08-03)
#
# The `block`/`warn` levels documented at the top of this file were never
# implemented — the scanner counted every match toward its exit code. They are
# implemented now, and used here to separate two things this list had conflated:
#
#   block — the identifier itself is the constraint. Copyright holders, named
#           authors, proprietary tool names (#1773); a specific WELL
#           designation or an internal PROJECT NUMBER, which name an
#           engagement deliverable rather than a place.
#
#   warn  — public geography. FIELD, PLATFORM and LEASE-BLOCK names are
#           published by the operator and the regulator, appear in BSEE /
#           SubseaIQ data, and are the subject matter of this ecosystem's
#           public field-development work. They were also client engagement
#           names, and exact-string matching cannot tell those apart.
#
# Measured on origin/main before this change: 71 unique violations and NOT ONE
# was a leak — 60 were public field names in public-data analysis, GTM
# competitor research, and auto-generated reports. A gate that is ~85% noise
# stops being read, which is the real risk to what the gate protects.
#
# Warn matches are still REPORTED in full and counted in the summary. The tier
# changes what FAILS, never what is SEEN.
client_references:
  - pattern: "Prelude FLNG"
    case_sensitive: false
    severity: warn
    description: "Shell Prelude FLNG — public facility name; was a client project"
  - pattern: "West Boreas"
    case_sensitive: false
    severity: warn
    description: "Shell West Boreas — public field name; was a client project"
  - pattern: "Perdido"
    case_sensitive: true
    severity: warn
    description: "Shell Perdido — public field/spar name; was a client field"
  - pattern: "Caesar Tonga"
    case_sensitive: false
    severity: warn
    description: "Chevron Caesar Tonga — public field name; was a client project"
  - pattern: "Lucius PR-02"
    case_sensitive: false
    description: "Client WELL designation — identifies an engagement, not a place"
  - pattern: "Matterhorn TLP"
    case_sensitive: false
    severity: warn
    description: "Public platform name; was a client platform"
  - pattern: "Horn Mountain"
    case_sensitive: false
    severity: warn
    description: "BP Horn Mountain — public field name; was a client field"
  - pattern: "Carcara"
    case_sensitive: true
    severity: warn
    description: "Carcara — public field name; was a client project"
  - pattern: "Yellowtail"
    case_sensitive: true
    severity: warn
    description: "ExxonMobil Yellowtail — public field name; was a client project"
  - pattern: "Piklis-1DL"
    case_sensitive: false
    description: "Client WELL identifier — identifies an engagement, not a place"
  - pattern: "Jujak-1"
    case_sensitive: false
    description: "Client WELL identifier — identifies an engagement, not a place"
  - pattern: "Moho Nord"
    case_sensitive: false
    severity: warn
    description: "Total Moho Nord — public field name; was a client project"
  - pattern: "Lakach"
    case_sensitive: true
    severity: warn
    description: "Lakach — public field name; was a client project"
  - pattern: "61850_zama"
    case_sensitive: false
    description: "Internal PROJECT NUMBER + field — names an engagement deliverable"
  - pattern: "MC518"
    case_sensitive: true
    severity: warn
    description: "Mississippi Canyon block — public BOEM lease designation"
  - pattern: "2HSPANVIV"
    case_sensitive: false
    description: "2H Offshore proprietary VIV tool name — #1773 clean-room required"
  - pattern: "2H Offshore"
    case_sensitive: false
    description: "2H Offshore Inc. — copyright holder of FreeSpanVIVFatigue code"
  - pattern: "Shankar Sundararaman"
    case_sensitive: false
    description: "Original author of 2H VIV code — must not appear in clean-room impl"

