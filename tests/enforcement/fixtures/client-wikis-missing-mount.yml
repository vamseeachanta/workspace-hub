    repo: vamseeachanta/llm-wiki-acma
    visibility: PRIVATE
    raw_roots:
      - /mnt/nonexistent-mount-fixture/raw/
    local_working_clone: /mnt/nonexistent-mount-fixture/clone/
    posture: client-private
    status: bootstrapped
