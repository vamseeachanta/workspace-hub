title = "workspace-hub gitleaks config"

[extend]
# Keep default rules enabled; this file carries an allow-list, and without
# defaults a scan that passes --config detects nothing.
useDefault = true

[allowlist]
description = "Known false positives"
paths = [
  # Scanner configuration file; exact self-reference only.
  '''^\.gitleaks\.toml$''',
  # Scanner harness fixture; exact file only.
  '''^tests/quality/test_secrets_scan\.sh$''',
  # Mirrored reference file; upstream examples are not repository credentials.
  '''^\.agents/skills/mlops/training/unsloth/references/llms\-full\.md$''',
  # Mirrored reference file; upstream examples are not repository credentials.
  '''^\.agents/skills/mlops/training/unsloth/references/llms\-txt\.md$''',
  # Mirrored reference file; upstream examples are not repository credentials.
  '''^\.claude/skills/mlops/training/unsloth/references/llms\-full\.md$''',
  # Mirrored reference file; upstream examples are not repository credentials.
  '''^\.claude/skills/mlops/training/unsloth/references/llms\-txt\.md$''',
  # Vendored static test assets; not authored repository code.
  '''^pylib/youtube_transcript_api/test/assets/''',
  # Generated or archived runtime state; existing snapshot content only.
  '''^\.gemini/gsd\-file\-manifest\.json$''',
  # Generated or archived runtime state; existing snapshot content only.
  '''^config/agents/gemini/state\-snapshots/projects\.json$''',
  # Archived documentation examples with repeated command examples.
  '''^_archive/skills/productivity/time\-tracking/SKILL\.md$''',
