# Pre-commit hooks for workspace-hub
# Install: pre-commit install   (default_install_hook_types below wires both
#          the pre-commit and commit-msg stages automatically)
# Test: echo "bad message" | pre-commit run commitizen --hook-stage commit-msg

# Auto-wire both stages so `pre-commit install` enables the commit-msg hooks
# (the #3169 client-PII commit-message guard depends on this).
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Commit message linting (conventional commits)
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: validate-work-queue-state
        name: validate work queue state
        entry: bash scripts/work-queue/validate-queue-state.sh
        language: system
        files: '^\.claude/work-queue/.*|^scripts/work-queue/.*|^docs/work-queue-workflow\.md$'
      - id: check-harness-file-size
        name: agent harness files ≤20 lines (#2322)
        entry: bash scripts/enforcement/check-harness-file-size.sh
        language: system
        # Fire on any staged harness file (excluded dirs handled inside the script).
        files: '(^|/)(CLAUDE|MEMORY|AGENTS|GEMINI)\.md$'
        pass_filenames: false
      - id: check-model-id-sourcing
        name: no new hardcoded model IDs (#3060, advisory ratchet)
        entry: bash scripts/enforcement/check-model-id-sourcing.sh
        language: system
        # Advisory: reports new literals on staged scripts/config but does not block.
        # Flip to '--enforce' once trusted. The script self-scopes; pass staged files.
        files: '^((scripts|config)/.*\.(sh|py|ya?ml|json|md)|\.github/workflows/.*\.ya?ml|\.(claude|agents)/(skills|agent-library)/.*\.(md|sh|py|ya?ml|json))$'
        exclude: '^(config/agents/model-registry\.yaml$|scripts/review/results/)'
      - id: email-fixture-redaction-check
        name: email fixture redaction check
        entry: python scripts/email/fixture-redaction-check.py
        language: system
        files: '^tests/fixtures/email/.*\.(ya?ml|txt|md)$'
      - id: legal-client-pii
        name: no client identifiers in tracked files (#3095/#3099)
        # Blocks staged files that contain a client identifier. Reads a PRIVATE
        # local map (config/agents/.client-codename-map.local.yaml); degrades-open
        # if absent. The #3099 CI gate is the strict backstop. Bypass: LEGAL_PII_ALLOW=1.
        entry: uv run python scripts/legal/check-client-pii.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: legal-client-pii-commit-msg
        name: no client identifiers in the commit message (#3095/#3169)
        # Blocks a commit whose MESSAGE contains a client identifier (the
        # file-content guard above does not see commit messages). Reads the same
        # PRIVATE local map; degrades-open if absent (parity with --staged). The
        # value is never printed. Bypass: LEGAL_PII_ALLOW=1.
        # pre-commit appends the commit-message file path → it becomes the value
        # of the trailing --message-file argument.
        entry: uv run python scripts/legal/check-client-pii.py --source "commit message" --message-file
        language: system
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]
