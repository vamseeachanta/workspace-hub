# schedule-tasks.yaml — Single source of truth for all scheduled tasks.
# Read by: scripts/cron/setup-cron.sh, scripts/cron/validate-schedule.py,
#          scripts/operations/workstation-dispatch.sh
# HARD RULE: all cron/task-scheduler entries must be declared here.
# Do NOT add entries directly to crontab or Windows Task Scheduler.
#
# Fields:
#   machines:  explicit machine list (used by cron to decide where to install)
#   requires:  capability list (used by dispatcher to find best-fit machine)
#   prefer:    optional machine hint for dispatcher when multiple match

tasks:
  # ── dev-primary: full variant ─────────────────────────────────────────────

  - id: benchmark-regression
    label: Performance benchmark regression check
    schedule: "30 1 * * *"
    machines: [dev-primary, ace-linux-1]
    roles: [control-plane]
    requires: [python3, uv, git]
    prefer: dev-primary
    command: >-
      PATH=$HOME/.local/bin:$PATH;
      cd $WORKSPACE_HUB &&
      bash scripts/testing/run-benchmarks.sh
      >> $WORKSPACE_HUB/logs/quality/benchmark-$(date +\%Y\%m\%d).log 2>&1
    log: logs/quality/benchmark-*.log
    is_claude_task: false
    description: Nightly benchmark run; exits 1 on >20% regression vs committed baseline.

  - id: equality-report
    label: Machine-equality self-report (#2801)
    schedule: "30 4 * * 1"
    machines: [dev-primary, ace-linux-1, dev-secondary, ace-linux-2, ace-win-1, ace-win-2]
    roles: [control-plane, comms-dispatch, sim-worker]
    requires: [bash, python3, uv, git]
    command: >-
      PATH=$HOME/.local/bin:$PATH;
      cd $WORKSPACE_HUB &&
      bash scripts/readiness/equality-matrix-cron.sh
      >> $WORKSPACE_HUB/logs/quality/equality-$(date +\%Y-\%m-\%d).log 2>&1
    log: logs/quality/equality-*.log
    is_claude_task: false
    description: >-
      Per-machine weekly (Mon 04:30) cold-dimension self-report + matrix rebuild +
      publish to origin/main (equality-matrix-cron.sh: collect + build + fail-loud
      notify per #2972, then publish-equality.sh — sparse-worktree, newer-evidence-only —
      so evidence reaches origin even when the interactive checkout is diverged; the
      old repo-sync delegation went dark exactly then). Hot dims referenced from
      nightly readiness. Single source for both Linux cron and Windows Task Scheduler
      per this file's HARD RULE (#2801 DC5).

  - id: equivalence-sentinel
    label: Machine-equivalence drift sentinel (#3059)
    schedule: "17 */6 * * *"
    machines: [dev-primary, ace-linux-1, dev-secondary, ace-linux-2]
    roles: [control-plane, comms-dispatch]
    requires: [bash, python3, uv, git, claude]
    command: >-
      PATH=$HOME/.local/bin:$HOME/.npm-global/bin:$PATH;
      cd $WORKSPACE_HUB &&
      bash scripts/monitoring/equivalence-sentinel.sh
      >> $WORKSPACE_HUB/logs/monitoring/equivalence-sentinel-$(date +\%Y-\%m-\%d).log 2>&1
    log: logs/monitoring/equivalence-sentinel-*.log
    is_claude_task: false
    description: >-
      Per-box (every 6h) equivalence fingerprint -> publish to the equivalence-state
      git ref -> compare all boxes -> alert on WARNING/CRITICAL drift (clone-vs-origin,
      harness version/install, model-registry hash, hub learning-cron freshness).
      Complements the weekly equality-report (#2801) with focused alerting on the
      model-parity-critical dimensions. Set EQUIV_ALERT_ISSUE=<n> to post drift to an issue.

  - id: session-curation
    label: Session analysis + memory curation (machine-equivalence line item)
    schedule: "47 */6 * * *"
    machines: [dev-primary, ace-linux-1, dev-secondary, ace-linux-2, ace-win-1, ace-win-2]
    roles: [control-plane, comms-dispatch, sim-worker]
    requires: [bash, python3, uv, git]
    command: >-
      PATH=$HOME/.local/bin:$PATH;
      cd $WORKSPACE_HUB &&
      bash scripts/curation/curate-session-memory.sh
      >> $WORKSPACE_HUB/logs/monitoring/session-curation-$(date +\%Y-\%m-\%d).log 2>&1
    log: logs/monitoring/session-curation-*.log
    is_claude_task: false
    description: >-
      Per-box every 6h: analyze ALL AI-provider session logs (Claude/Codex/Gemini/Hermes)
      + curate the memory delta, publish a fingerprint to the session-curation-state git
      ref for cross-machine transfer, then refresh this box's equality column. Drives the
      "session analysis & memory curation" matrix cell (freshness: <=12h green / >12h orange
      / >24h red). The 6h cadence keeps a healthy box comfortably under the 12h staleness
      threshold. Windows boxes run the same engine via Git Bash (curate-session-memory.ps1
      is the Task-Scheduler-native companion).

  - id: equality-matrix-refresh
    label: 6-hourly equality-matrix rebuild (freshness dead-man's-switch for session-curation)
    # 6-hourly (was daily): the committed render is the fleet's canonical comparison
    # surface and must track the 6h curation cadence — a daily rebuild left freshness
    # cells up to 24h behind reality (user directive 2026-07-02: "update the equality
    # matrix always"). :50 offset keeps it 3min behind the :47 curation run, so each
    # rebuild grades the curation stamp it just produced. Idempotent commit-on-change —
    # a no-op cycle publishes nothing.
    schedule: "50 */6 * * *"
    machines: [dev-primary, ace-linux-1]
    roles: [control-plane]
    requires: [bash, python3, uv, git]
    command: >-
      PATH=$HOME/.local/bin:$PATH;
      cd $WORKSPACE_HUB &&
      bash scripts/readiness/equality-matrix-cron.sh
      >> $WORKSPACE_HUB/logs/quality/equality-refresh-$(date +\%Y-\%m-\%d).log 2>&1
    log: logs/quality/equality-refresh-*.log
    is_claude_task: false
    description: >-
      6-hourly rebuild + publish of the equality matrix on the control-plane box
      (equality-matrix-cron.sh: collect + build + publish-equality.sh), INDEPENDENT of
      the session-curation cron, so a DEAD curation cron still ages its freshness cell
      past green (orange >12h, red >24h). Without this independent rebuild the weekly
      equality-report (#2801) would freeze the last-green render and the
      dead-man's-switch would never fire. Publishing to origin/main every cycle keeps
      the COMMITTED render current — the fleet compares against origin, not any one
      box's working tree.

  # Linux-only (v1); Windows Task Scheduler parity deferred per epic #3058.
  - id: harness-install-doctor
    label: Harness install-doctor — REPAIR arm for equivalence-sentinel (#3058/#3059)
    schedule: "11 */6 * * *"   # :11 — 6 min before sentinel (:17); avoids 04:0x provider-dream-bridge stagger
    machines: [dev-primary, ace-linux-1, dev-secondary, ace-linux-2]
    roles: [control-plane, comms-dispatch]
    requires: [bash, git]
    command: >-
      PATH=$HOME/.local/bin:$PATH;
      cd $WORKSPACE_HUB &&
      bash scripts/maintenance/harness-install-doctor.sh
      >> $WORKSPACE_HUB/logs/maintenance/harness-install-doctor-$(date +\%Y-\%m-\%d).log 2>&1
    log: logs/maintenance/harness-install-doctor-*.log
    is_claude_task: false
    description: >-
      Per-box (every 6h, :11 — 6 min before the equivalence-sentinel at :17) idempotent
      REPAIR of per-provider harness install state, OUT-OF-SESSION so the next session for
      ANY provider (Claude/Codex/agy) starts pre-healed. Runs the blessed installer
      scripts/agents/install-soul-runtime.sh (SOUL/AGENTS runtime symlinks) which otherwise
      runs only by hand and never re-heals secondary boxes; report-only guardrails on
      ~/.codex/skills (.system must not be shadowed) and the Codex memory surface.
      ORTHOGONAL to the sentinel (#3059), not a replacement: the sentinel still runs and
      still detects all drift dimensions; this only pre-heals the install layer before it.
      The sentinel is report-only; this is the missing repair arm. Provider-neutral by
      design — a SessionEnd hook would only fire after Claude.

  - id: git-lock-reaper
    label: Reap orphan .git/index.lock (dev-primary + dev-secondary) (#3187)
    schedule: "*/5 * * * *"
    machines: [dev-primary, ace-linux-1, dev-secondary, ace-linux-2]
    roles: [control-plane]
    requires: [bash, git]
    command: >-
      PATH=$HOME/.local/bin:$PATH;
      cd $WORKSPACE_HUB &&
      bash scripts/maintenance/git-lock-reaper.sh
      >> $WORKSPACE_HUB/logs/maintenance/git-lock-reaper-$(date +\%Y-\%m-\%d).log 2>&1
    log: logs/maintenance/git-lock-reaper-*.log
    is_claude_task: false
    description: >-
      Every 5 min: detect a .git/index.lock that is BOTH older than
      LOCK_REAPER_AGE_MINUTES (default 10) AND has no live `git` process, then remove it
      with a stderr alert (cron -> mail). A zero-byte orphan lock silently froze ALL git
      automation on ace-linux-1 for ~5h on 2026-06-17 (#3187), and recurred on ace-linux-2
      on 2026-06-18 (blocked commits twice) — hence porting here. Dual-guard (age + no-live-git)
      so it can never race-reap a live op's lock — unlike git-safe.sh:git_heal_index().
      The reaper script is machine-agnostic (resolves its own repo via git rev-parse).

  - id: return-to-main-guard
    label: Restore dev-primary workspace-hub checkout to main when idle off-branch (#3187)
    schedule: "*/30 * * * *"
    machines: [dev-primary, ace-linux-1]
    roles: [control-plane]
    requires: [bash, git]
    command: >-
      PATH=$HOME/.local/bin:$PATH;
      cd $WORKSPACE_HUB &&
      bash scripts/maintenance/return-to-main-guard.sh
      >> $WORKSPACE_HUB/logs/maintenance/return-to-main-guard-$(date +\%Y-\%m-\%d).log 2>&1
    log: logs/maintenance/return-to-main-guard-*.log
    is_claude_task: false
    description: >-
      Every 30 min on dev-primary: when the workspace-hub checkout is parked off `main`
      and idle, restore it to main so the ~50 crons that run `cd $WORKSPACE_HUB && bash
      scripts/...` always see main's tree (#3187). REFUSES to act when staged changes are
      present (user work in flight, exit 1 alert) or a git op is live; auto-stashes only
      regenerable unstaged/untracked churn (disable with GUARD_AUTO_STASH=0).

  - id: parity-sentinel
