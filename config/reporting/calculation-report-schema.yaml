# Calculation Report Schema v2.0
# Every calculation YAML must conform to this structure.
# Validated by scripts/reporting/generate-calc-report.py
# schema_version: 1 (default) or 2 — v1 data validates unchanged

required_fields:
  metadata:
    required: [title, doc_id, revision, date, status]
    optional: [author, reviewer, approver, project, change_log, computed_by]
    types:
      title: str
      doc_id: str
      revision: int
      date: str
      author: str_or_mapping_name
      reviewer: mapping_name_date
      approver: mapping_name_date
      computed_by: str_or_list_of_tracked_source_modules_not_rendered
      status:
        enum: [draft, reviewed, approved]
      project: str
    notes:
      date: >
        ISO calendar dates are documented as YYYY-MM-DD. Python's date parser
        may also accept compact dates and ISO week dates and normalize them.
      computed_by: >
        This key only suppresses the illustrative typed-input sentence when
        every path is a tracked source module in the input repository. It is
        not rendered as a report reference.
    change_log_entry:
      required: [rev, date, description]

  inputs:
    item_required: [name, symbol, value, unit]
    item_optional: [source, notes]

  methodology:
    required: [description, standard, equations]
    optional: []
    equation_required: [id, name, latex, description]
    equation_optional: [variables]
    variable_fields: [symbol, description, unit]

  outputs:
    item_required: [name, symbol, value, unit]
    item_optional: [pass_fail, limit, notes]
    pass_fail_enum: [pass, fail, null]

  assumptions:
    type: list_of_strings

  references:
    type: list_of_strings

optional_sections:
  charts:
    item_required: [id, title, type, x_label, y_label, datasets]
    item_optional: [x_unit, y_unit, x_scale, y_scale]
    type_enum: [line, bar, scatter, log_log]
    scale_enum: [linear, log]
    dataset_required: [label, data]
    dataset_optional: [color]

  data_tables:
    item_required: [id, title, columns, rows]
    column_fields: [name, unit]

  scope:
    required: [objective, inclusions, exclusions]
    optional: [limitations, validity_range]

  design_basis:
    required: [codes, design_life]
    optional: [safety_class, load_combinations, environment]

  materials:
    item_required: [name, grade, value, unit]
    item_optional: [source, partial_factor, certificate]

  calculations:
    item_required: [step, description]
    item_optional: [detail, code_clause, intermediate_results]

  sensitivity:
    item_required: [parameter, range, result]

  validation:
    required: []
    optional: [method, test_file, test_count, test_categories, benchmark_source]

  verification:
    required: [date, method]
    optional: [checker, findings, status]

  conclusions:
    required: [adequacy, governing_check]
    optional: [recommendations, compliance_statement]
