runtime_boundary: Existing repository tools and their package modules will execute from a pinned owning
  checkout; this manifest is a skill activation boundary, not a standalone application package or complete
  software bill of materials.
external_read_dependencies:
- repo: llm-wiki
  paths:
  - llms.txt
  - data/data-source-catalog.yml
  - data/domain-database-index.yml
  - docs/query-surface.md
  - data/query_sources.json
  - scripts/llm_wiki_query.py
  mode: Read known catalog/metadata paths; run the supported read-only query CLI from the explicitly resolved
    owner checkout with its existing package. No raw corpus crawl.
lookup_contract:
  resolve_owner: Validate explicit existing checkout and known paths. Invalid/missing path or malformed
    configuration is unavailable; no creation or silent fallback.
  catalogs: Read the two known ownership catalogs directly; query registration is separate.
  coverage: Zero matches with coverage gaps remain partial, not evidence of absence.
  source_rights: Discovery grants no ingestion or publication authority. Retain the explicit private raw-evidence
    and licensed-original restrictions.
  reuse: Reuse evidence only for matching source identity/version/digest, access state, freshness/expiry
    and intended-use criteria. Recheck mutable dependencies.
  engineering_input: Missing, stale, synthetic or unverified data is not valid engineering input.
authorization:
  basis: User-approved risk-based operating model for this isolated pilot.
  standing: Routine reversible work within approved scope and report-only cleanup.
  explicit_approval: Substantial unapproved plans, publication, destructive actions, access changes and
    changes to engineering basis.
  enforcement: Declarative guidance only; existing live hooks and shared runtime gates are unchanged.
  lifecycle: The four-skill fixture omits issue-planning-mode intentionally; SHARED_SOUL Hard Gates and
    Must-Fire Rules retain planning and cleanup requirements. This profile does not replace the shared
    contract.
unresolved_live_prerequisites:
- Missing all-agent data contract.
- Missing allocation-ledger next hop.
- Current wiki query CLI does not register the two ownership catalogs; read them directly.
excluded_from_activation:
- All related_skills and see_also neighbors; adding an activated skill requires an explicit manifest revision
- research-literature
- worldenergydata-source-readiness
- llm-wiki broad maintenance workflow
- engineering-issue-workflow
- heavyweight cleanup skills
- all _archive and _archived trees
- provider-routing-guide model assignments and historical completion claims
validation:
  provider_parity: Requires observed native discovery and equivalent bounded fixture outcomes from both
    clients. Unavailable trials do not pass.
  effective_roots: Record retained global instructions and native skills; fixture location alone does
    not establish isolation.
  fixture_data: Synthetic only; cannot establish live dataset authority.
  digest_enforcement: Pilot verification checks these hashes; no CI consumer currently enforces profile
    digests.
  selection_limit: Explicit invocation/discovery fixtures do not establish unchanged implicit selection
    for domain-only prompts.
  fixture_actions: The current task read whitelist overrides generic skill checklists. Fixture answers
    must not authorize live status, stash, parent-directory or temporary-directory probes. No operational
    commands are executed.
  example_boundary: The mock-envelope walkthrough is optional and not bundled. Report its absence if relevant;
    do not expand the profile to execute it.
workspace_hub_base_revision: bf3f02580bf10b64f464510a8b8f2268602cdc22
revision_contract: The base revision anchors unchanged tools; activation hashes pin the edited pilot skill
  content. Resolve both before reusing evidence.

digest_verification: Hash actual working-file bytes by default. Only an entry declaring sha256_normalization crlf-to-lf permits replacing CRLF with LF before hashing; preserve all other bytes and reject unknown normalization modes. Never substitute HEAD blob hashes for changed working content.
