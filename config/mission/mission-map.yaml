# Ecosystem mission map — the mission spine
# Seeded for issue #3079 (epic #3078 — ecosystem mission → workflow → marketing flywheel)
# Grounded in a 4-agent discovery sweep (2026-06-14). Per the externalize-config rule,
# this file is the single reviewable source for "what each repo is for and how it ladders up".
#
# Iterate in PR review until the cascade reads seamlessly:
#   - every repo's `mission` visibly descends from `ecosystem.mission`
#   - no orphan (a repo whose mission serves no ecosystem objective)
#   - `explicit: false` entries get confirmed or corrected by the owner
#
# `explicit`  — true if the repo states its own mission in a file (README/CLAUDE.md); false if inferred here.
# `status`    — active | utility | reference | inferred | archive-candidate
schema_version: 0.1

ecosystem:
  mission: >
    Engineering Intelligence + Knowledge Infrastructure for Professional Practice —
    enable verifiable, data-driven engineering decisions and client delivery, backed by
    standards-traced calculation libraries, multi-domain knowledge wikis, a go-to-market
    stack, and personal/finance operations, all coordinated on a shared agent control-plane.
  objectives:
    - O1: Produce engineering results that are traceable to standards and reproducible.
    - O2: Bind source standards/data to practice as queryable knowledge.
    - O3: Convert capability into market position and client delivery.
    - O4: Keep the multi-repo, multi-machine agent system healthy and self-checking.
    - O5: Run personal/family finance and operations on the same disciplined harness.

tiers:
  control-plane:   {serves: [O4],        summary: "Orchestration, harness, agent coordination."}
  engineering-ip:  {serves: [O1],        summary: "Standards-traced engineering calculations & FEA."}
  knowledge-wiki:  {serves: [O2],        summary: "Knowledge corpora binding standards/data to practice."}
  gtm-marketing:   {serves: [O3],        summary: "Positioning, pipeline, delivery, business admin."}
  personal:        {serves: [O5],        summary: "Family finance, data, skills, research (by design separable)."}

repos:
  # ---- control-plane (O4) ----
  - repo: workspace-hub
    tier: control-plane
    mission: "Multi-repo control plane: orchestration, CI/CD, shared rules, agent coordination, memory, monitoring."
    objectives: [route work to machines/providers, enforce harness rules, carry portable memory]
    explicit: true
    status: active
  - repo: deckhand
    tier: control-plane
    mission: "Authenticated scope-gated git/gh automation gateway (Hermes); also a live demo surface."
    objectives: [scoped repo ops, deterministic live delivery channel]
    explicit: true
    status: active

  # ---- engineering-ip (O1) ----
  - repo: digitalmodel
    tier: engineering-ip
    mission: "Single source of truth for engineering calculations with standard-clause traceability."
    objectives: [standards-traced calcs, library-first APIs, golden-test provenance]
    explicit: true
    status: active
  - repo: assetutilities
    tier: engineering-ip
    mission: "Shared engineering calculation utilities: unit conversion, config, data I/O, lifecycle analysis."
    objectives: [reusable primitives for digitalmodel & friends]
    explicit: true
    status: active
  - repo: CAD-DEVELOPMENTS
    tier: engineering-ip
    mission: "AI-agent-driven FEA pipeline: parametric geometry → mesh → solve → post-process."
    objectives: [automate FEA workflow]
    explicit: true
    status: active   # experimental

  # ---- knowledge-wiki (O2) ----
  - repo: llm-wiki
    tier: knowledge-wiki
    mission: "Private generic engineering knowledge wiki: vendor-licensed codes/standards derived data (DNV, API, OCIMF, ABS, ISO, NACE, NORSOK)."
    objectives: [ingest+verify standards tables, serve queryable knowledge]
    explicit: true
    status: active
  - repo: llm-wiki-acma
    tier: knowledge-wiki
    mission: "Client-scoped private wiki for the ACMA project workspace with redaction/promotion gates."
    objectives: [per-client knowledge, no bleed to public]
    explicit: true
    status: active
  - repo: llm-wiki-fdas
    tier: knowledge-wiki
    mission: "Field Development Analysis System knowledge silo (Frontier Deepwater corpus)."
    objectives: [domain corpus ingest + analysis]
    explicit: false   # OPEN: confirm scope vs worldenergydata/aceengineer-strategy
    status: inferred
  - repo: worldenergydata
    tier: knowledge-wiki
    mission: "Python data library + unified CLI for BSEE/marine-safety/FDAS: economic, safety, production analysis."
    objectives: [public-data access + analysis framework]
    explicit: true
    status: active
  - repo: worldenergydata-wiki
    tier: knowledge-wiki
    mission: "Public-domain US federal energy-data wiki (BSEE, NOAA, USGS, MMS)."
    objectives: [public data corpus, CC-BY]
    explicit: true
    status: active
  - repo: raw-to-knowledge-playbook
    tier: knowledge-wiki
    mission: "Public peer-shareable methodology for bulk extraction→verification→ingestion of heterogeneous archives into LLM-queryable knowledge."
    objectives: [methodology + measured outcomes, credibility/marketing anchor]
    explicit: true
    status: active

  # ---- gtm-marketing (O3) ----
  - repo: aceengineer-website
    tier: gtm-marketing
    mission: "Public marketing + technical showcase site for AceEngineer."
    objectives: [positioning, blog, case studies]
    explicit: true
    status: active
  - repo: aceengineer-strategy
    tier: gtm-marketing
    mission: "Private business-strategy operations center: pipeline, competitive intel, experiments, OKR scorecard."
    objectives: [GTM motions, pipeline, content→outreach flywheel]
    explicit: true
    status: active
  - repo: aceengineer-admin
    tier: gtm-marketing
    mission: "Financial automation: invoicing, tax prep, business admin for AceEngineer Inc."
    objectives: [back-office automation]
    explicit: true
    status: active

  # ---- personal (O5) — in-ecosystem by harness, separable by design ----
  - repo: sabithaandkrishnaestates
    tier: personal
    mission: "Family investment management: CRE portfolio, corporate admin, tax, AI-assisted analysis."
    objectives: [portfolio tracking, admin]
    explicit: true
    status: active
  - repo: assethold
    tier: personal
    mission: "Stock portfolio analysis + daily trading-strategy signals (Fidelity integration)."
    objectives: [signals, technical/insider analysis]
    explicit: true
    status: active
  - repo: hobbies
    tier: personal
    mission: "Family reference knowledge base (gardening, sports, cultural, autism, personal development)."
    objectives: [reference only — no code/CI]
    explicit: true
    status: reference
  - repo: kaggle-rogii-2026
    tier: personal
    mission: "Kaggle competition: wellbore geology / TVT estimation from wireline logs (deadline 2026-08-05)."
    objectives: [competition entry]
    explicit: true
    status: active
  - repo: teamresumes
    tier: personal
    mission: "Markdown→HTML/PDF resume automation via GitHub Actions."
    objectives: [resume builder utility]
    explicit: true
    status: utility
  - repo: achantas-data
    tier: personal
    mission: "Personal/family data collection & knowledge."
    objectives: [TBD]
    explicit: false   # OPEN: minimal README — confirm purpose/scope
    status: inferred
  - repo: achantas-media
    tier: personal
    mission: "Personal/family media management."
    objectives: [TBD]
    explicit: false   # OPEN: no README — confirm purpose/scope
    status: inferred

