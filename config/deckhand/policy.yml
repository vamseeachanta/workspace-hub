# Deckhand — global enforcement policy  (PROPOSED, pending #2931 status:plan-approved)
#
# This file is the GENERIC, industry-grade policy surface. It contains NO tenant- or
# company-specific values — those live in scopes.yml / operators.yml / data-locations.yml.
# Code reads this file; code MUST NOT embed any of these values. Fail-closed if missing.
#
# Decisions: docs/governance/2026-06-01-deckhand-scope-routing-orthogonality-decision.md
#            docs/governance/2026-06-01-deckhand-scope-enforcement-below-model-decision.md
schema_version: 1

# Fail-closed everywhere: unknown scope, repo not in allowlist, unparseable/missing
# config, or unrecognized operator => DENY.
fail_closed: true

# What "destructive" means. Denied by default for every scope (a scope may NOT opt in
# without an explicit elevated grant — not expressible in the POC).
destructive_ops:
  - repo_delete
  - branch_delete        # push --delete, branch -D
  - tag_delete
  - release_delete
  - force_push           # history rewrite
  - reset_hard
  - git_clean

# Default action policy applied to every scope unless overridden per-scope in scopes.yml.
action_policy_defaults:
  pr_only: true                 # no direct push to default/protected branches
  allow_force_push: false
  diff_risk_gate:
    enabled: true
    deny_mass_deletion: true    # block commits that delete above a threshold w/o elevation
    mass_deletion_file_threshold: 25
    protected_paths:            # edits here require elevated approval (not in POC)
      - ".github/workflows/**"
      - "**/Dockerfile"
      - "**/*.env*"
      - "**/secrets/**"

# Reply clearance (codex BLOCKER 2): full-detail replies only to DMs or channels whose
# clearance matches the scope sensitivity; otherwise a generic "continue in DM" reply
# with no repo names / PR URLs / branch names / denial specifics.
reply_clearance:
  full_detail_requires: ["dm", "cleared_channel"]
  uncleared_reply: "continue in DM"

# Operator identity must be a stable platform id, never a display name/username.
identity:
  require_stable_platform_id: true
  normalize_fail_closed: true

# Audit: every decision (allow AND deny), PENDING before exec + FINAL after.
audit:
  record_allows: true
  record_denies: true
  pending_before_exec: true
  final_after_exec: true
  redact:                       # treated as sensitive for private-sensitivity scopes
    - repo_names
    - pr_urls
    - branch_names
    - operator_ids
    - error_specifics
  # WHERE the trail lives (global). Raw, unredacted -> DURABLE PRIVATE store (never public
  # workspace-hub). Redacted, ID-free summary -> public, rendered for review.
  raw_store:
    kind: append_only_file       # append_only_file | private_repo
    path: "${DECKHAND_AUDIT_DIR:-/mnt/dde/deckhand/audit}/decisions.ndjson"
  redacted_summary:
    path: "docs/reports/deckhand-audit-summary.html"
  feeds_canary: 2741             # destructive-action canary reads raw_store

# Enforcement layers (defense in depth). The scoped PAT is the load-bearing boundary
# because the local shell hook has known bypass paths (see POC plan recon).
enforcement:
  command_hook: true            # pre_tool_call hook on terminal + execute_code gate
  path_shim: true               # PATH-level git/gh wrapper for non-shell paths
  scoped_pat: true              # per-scope fine-grained GitHub PAT (server-side boundary)

# Kill switches (codex delegation review): global + targeted disable, no code change.
# Any true here => DENY the affected surface, fail-closed, audited.
kill_switches:
  disable_all_writes: false     # global read-only freeze
  disable_external_operators: false
  disabled_scopes: []           # e.g. [acma]
  disabled_operators: []        # stable platform ids
  disabled_platforms: []        # e.g. [telegram]

# Rate / abuse controls (codex review). Defaults; per-scope override allowed in scopes.yml.
rate_limits:
  per_operator_writes_per_hour: 30
  per_scope_writes_per_hour: 60
  github_secondary_ratelimit_backoff: true
  duplicate_request_window_seconds: 10

# Elevation policy for protected_paths / mass-deletion (codex review). Without a matching
# elevation grant, such edits are DENIED (not silently allowed).
elevation:
  required_for: [protected_paths, mass_deletion]
  approvers: []                 # stable platform ids permitted to grant elevation
  grant_ttl_seconds: 3600
  evidence_required: true       # elevation recorded in the audit trail
