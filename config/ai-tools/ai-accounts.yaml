# ai-accounts.yaml — which AI-provider ACCOUNT is logged in on which fleet host.
#
# Read by scripts/fleet/collect_account_usage_fleet.py (runs on the fleet
# collector VM) to fan out scripts/ai/assessment/collect-account-usage.py over
# ssh, and to group the per-host samples into per-ACCOUNT usage. Usage limits
# belong to the account, not the machine: two hosts logged in as the same
# account see the same five-hour and weekly windows.
#
# PUBLIC repository: hosts carry logical fleet labels only (see
# scripts/fleet/fleet_snapshot_labels.py); accounts carry a label, a holder
# ROLE and a fingerprint (first 12 hex of SHA-256 of the lowercased login
# email, as the probe prints it) -- never an address, a name or a plan seat id.
# The ssh alias of each host is the label itself; the collector's
# ~/.ssh/config maps labels to physical hosts (private, like
# ~/.config/workspace-hub/fleet-label-map.txt).
#
# `fingerprint: null` means "not yet confirmed": the first collection run
# prints each host's fingerprints in the report; paste them here so the
# aggregate can flag a host that was re-logged-in as a different account.
schema_version: 1

accounts:
  claude-owner:
    provider: claude
    holder: owner            # personal subscription; broader authorisations
    access: full
    fingerprint: 78d7e174f2d1   # confirmed 2026-09-26 from ace-linux-1/2, gpu-claw, fleet-collector probes; 2026-10-10 from ace-win-2 probe
  claude-professional:
    provider: claude
    holder: colleague        # professional seat; logged in on ace-win-1 only
    access: limited          # fewer authorisations (OAuth grants, org settings)
    fingerprint: c0c130b8018b   # confirmed 2026-10-10 from ace-win-1 probe (the only host on this seat)
  codex-owner:
    provider: codex
    holder: owner
    access: full
    fingerprint: 78d7e174f2d1   # confirmed 2026-09-26 from ace-linux-1/2, gpu-claw, fleet-collector probes; 2026-10-10 from ace-win-2 probe
  codex-professional:
    provider: codex
    holder: colleague
    access: limited
    fingerprint: c0c130b8018b   # confirmed 2026-10-10 from ace-win-1 probe (the only host on this seat)

# Hosts to probe. `hub_path` is where the workspace-hub checkout lives on that
# host (only used for logging; the probe is piped over stdin). `local: true`
# marks the collector itself (no ssh). Omit a provider key when that CLI is not
# logged in on the host.
hosts:
  ace-linux-1:
    os: linux
    hub_path: /mnt/local-analysis/workspace-hub
    claude: claude-owner
    codex: codex-owner
  ace-linux-2:
    os: linux
    hub_path: ~/ws/workspace-hub
    claude: claude-owner
    codex: codex-owner
  gpu-claw:
    os: linux
    hub_path: ~/ws/workspace-hub
    claude: claude-owner
    codex: codex-owner
  ace-win-2:
    os: windows
    hub_path: C:/ws/workspace-hub
    # Owner decision E05 (2026-10-09): this workstation is logged in as the
    # OWNER account for both CLIs, not the professional seat it was mapped to.
    # Confirmed by the local probe on the box and by the fleet collector run of
    # 2026-10-10T00:13Z (both providers print 78d7e174f2d1). ace-win-1 is now
    # the only host that can measure the professional seat.
    claude: claude-owner
    codex: codex-owner
  ace-win-1:
    os: windows
    hub_path: C:/ws/workspace-hub
    claude: claude-professional
    codex: codex-professional
    # ace-win-1 does not accept this VM's key on a direct path (not even
    # through a ProxyJump tunnel, where auth is end-to-end), so probe it via
    # the ace-win-2 double-hop; the inner ssh authenticates with ace-win-2's
    # own key. The powershell wrap runs a PS-native probe launcher because
    # ace-win-1's OpenSSH default shell (cmd) cannot run the sh-based launcher.
    # Hosts in this argv are fleet LABELS: the collector resolves each
    # `user@label` to its physical name from the private label map at run time
    # (collect_account_usage_fleet.py, owner decision H01).
    ssh: [/home/hatch/workspace/bin/ts-ssh, vamseea@ace-win-2, ssh, -o, BatchMode=yes, -o, ConnectTimeout=20, -o, StrictHostKeyChecking=no, vamseea@ace-win-1]
    remote_wrap: powershell
  fleet-collector:
    os: linux
    local: true
    hub_path: ~/ws/workspace-hub
    codex: codex-owner
    # add `claude: claude-owner` once the VM is logged in (probe: no accessToken)

# Routing thresholds used by the recommendation block of the aggregate.
policy:
  # Below this weekly headroom an account is "tight": stop starting marathons
  # on it and dispatch to the other account's hosts (matches the lane:codex
  # <10% gate in scripts/dispatch/route.py).
  tight_headroom_pct: 10
  # Prefer switching accounts only when the other one has at least this much
  # more weekly headroom; avoids ping-pong between near-equal accounts.
  switch_margin_pct: 15
  # Samples older than this are ignored when picking the freshest per account.
  max_sample_age_hours: 12
