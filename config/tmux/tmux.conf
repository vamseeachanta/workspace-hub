# workspace-hub shared tmux config
# Install: ln -sf "$(git rev-parse --show-toplevel)/config/tmux/tmux.conf" ~/.tmux.conf

# Prefix: C-a instead of C-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal — 256-color and true-color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Clipboard - OSC 52 passthrough so copies reach the LOCAL machine's
# clipboard over SSH. Requires an OSC 52-capable terminal (Ghostty,
# iTerm2, kitty, WezTerm). Silently inert on Apple Terminal.app.
set -g set-clipboard on
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\7'

# Mouse support
set -g mouse on

# Vi mode
setw -g mode-keys vi

# Vi copy-mode bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Intuitive pane splitting (| vertical, - horizontal) in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window inherits current path
bind c new-window -c "#{pane_current_path}"

# Status bar
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g status-left '[#S] '
set -g status-right '#H | %Y-%m-%d %H:%M'

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows on close
set -g renumber-windows on

# Faster escape (important for vim/vi users)
set -sg escape-time 10

# Increase scrollback (generous — long autonomous logs)
set -g history-limit 50000

# ---- Reboot survival: tmux-resurrect + tmux-continuum --------------------
# Sessions already survive disconnects (tmux server) and logouts (systemd
# linger), but NOT reboots. These plugins autosave session layout/cwd every
# 15 min and restore it when the tmux server first starts after boot.
#
# Install per machine with:  scripts/setup/deploy-tmux.sh
# (it pins the plugin refs; hand-cloning gives each box a different upstream
# HEAD, which is how the fleet drifted in the first place — #3784)
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
# Load order matters: continuum depends on resurrect's save/restore scripts.
if-shell "[ -r ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]" \
  "run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "[ -r ~/.tmux/plugins/tmux-continuum/continuum.tmux ]" \
  "run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux"

# ---- Make a missing-plugin box AUDIBLE (#3784) --------------------------
# This block previously ended with the comment "Machines without the plugins
# skip this block silently", and that silence is what let ace-linux-2 and
# gpu-claw sit for months looking configured while having no reboot survival
# at all. Absence of signal read as success.
#
# The warning hangs off client-attached rather than firing inline. tmux sources
# this file when the SERVER starts, which is before any client exists — an
# inline display-message would be written to nobody and would "work" in exactly
# the way that fooled us the first time.
if-shell "[ ! -r ~/.tmux/plugins/tmux-continuum/continuum.tmux ]" \
  "set-hook -g client-attached 'display-message -d 4000 \"tmux persistence plugins MISSING — no reboot survival. Run scripts/setup/deploy-tmux.sh\"'"
