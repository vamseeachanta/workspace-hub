# Canonical workspace-root layout policy shared across every workstation.
# Enforced by scripts/workstations/ws_hygiene_audit.py and .claude/rules/workstation-hygiene.md.
# Keep this file public-safe: no hostnames, mount paths, client names, or secrets.

schema_version: 1
canonical_root:
  posix: "~/ws"
  windows: "C:/ws"
  windows_home_alias: "~/ws (NTFS junction -> C:/ws; never delete recursively)"

root_rules:
  default_entry_type: git_repository
  allow_loose_files: false
  require_git_dir_for_unprefixed_dirs: true

reserved_system_dirs:
  _wt:
    purpose: "Linked git worktrees only (<repo-short>-<topic>). No loose files, standalone clones, venvs, or scratch folders."
    children_must_be_linked_worktrees: true
    allow_loose_files: false
  _pm:
    purpose: "Machine-local automation scripts, loop logs, and runtime state."
  _backups:
    purpose: "Verified local git bundles and pre-delete rescues (local only; never push refs/backup to GitHub)."
  _archive:
    purpose: "Verified cold repository archives and branch-protection snapshots."
  _scratch:
    purpose: "Single bounded scratch root (<topic>-<yyyymmdd>); remove or promote into a repo when the topic closes."

allowed_tool_dotdirs:
  - ".claude"

forbidden_root_patterns:
  - "wt-*"
  - ".wt"
  - ".scratch"
  - "_scratch-*"
  - "_scratch_*"
  - "_tw-scratch"
  - "_backup"
  - "outputs"
  - "Claude outputs"
  - "*.pre-rollout-*"
  - "*.pre-reset-*"
  - "*.failed-checkout"
  - ".ruff_cache"

retention_defaults:
  merged_clean_worktree_max_days: 7
  stopped_agent_temp_max_days: 2
  old_session_transcripts_max_days: 7
  protected_session_subdirs:
    - "memory"
  external_dataset_min_size_mb: 50
  external_dataset_min_managed_copies: 2
