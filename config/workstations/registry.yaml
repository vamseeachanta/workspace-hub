  ace-win-1:
    hostname: ace-win-1
    # 2026-08-01: the two real hostnames previously listed here were REMOVED, not
    # replaced. They named a box that is not this role and is absent from the
    # tailnet entirely, so they were both wrong AND infrastructure detail in a
    # PUBLIC repo. The host actually serving this role is recorded in the private
    # tier. Verified at four layers: tailnet membership, `hostname` over SSH, the
    # deckhand policy file present on the box, and the live licensed-run agent.
    hostname_aliases: [licensed-win-1]  # WF0 #3001: renamed from licensed-win-1
    os: windows
    role: simulation-license-host
    # Corrected 2026-08-01: the previous value is not a git repository on the box.
    workspace_root: 'D:\ws\workspace-hub'
    tier1_repo_root: 'D:\'
    repo_layout: sibling
    schedule_variant: contribute-minimal
    harness_profile:          # WF1 #2999 — converged; Windows deny subset from _base.deny_required_os.windows
      roles: [licensed-solver]
      managed: true
    # Corrected 2026-08-01. Inbound SSH was provisioned 2026-07-31 (Git Bash as
    # the OpenSSH DefaultShell), so `null` — "no channel exists" — is now false.
    # The alias resolves through the operator's private ssh_config; the address
    # is infrastructure detail and stays in the private tier.
    ssh: ace-win-1
    # Reachable, but deliberately not recorded here. Note the convention already
    # in this file: peer hosts carry synthetic 10.1.0.x values rather than their
    # real tailnet addresses. A wrong address would be worse than none.
    tailscale_ip: null
    capabilities:
      agent_clis: [claude, codex, gemini]
      languages: [bash]  # git-bash / MINGW64
      tools: [orcaflex, ansys, git, uv]
      gpu: false
    storage:
      local: 'D:\'                        # primary drive
      knowledge: null                      # no NFS — standalone
      remote_mounts: []
    repos:
      - OGManufacturing
    telegram_hermes:
      dispatch_enabled: false
      telegram_mode: desktop-status-only
      hermes_profile: windows-git-bash
      sync_policy: manual-status-only
      data_access_profile:
        repos: [OGManufacturing]
        storage_roots: ['D:\']
        remote_mounts: []
      readiness_freshness_thresholds:
        report_hours: 25
    notes: >
      Windows host for OrcaFlex and ANSYS licensed work. Git Bash (MINGW64) for
      scripts. Reachable over SSH since 2026-07-31 (the earlier "no SSH — access
      physically or via GUI" note is retired).

      SHARED TENANCY — other people's interactive sessions run on this host at
      the same time as anything dispatched to it. The wip cap of 2 in
      routing-rules.yaml is a courtesy constraint, not a throughput setting;
      saturating this box degrades their work and they cannot see why. See
      `shared_tenancy: true` there, enforced by
      tests/dispatch/test_shared_tenancy_cap.py.

      Orcina products REQUIRE the scheduled-task dispatch path: an SSH
      public-key logon token cannot complete a FlexNet checkout, and the failure
      surfaces at solve time, long after dispatch appears to have succeeded.

