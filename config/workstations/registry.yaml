# registry.yaml — Single source of truth for all workstations.
# Read by: scripts/cron/setup-cron.sh, scripts/operations/workstation-status.sh
# HARD RULE: all machine identity/capability data lives here.
# Hardware specs remain in .planning/archive/modules/hardware-inventory/ (detailed assessments).

machines:
  dev-primary:
    hostname: ace-linux-1
    hostname_aliases: [vamsee-linux1]
    os: linux
    role: primary-dev
    workspace_root: /mnt/local-analysis/workspace-hub
    tier1_repo_root: /mnt/local-analysis
    repo_layout: sibling
    schedule_variant: full
    ssh: ace-linux-1
    tailscale_ip: 10.1.0.1
    capabilities:
      agent_clis: [claude, gemini]
      languages: [python3, bash]
      tools: [uv, git, gh, npm, hermes]
      gpu: false
    storage:
      local: /mnt/local-analysis          # ext4, primary work partition
      knowledge: /mnt/ace                  # ext4, knowledge center (NFS-exported)
      remote_mounts:
        - /mnt/remote/ace-linux-2/dde      # sshfs to ace-linux-2:/mnt/dde
        - /mnt/remote/ace-linux-2/local-analysis
    repos:
      - workspace-hub
      - digitalmodel
      - assetutilities
      - worldenergydata
      - llm-wiki
      - assethold
      - aceengineer-website
      - aceengineer-strategy
      - aceengineer-admin
      - achantas-data
      - achantas-media
      - CAD-DEVELOPMENTS
      - hobbies
      - kaggle-rogii-2026
      - llm-wiki-acma
      - sabithaandkrishnaestates
      - teamresumes
    telegram_hermes:
      dispatch_enabled: true
      telegram_mode: coordinator
      hermes_profile: default
      bot_token_env: TELEGRAM_BOT_TOKEN
      allowed_user_ids_env: TELEGRAM_ALLOWED_USERS
      sync_policy: pull-before-work-push-after-work
      data_access_profile:
        repos: [workspace-hub, digitalmodel, assetutilities, worldenergydata, llm-wiki, assethold]
        storage_roots: [/mnt/local-analysis, /mnt/ace]
        remote_mounts:
          - /mnt/remote/ace-linux-2/dde
          - /mnt/remote/ace-linux-2/local-analysis
      readiness_freshness_thresholds:
        report_hours: 25
    tier1_baseline:
      version: 1
      source_issues:
        tier1_decision: 2770
        relocation_reconciliation: 2766
      repo_root: /mnt/local-analysis
      workspace_root: /mnt/local-analysis/workspace-hub
      layout: sibling
      required: [workspace-hub, digitalmodel, assetutilities, worldenergydata, llm-wiki, assethold]
      optional: [aceengineer-website, aceengineer-strategy]
      reference_only: []
      not_planned: []
      non_tier1_machine_access_current:
        - aceengineer-admin
        - achantas-data
        - achantas-media
        - CAD-DEVELOPMENTS
        - hobbies
        - kaggle-rogii-2026
        - llm-wiki-acma
        - sabithaandkrishnaestates
        - teamresumes
      historically_moved_not_currently_present:
        acma-projects:
          source_issue: 2766
          source_comment: 4497956095
          prior_claim: sibling=git
          latest_probe: absent
          warning: historical_state_changed_since_prior_comment
        client_projects:
          source_issue: 2766
          source_comment: 4497956095
          prior_claim: sibling=git
          latest_probe: absent
          warning: historical_state_changed_since_prior_comment
        doris:
          source_issue: 2766
          source_comment: 4497956095
          prior_claim: sibling=git
          latest_probe: absent
          warning: historical_state_changed_since_prior_comment
        frontierdeepwater:
          source_issue: 2766
          source_comment: 4497956095
          prior_claim: sibling=git
          latest_probe: absent
          warning: historical_state_changed_since_prior_comment
        OGManufacturing:
          source_issue: 2766
          source_comment: 4497956095
          prior_claim: sibling=git and registry-runtime-access
          latest_probe: absent
          warning: historical_state_changed_since_prior_comment
          runtime_access_change: remove_from_data_access_profile
        rock-oil-field:
          source_issue: 2766
          source_comment: 4497956095
          prior_claim: sibling=git
          latest_probe: absent
          warning: historical_state_changed_since_prior_comment
        saipem:
          source_issue: 2766
          source_comment: 4497956095
          prior_claim: sibling=git
          latest_probe: absent
          warning: historical_state_changed_since_prior_comment
        sd-work:
          source_issue: 2766
          source_comment: 4497956095
          prior_claim: sibling=git
          latest_probe: absent
          warning: historical_state_changed_since_prior_comment
        seanation:
          source_issue: 2766
          source_comment: 4497956095
          prior_claim: sibling=git
          latest_probe: absent
          warning: historical_state_changed_since_prior_comment
      infrastructure_dirs: [agent-worktrees]
      placement_rules:
        root_git_self_allowed: true
        direct_nested_git_policy: error
        required_absence_policy: error
        optional_absence_policy: warning
        non_tier1_absence_policy: warning
        historical_absence_policy: warning
        historical_state_changed_since_prior_comment_policy: warning
        unknown_sibling_git_policy: warning
        upstream_policy:
          required: error
          optional: warning
          non_tier1_machine_access_current: warning
        dirty_policy:
          required: warning
          optional: warning
          non_tier1_machine_access_current: warning
        ahead_policy:
          required: warning
          optional: warning
          non_tier1_machine_access_current: warning
        behind_policy:
          required: warning
          optional: warning
          non_tier1_machine_access_current: warning
    notes: >
      Primary dev workstation. All nightly scheduled tasks run here.
      NFS server for /mnt/ace knowledge center.

  dev-secondary:
    hostname: ace-linux-2
    hostname_aliases: []
    os: linux
    role: secondary-dev
    workspace_root: /mnt/local-analysis/workspace-hub
    schedule_variant: contribute
    ssh: ace-linux-2
    tailscale_ip: 10.1.0.2
    capabilities:
      agent_clis: [claude]
      languages: [python3, bash]
      tools: [blender, openfoam, freecad, gmsh, paraview, calculix, meshio, capytaine, tmux, uv, git, gh, hermes]
      gpu: nvidia-t400
    storage:
      local: /mnt/dde                     # primary work partition
      knowledge: null                      # NFS client — mounts ace-linux-1:/mnt/ace
      remote_mounts: []
    repos:
      - digitalmodel
      - worldenergydata
    telegram_hermes:
      dispatch_enabled: true
      telegram_mode: worker
      hermes_profile: linux-worker
      bot_token_env: TELEGRAM_BOT_TOKEN
      allowed_user_ids_env: TELEGRAM_ALLOWED_USERS
      sync_policy: pull-before-work-push-after-work
      data_access_profile:
        repos: [digitalmodel, worldenergydata]
        storage_roots: [/mnt/dde]
        remote_mounts: []
      readiness_freshness_thresholds:
        report_hours: 25
    notes: >
      Secondary dev workstation. Open-source FEA/CFD simulation stack.
      NFS client, memory backup target.

  licensed-win-1:
    hostname: licensed-win-1
    hostname_aliases: []
    os: windows
    role: simulation-license-host
    workspace_root: 'D:\workspace-hub'
    schedule_variant: contribute-minimal
    ssh: null  # no SSH — physical/GUI access only
    tailscale_ip: null
    capabilities:
      agent_clis: [claude, codex, gemini]
      languages: [bash]  # git-bash / MINGW64
      tools: [orcaflex, ansys, git]
      gpu: false
    storage:
      local: 'D:\'                        # primary drive
      knowledge: null                      # no NFS — standalone
      remote_mounts: []
    repos:
      - OGManufacturing
    telegram_hermes:
      dispatch_enabled: false
      telegram_mode: desktop-status-only
      hermes_profile: windows-git-bash
      sync_policy: manual-status-only
      data_access_profile:
        repos: [OGManufacturing]
        storage_roots: ['D:\']
        remote_mounts: []
      readiness_freshness_thresholds:
        report_hours: 25
    notes: >
      Windows workstation. Hosts OrcaFlex and ANSYS licenses.
      No SSH — access physically or via GUI. Git Bash (MINGW64) for scripts.

  licensed-win-2:
    hostname: licensed-win-2
    hostname_aliases: []
    os: windows
    role: simulation-secondary
    workspace_root: 'D:\workspace-hub'
    schedule_variant: contribute-minimal
    ssh: null
    tailscale_ip: null
    capabilities:
      agent_clis: [claude, codex, gemini]
      languages: [bash]
      tools: [orcaflex, ansys, git]
      gpu: false
    repos:
      - OGManufacturing
    telegram_hermes:
      dispatch_enabled: false
      telegram_mode: desktop-status-only
      hermes_profile: windows-git-bash
      sync_policy: manual-status-only
      data_access_profile:
        repos: [OGManufacturing]
        storage_roots: ['D:\']
        remote_mounts: []
      readiness_freshness_thresholds:
        report_hours: 25
    storage:
      local: 'D:\'
      knowledge: null
      remote_mounts: []
    notes: >
      Secondary Windows workstation. Mirrors licensed-win-1 capabilities.

  macbook-portable:
    hostname: Vamsees-MacBook-Air
    hostname_aliases: [Vamsees-MacBook-Air.local]
    os: macos
    role: portable-dev
    workspace_root: /Users/krishna/workspace-hub
    schedule_variant: none
    ssh: null  # no SSH from Linux hosts
    tailscale_ip: null
    capabilities:
      agent_clis: [claude]
      languages: [python3, bash]
      tools: [uv, git, gh]
      gpu: false
    storage:
      local: /Users/krishna                 # macOS home directory
      knowledge: null                        # no NFS — standalone portable
      remote_mounts: []
    repos:
      - workspace-hub
    telegram_hermes:
      dispatch_enabled: false
      telegram_mode: desktop-status-only
      hermes_profile: macos-manual
      sync_policy: manual-status-only
      data_access_profile:
        repos: [workspace-hub]
        storage_roots: [/Users/krishna]
        remote_mounts: []
      readiness_freshness_thresholds:
        report_hours: 25
    notes: >
      Portable macOS workstation. No cron — manual or launchd-based scheduling.
      Path conventions differ from Linux (/Users/ vs /home/).
      Some Linux-specific kernel/GPU tools not applicable.

  gali-linux-compute-1:
    hostname: shoerack
    hostname_aliases: []
    os: linux
    role: gpu-compute
    workspace_root: null  # not yet configured
    schedule_variant: none
    ssh: null  # access method TBD (Tailscale or direct LAN)
    tailscale_ip: null
    capabilities:
      agent_clis: []  # not yet set up
      languages: [python3, bash]
      tools: [cuda]
      gpu: rtx-3090x2
    repos: []
    telegram_hermes:
      dispatch_enabled: false
      telegram_mode: disabled
      hermes_profile: not-onboarded
      sync_policy: none
      data_access_profile:
        repos: []
        storage_roots: []
        remote_mounts: []
      readiness_freshness_thresholds:
        report_hours: 25
    notes: >
      GPU compute node — 2x RTX 3090 (48 GB VRAM), 128 GB RAM.
      Not yet onboarded to workspace-hub. Route heavy ML/CUDA workloads here.
      Boot drive at 89% — needs cleanup before heavy use.
