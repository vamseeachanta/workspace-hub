# harness-state-classes.yaml — local-state classification for the reconciler (#2968, F1).
#
# Every item of machine-local harness state belongs to exactly one class. The reconciler
# (scripts/readiness/harness_reconcile.py) WRITES only role-managed state; everything else
# is read-only or off-limits. An item matching NO class that is present locally is
# `uncataloged-live` and BLOCKS `--apply` until explicitly classified (Codex blast-radius
# mitigation). See epic #2967 managed-surface contract.

classes:
  role-managed:
    description: converged to git base + role overlay (harness-roles.yaml)
    items:
      - permissions.deny           # _base deny-list
      - effortLevel                # control-plane scalar
      - skill_families             # declarative (skill-tree convergence)
  git-managed:
    description: already synced by git pull; reconciler does not touch
    items:
      - .claude/settings.json (project)
      - .claude/rules/
      - .claude/skills/
  machine-private:
    description: legitimately per-machine; never converged
    items:
      - theme
      - /mnt/workspace-hub symlink (a2 only)
      - statusLine.command (resolves repo root locally)
      - gpu / sim tool config
  secret:
    description: credentials — git declares required KEYS, never values; reconciler NEVER reads
    items:
      - ~/.hermes/.env
      - ~/.codex/auth.json
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_ALLOWED_USERS
  intentionally-divergent:
    description: explicitly allowed to differ per machine (reconciler skips these keys)
    items:
      - theme
      - spinnerVerbs
      - voiceEnabled

# Cataloged hooks — present hooks whose identity matches one of these are NOT flagged
# uncataloged-live. Substring (command_contains) form keeps the catalog portable across
# machines whose hook commands carry absolute paths.
hooks_known:
  - event: Stop
    type: command
    command_contains: ["skill-extractor.py"]
    class: role-managed            # the per-session skill extractor (a1 today; role-invariant target)
  - event: SessionStart
    type: command
    command_contains: [".consolidate-lock", "dream"]
    class: role-managed            # stale dream-lock reaper

# Preserve active cron entries maintained by other repositories.
# Fingerprints match stable working-directory and script identity.
preserved_external:
  - owner: llm-wiki
    note: >-
      6-hourly O&G-Standards corpus-ingest campaign (cron_ingest.sh) owned by the SEPARATE
      llm-wiki repo (canonical clone /mnt/local-analysis/llm-wiki).
      Stable bits: /llm-wiki cwd-path fragment + cron_ingest.sh basename. Does NOT pin the
      full command, the # campaign comment, or the /bin/bash prefix so the match survives a
      log-redirect/wrapper/path change. Keep verbatim; the workspace-hub cutover never owns it.
    fingerprint:
      cwd_contains: /llm-wiki
      script_basename: cron_ingest.sh
  - owner: external-private-repo
    note: >-
      Weekday trading-hours cron owned by a SEPARATE private personal-automation repo (NOT
      workspace-hub), run on a CRON_TZ=America/New_York schedule. Stable bit: the market-alerts/cron.sh
      path fragment only — intentionally does NOT name the owning repo (PII hygiene, epic #3095) or pin
      the schedule/comment. Keep verbatim; the workspace-hub cutover never owns it.
    fingerprint:
      command_contains: market-alerts/cron.sh

# Preserved-LOCAL crons (#2988, F2 follow-up) — machine-local workspace-hub maintenance
# crons that are NOT in the role catalog and NOT externally-owned. Functionally identical
# to preserved_external (the cron reconciler keeps them verbatim, never manages/deletes
# them), but semantically these are the host's own workspace-hub scripts run with a
# machine-specific invocation. `owner` records provenance; classification is global, so use
# exact legacy lines for catalog-owned variants and stable command fingerprints only when the
# command is intentionally preserved on every role where it appears.
preserved_local:
  - owner: ace-linux-2
    note: >-
      a2-local model-ID refresh variant (scripts/maintenance/update-model-ids.sh --hub-only).
      Distinct from the control-plane `model-ids` task (scripts/cron/update-model-ids.sh,
      a1-only). a2 self-maintains its model registry; keep verbatim.
    fingerprint:
      command_contains: scripts/maintenance/update-model-ids.sh
  - owner: ace-linux-2
    note: >-
      a2-local skills-curation variant (raw `claude --skill skills-curation`). Distinct
      from the control-plane skills-curation task (scripts/cron/skills-curation.sh). Keep verbatim.
    fingerprint:
      command_contains: "--skill skills-curation"
  - owner: ace-linux-1
    catalog_task_id: session-curation
    note: >-
      Exact pre-managed-block invocation of the cataloged session-curation task. Treat it as
      catalog-owned so transactional cutover removes the duplicate and renders one canonical copy.
    legacy_exact_lines:
      - id: ace-linux-1-pre-managed-block
        line: '47 */6 * * * mkdir -p $WORKSPACE_HUB/logs/monitoring && PATH=$HOME/.local/bin:$PATH; cd /mnt/local-analysis/workspace-hub && bash scripts/curation/curate-session-memory.sh >> /mnt/local-analysis/workspace-hub/logs/monitoring/session-curation-$(date +\%Y-\%m-\%d).log 2>&1'
  - owner: ace-linux-1
    catalog_task_id: equality-matrix-refresh
    note: >-
      Exact pre-managed-block invocation of the cataloged equality-matrix-refresh task. Treat it
      as catalog-owned so transactional cutover removes the duplicate and renders one canonical copy.
    legacy_exact_lines:
      - id: ace-linux-1-pre-managed-block
        line: '50 */6 * * * PATH=$HOME/.local/bin:$PATH; cd /mnt/local-analysis/workspace-hub && bash scripts/readiness/equality-matrix-cron.sh >> /mnt/local-analysis/workspace-hub/logs/quality/equality-refresh-$(date +\%Y-\%m-\%d).log 2>&1'
  - owner: ace-linux-1
    catalog_task_id: notification-purge
    note: >-
      a1-local notification-log retention sweep. A machine-specific invocation (absolute
      `cd /mnt/local-analysis/workspace-hub` rather than the catalog's `$WORKSPACE_HUB`) of the
      same purge the `notification-purge` catalog task performs, so the 60-char catalog key
      (`cd $WORKSPACE_HUB && find logs/notifications/...`) does not substring-match it and it
      would otherwise read as uncataloged. Appears DUPLICATED in a1's crontab; the cutover treats
      it as catalog-owned when `notification-purge` is selected, deduping old live copies into the
      managed block. Stable bits: the find target + the -delete action, not the cd path or stderr
      redirect.
    legacy_exact_lines:
      - id: ace-linux-1-absolute-workspace
        line: '30 4 * * * cd /mnt/local-analysis/workspace-hub && find logs/notifications/ -name "*.jsonl" -mtime +7 -delete 2>/dev/null || true'
