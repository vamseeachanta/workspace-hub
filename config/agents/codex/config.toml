# Owned Codex fleet baseline (#3555). Machine-local model selection stays local.
# TUI selector attestation: Codex CLI 0.146.0, inspected 2026-08-02.
# Source allowlist: codex-rs/tui footer selectors at the 0.146.0 release.
plan_mode_reasoning_effort = "high"
personality = "pragmatic"
web_search = "live"

[features]
default_mode_request_user_input = true
goals = true
multi_agent = true
hooks = true

[agents]
enabled = true
interrupt_message = true

[tui]
resume_cwd = "session"
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "current-dir",
  "five-hour-limit",
  "weekly-limit",
]
