type: object
additionalProperties: false
propertyNames:
  not:
    enum:
      - raw_data
      - data_dump
      - client_payload
      - source_text
required:
  - manifest_id
  - issue
  - source_ids
  - source_registry_kind
  - source_registry_ref
  - input_residency
  - output_residency
  - tool
  - machine
  - provider_tool
  - command_manifest
  - regeneration_command
  - replay_command
  - environment_pin
  - outputs
  - checksums
  - test_evidence
  - legal_scan_evidence
  - review_artifact_paths
  - promotion_gates
  - report_eligible
properties:
  manifest_id: {type: string}
  issue: {type: string}
  source_ids:
    type: array
    minItems: 1
    items: {type: string}
  source_registry_kind:
    enum:
      - mounted_source_registry
      - repo_registry
      - document_index_registry
      - manual_seed
      - unavailable
  source_registry_ref: {type: string}
  input_residency:
    enum:
      - raw_data
      - readable_raw_data
      - owner_repo_checkout
      - target_repo_checkout
      - domain_private_corpus
      - registered_client_private_corpus
      - public_llm_wiki
  output_residency:
    enum:
      - public_llm_wiki
      - domain_private_corpus
      - registered_client_private_corpus
      - ignored_internal_run_artifact
      - no_preserve
  tool: {type: string}
  machine: {type: string}
  provider_tool: {type: string}
  command_manifest:
    type: object
    additionalProperties: false
    required: [working_directory, command]
    properties:
      working_directory: {type: string}
      command: {type: string}
  regeneration_command: {type: string}
  replay_command: {type: string}
  environment_pin: {type: string}
  outputs:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - path
        - kind
        - report_handoff
        - output_residency
      properties:
        path: {type: string}
        kind: {type: string}
        report_handoff: {type: boolean}
        output_residency:
          enum:
            - public_llm_wiki
            - domain_private_corpus
            - registered_client_private_corpus
            - ignored_internal_run_artifact
            - no_preserve
  checksums:
    type: object
    minProperties: 1
    propertyNames:
      not:
        enum: [raw_data, data_dump, client_payload, source_text]
    additionalProperties:
      type: string
      minLength: 1
  test_evidence:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      propertyNames:
        not:
          enum: [raw_data, data_dump, client_payload, source_text]
      required: [command, result]
      properties:
        command: {type: string, minLength: 1}
        result:
          enum:
            - pass
            - fail
            - pending-required-before-publication
  legal_scan_evidence:
    type: object
    additionalProperties: false
    required: [command, result]
    properties:
      command: {type: string, minLength: 1}
      result:
        enum:
          - pass
          - fail
          - pending-required-before-publication
          - required-before-publication
  review_artifact_paths:
    type: array
    minItems: 1
    items: {type: string, minLength: 1}
  promotion_gates:
    type: array
    items:
      enum:
        - provenance
        - license
        - legal
        - sanitization
        - owner-review
  report_eligible: {type: boolean}
allOf:
  - if:
      properties:
        source_registry_kind:
          const: unavailable
    then:
      properties:
        report_eligible:
          const: false
  - if:
      properties:
        output_residency:
          const: public_llm_wiki
    then:
      properties:
        promotion_gates:
          allOf:
            - contains: {const: provenance}
            - contains: {const: license}
            - contains: {const: legal}
            - contains: {const: sanitization}
            - contains: {const: owner-review}
  - if:
      properties:
        outputs:
          contains:
            type: object
            properties:
              output_residency:
                const: public_llm_wiki
    then:
      properties:
        promotion_gates:
          allOf:
            - contains: {const: provenance}
            - contains: {const: license}
            - contains: {const: legal}
            - contains: {const: sanitization}
            - contains: {const: owner-review}
  - if:
      properties:
        report_eligible:
          const: true
    then:
      properties:
        legal_scan_evidence:
          properties:
            result:
              const: pass
        checksums:
          additionalProperties:
            type: string
            pattern: ^sha256:[a-fA-F0-9]{64}$
        outputs:
          contains:
            type: object
            properties:
              report_handoff:
                const: true
