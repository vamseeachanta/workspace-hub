workflow:
- {evidence_requirement: scope provenance and authorization state, id: intake, input: authorized intake brief and public AOI, output: approved research scope, owner: broker_project_manager, stop_condition: scope requires outreach or private data}
- {evidence_requirement: source-linked tract assumptions, id: aoi_tract_decomposition, input: approved AOI and public reference maps, output: tract and jurisdiction worklist, owner: landman, stop_condition: tract identity cannot be stated as research evidence}
- {evidence_requirement: 'named source, exception, and review gates', id: work_plan, input: tract worklist and source constraints, output: sequenced assignment plan, owner: broker_project_manager, stop_condition: required source needs a paid portal or account}
- {evidence_requirement: 'role, due state, and stop condition', id: assignment, input: reviewable assignment plan, output: bounded landman or trainee task, owner: broker_project_manager, stop_condition: task crosses a title-review responsibility}
- {evidence_requirement: 'observed timestamp, confidence, and limitation', id: evidence_capture, input: bounded public-source task, output: claim ledger with source links, owner: landman, stop_condition: claim lacks public provenance}
- {evidence_requirement: unresolved boundary and escalation reason, id: exception_handling, input: 'unavailable, conflicting, or manual-only evidence', output: classified exception record, owner: title_examiner, stop_condition: exception would require a title opinion}
- {evidence_requirement: coverage and limitation review, id: qa_signoff, input: evidence ledger and exception record, output: versioned risk signoff, owner: underwriter, stop_condition: material uncertainty is not disclosed}
- {evidence_requirement: review version and source manifest, id: packet_delivery, input: signed-off public research packet, output: delivery packet and next-step queue, owner: broker_project_manager, stop_condition: packet implies legal advice or ownership}
