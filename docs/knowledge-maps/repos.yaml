sources:
- gh repo list vamseeachanta --limit 200 --json name,visibility,isArchived,defaultBranchRef,pushedAt,description
- GitHub commits API (root and head of each default branch)
- .claude/rules/workstation-hygiene.md (worktrees, not clones)
- .claude/rules/merge-cleanup.md (inspect before removal)
- .claude/rules/wiki-sibling-routing.md and config/client-wikis.yml (client wikis by codename)
- 'fleet-ops (private): ECOSYSTEM.md, dashboard/lean-migration.json, dashboard/ecosystem-status.json, issue #691'
refresh:
  cadence: After every lean reset or clone rollout, and with the 6-hourly fleet consistency run
  commands:
    catalogue: gh repo list vamseeachanta --limit 200 --json name,visibility,isArchived,defaultBranchRef,pushedAt,description
    origin_root_via_api: 'gh api -i ''repos/vamseeachanta/<repo>/commits?sha=<default>&per_page=1''  # read rel="last" page N, then: gh api ''repos/vamseeachanta/<repo>/commits?sha=<default>&per_page=1&page=N''
      --jq ''.[0].sha'''
    origin_root_via_clone: git -C <W>/<repo> rev-list --max-parents=0 origin/<default>
    head_root: git -C <clone> rev-list --max-parents=0 HEAD
    ahead_behind: git -C <clone> rev-list --left-right --count HEAD...@{u}
    dirty: GIT_OPTIONAL_LOCKS=0 git -C <clone> status --porcelain --ignore-submodules=dirty | wc -l
    linked_worktrees: 'git -C <clone> worktree list --porcelain | grep -c ''^worktree ''   # minus 1'
    stash: git -C <clone> stash list | wc -l
    find_clones: 'find <W> -maxdepth 3 -name node_modules -prune -o -name .git -type d -print   # a .git DIRECTORY is a clone; a .git file is a worktree'
    remote_host: 'scp scan.sh <host>:/tmp/ && ssh -o BatchMode=yes -o ConnectTimeout=10 <host> ''bash /tmp/scan.sh <W>''   # read-only; no fetch'
  note: The scan makes no fetch, so 'behind' is measured against each clone's last fetch; tracking_ref_current compares that ref with the origin head read from the
    API.
standard:
  rules:
  - .claude/rules/workstation-hygiene.md
  - .claude/rules/merge-cleanup.md
  - 'fleet-ops issue #691 (private): after a lean reset, never work or pull from an old clone; slim-clone reset repos first'
  equal_across_machines_means:
  - Each machine that holds a repository holds exactly one canonical clone of it, at <W>/<repo>.
  - The canonical clone's HEAD root commit equals the root of origin's default branch (a pre-reset clone fails this).
  - The canonical clone sits on its default branch, clean, with no stash, and not behind origin after a fetch.
  - All other work is a linked worktree under <W>/_wt/<repo-short>--<slug>; <W>/_wt holds no full clones.
  - No pre-reset copies (<repo>.pre-rollout-*) remain once their local-only work is bundled and restore-tested.
  - 'Placement rules hold: achantas-data stays on WS014 only; rds02 never holds achantas-data.'
  not_required: Every machine holding every repository. No per-host required-repository list is on main (see open_questions).
