title: Repositories - catalogue, lean-reset roots and the one-clone-per-machine standard
purpose: Lists every public repository under the owner account with its purpose, default branch, lean-reset root and owner lane, and states what 'equal across machines'
  means for clones. Private repositories, clone paths, per-machine measurements and deviations are held in the private detail map.
