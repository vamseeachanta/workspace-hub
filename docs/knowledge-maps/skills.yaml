    gemini: ".agents/skills overrides .gemini/skills on conflict (observed 2026-06-11); current execution unverified"
    hermes: "hermes skill directories; archive dirs excluded by config/agents/hermes/patches/exclude-archive-skill-dirs.patch"
    agy: "reference runtime artifact only (issue 3573); no skill surface wired"
