      category_nested_skills: 473 in 25 category folders
      non_skill_content: "eng/ holds 8 flat .md skill notes with no SKILL.md; _runtime/session-logs holds logs; marketing/, science/, travel/ hold only an index, shared files or templates"
      readme: ".claude/skills/README.md states 298 hub skills across 9 domains (generated by WRK-205); the tree now holds 477"
    - path: .agents/skills
      role: "cross-provider copy for Codex native project discovery (scripts/skills/native_skill_root.py) and historical Gemini consumer; periodic copy with provider rewrites; last bulk sync 2026-05-04"
      active_skill_md: 965
      archived_skill_md: 2100
      overlap_with_canonical: "416 paths in both: 333 identical, 83 differ; 61 canonical skills have no copy; 549 copy-only skills (families such as mlops, creative, apple, travel, smart-home)"
    - path: .claude/commands
      role: Claude Code slash commands (natively discovered, invoked as /<group>:<name>)
