  rules:
    path: .claude/rules
    loaded_by: "Claude Code project rules (every file in the folder is loaded in a session started inside workspace-hub)"
    files:
      - {file: README.md, purpose: index of the rule files}
      - {file: calc-citation-contract.md, purpose: "emit a Citation sidecar (code_id, publisher, revision, source_sibling) for every standards-derived constant; fail closed at calc time"}
      - {file: codes-standards-data-routing.md, purpose: "28 Oct 2026 ruling: no gates on internal use of codes and standards; quote and rebuild in reports; CFR check on every job; placement of extracted data"}
      - {file: coding-style.md, purpose: "edit safety, path handling, 20-line cap on AGENTS.md/MEMORY.md/GEMINI.md, CLAUDE.md retired as a repo file, staged Claude loader migration"}
      - {file: completeness-before-close.md, purpose: "completeness score (0-100) verified by a non-author before closing an enrolled issue; Level-3 GitHub Action gate"}
      - {file: engineering-register.md, purpose: "one writing register for all output; Level-2 check-engineering-register.py"}
      - {file: goal-invocation.md, purpose: "consult the /goal catalogue (#2695) and weekly picklist before invoking /goal"}
      - {file: human-decision-boards.md, purpose: "owner decisions go on a local HTML decision board; saves write JSON beside the page"}
      - {file: licensed-solver-dispatch.md, purpose: "OrcaFlex/OrcaWave only through the Scheduled-Task path; its licence-server ports; one Orcina seat licenses a session"}
      - {file: mechanism-before-publication.md, purpose: "read the tool source and existing output before publishing a causal claim; label hypotheses"}
      - {file: merge-authorization.md, purpose: "team merges on green required checks with a pinned squash, no branch delete; holds apply; registered direct-main exemptions"}
      - {file: merge-cleanup.md, purpose: "remove the worktree after a merge; branch deletion only with a bundle and a #577 log entry"}
      - {file: model-routing.md, purpose: "which provider takes which lane; quota-resilience commit cadence; account headroom file"}
      - {file: patterns.md, purpose: "enforcement gradient: prose, micro-skill, script, hook"}
      - {file: report-audience-and-surface.md, purpose: "internal, client-deliverable and hosted surfaces; identifier handling per surface; leak remediation by layer"}
      - {file: reproducibility-is-not-correctness.md, purpose: "every physics or calculation artifact carries one comparator the producer did not make; conservation check first"}
      - {file: scheduler-mutation-safety.md, purpose: "scheduler mutators registered in config/scheduled-tasks/mutation-surfaces.yaml; snapshot, backup, CAS write and rollback"}
      - {file: shell-test-helper-guards.md, purpose: "shell harness helpers defined unconditionally; load-bearing substitutions checked; empty records rejected"}
      - {file: soul-deployment-drift.md, purpose: "a machine loads what origin/main holds; Level-2 check-soul-deployment-drift.sh"}
      - {file: svg-pdf-portability.md, purpose: "no pattern/clipPath/filter/mask in PDF-bound or logo SVG; verify with pdftocairo"}
      - {file: verify-ci-lint-toolchain.md, purpose: "run the exact CI lint toolchain and versions before pushing"}
      - {file: wiki-sibling-routing.md, purpose: "llm-wiki and llm-wiki-<client> routing, visibility frontmatter, cross-sibling link rules"}
      - {file: windows-junction-restore-safety.md, purpose: "probe LinkType before restoring or deleting a shared-skill link path; junction children belong to the target"}
      - {file: workstation-hygiene.md, purpose: "worktrees not clones; remove what is on origin; bulky output via manifest-and-fetch; divide work across live sessions"}
  agent_roles:
    path: .claude/agents
    files:
      - {name: scout, purpose: "find code, data, prior work, open issues and risks before a lane is planned; read-only"}
      - {name: explorer, purpose: "open questions: 3-5 options with trade-offs and one recommendation; read-only"}
      - {name: builder, purpose: "implement one lane of an objective in its own worktree with TDD, touching only owned paths"}
      - {name: verifier, purpose: "independent check of a returned result or PR; Claude side of cross-provider review"}
      - {name: gap-checker, purpose: "compare returned work against the objective's Done-when and constraints"}
      - {name: reporter, purpose: "draft issue comments, PR bodies, status updates or wiki pages; drafts only"}
      - {name: orcaflex-specialist, purpose: "OrcaFlex/OrcaWave models, mooring and riser analysis"}
      - {name: cfd-lane-operator, purpose: "advance a hull-resistance CFD matrix through its gates and produce the final report"}
    portable_definition: "config/agents/agent-defs/reviewer.agent.yaml (one worker defined once, materialised per harness by scripts/agents/build-agent-runtime.sh; tool allowlist enforced on Claude, advisory on Codex/Gemini)"
    coordinator: docs/standards/COORDINATOR_PROTOCOL.md; host routing config/agents/host-role-routing.yaml
  provider_instruction_files:
    shared_source: {file: config/agents/SHARED_SOUL.md, lines: 201, role: "cross-provider identity, authority and gates; hand-edited"}
    repo_contract: {file: AGENTS.md, lines: 20, role: "canonical repository contract, capped at 20 lines"}
    build: "scripts/agents/build-soul-runtime.sh builds each <provider>/SOUL.runtime.md from SHARED_SOUL.md + the provider delta; runtime files are never hand-edited; scripts/enforcement/check-soul-runtime-drift.sh checks build drift"
    install: "scripts/agents/install-soul-runtime.sh links <home>/.codex/AGENTS.md and <home>/.hermes/SOUL.md; validates and preserves the Claude link; does not install gemini or agy"
    providers:
      - {provider: claude, delta: config/agents/claude/SOUL.delta.md, runtime: config/agents/claude/SOUL.runtime.md, destination: "<home>/.claude/CLAUDE.md (legacy) or <home>/.claude/rules/workspace-soul.md (native), resolved by scripts/agents/claude_runtime_state.py", deploy_policy: "installable; symlink required plus loader admission"}
      - {provider: codex, delta: config/agents/codex/SOUL.delta.md, runtime: config/agents/codex/AGENTS.runtime.md, destination: <home>/.codex/AGENTS.md, deploy_policy: "installable; symlink required"}
      - {provider: hermes, delta: config/agents/hermes/SOUL.md, runtime: config/agents/hermes/SOUL.runtime.md, destination: <home>/.hermes/SOUL.md, deploy_policy: "installable; symlink required"}
      - {provider: gemini, delta: config/agents/gemini/SOUL.delta.md, runtime: config/agents/gemini/SOUL.runtime.md, destination: <home>/.gemini/GEMINI.md, deploy_policy: "NOT-DEPLOYED: integration pending (issue 2719 Phase 6)"}
      - {provider: agy, delta: config/agents/agy/SOUL.delta.md, runtime: config/agents/agy/SOUL.runtime.md, destination: <home>/.agy/SOUL.md, deploy_policy: "NOT-DEPLOYED: reference artifact only (issue 3573)"}
    other_provider_config: "config/agents/<provider>/settings.json or config.toml, codex and gemini MEMORY.runtime.md, model-registry.yaml, provider-capabilities.yaml, routing-config.yaml, behavior-contract.yaml"
  deployment_and_linking:
    soul_deployment_check:
      script: scripts/enforcement/check-soul-deployment-drift.sh
      states: "CURRENT (symlink, bytes equal origin/main blob), STALE (symlink, bytes differ), UNLINKED (copy, any bytes), ABSENT, BLOCKED (Claude loader admission failed), NOT-DEPLOYED (gemini, agy by policy)"
      exit: "0 all current, 1 any drift, 2 usage error"
      note: "a checkout behind origin on other paths is informational; a stale runtime is the failure"
    shared_skill_links:
      propagate: "scripts/propagate-ecosystem.sh [--skills-only|--hooks-only|--codex-only] links .claude/skills/<dir> in each ecosystem repo to workspace-hub .claude/skills/_internal/<dir> (symlink on Unix, NTFS junction via mklink /J on Windows); also carries hooks and permissions into sibling .claude/settings.json"
      verify: "scripts/skills/resync-skill-links.sh (report by default) classifies HEALTHY, DANGLING, FLATTENED, MISSING, MODIFIED-REAL-DIR, TEMPLATE-ABSENT and writes .claude/state/skill-link-health-<machine>.json; --apply re-propagates through propagate-ecosystem.sh"
      codex_root: "scripts/skills/native_skill_root.py classifies a repository .agents/skills as native, absent or blocked without following reparse points"
      hazard: ".claude/rules/windows-junction-restore-safety.md: git restore or recursive delete through a junction empties the canonical tree (2026-07-16 incident, 4,215 files)"
    curation_state:
      files: ".claude/state/skill-currency-<machine>.json, skill-drift-<machine>.json, skill-drift-report-<machine>.json, skill-link-health-<machine>.json"
      writers: "scripts/curation/audit_skill_currency.py; scripts/cron/skill-curation-nightly.sh (evals, duplicate and rot detection); scripts/curation/session-curation-preflight.sh"
  cleanup_and_machine_tools:
    in_workspace_hub:
      - {item: scripts/operations/workstation-hygiene.sh, purpose: "report duplicate clones, worktrees and caches as SAFE, DIRTY, UNPUSHED, LOCKED or IN USE; --apply removes SAFE only"}
      - {item: .claude/commands/reconcile-ecosystem.md, purpose: "/reconcile-ecosystem: report repo-hygiene drift and machine-equality verdicts; destructive actions guard-gated"}
      - {item: .claude/commands/workspace-hub/repo-sync.md, purpose: "/workspace-hub:repo-sync: pull all repos, diagnose detached, diverged or dirty trees"}
