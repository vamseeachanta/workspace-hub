schema: knowledge-map/1
map: skills
title: Skills - agent skills, slash commands, rules, role agents and provider instruction files
purpose: >
  One place that says which skills, slash commands, rules, role agents and
  provider instruction files the ecosystem holds, where each one lives, how each
  provider discovers it, and how the runtime files are deployed and checked on a
  machine. Generic layer only: per-machine deployment state, CLI versions, link
  types, drift, deviations and local-only skills are held in the private detail
  map.
owner: owner (rulings); team keeps the map current
verified_at: "2026-11-27T15:50:00Z"
private_detail: fleet-ops docs/knowledge-maps/skills.yaml (private repository)
sources:
  - "workspace-hub origin/main ffe9d649e (2026-11-27T15:14:56Z): .claude/skills, .agents/skills, .claude/commands, .claude/rules, .claude/agents, config/agents"
  - config/agents/README.md (file map, skill index artifacts)
  - config/agents/skill-index-full.yaml (generated by scripts/ai/build_skill_index.py)
  - .agents/skills/README.md (relationship of the skill trees)
  - scripts/enforcement/check-soul-deployment-drift.sh and .claude/rules/soul-deployment-drift.md
  - scripts/agents/install-soul-runtime.sh, scripts/agents/claude_runtime_state.py
  - scripts/propagate-ecosystem.sh, scripts/skills/resync-skill-links.sh, scripts/skills/native_skill_root.py
  - .claude/rules/windows-junction-restore-safety.md
  - "Claude Code 2.1.332 session skill listing on a Windows host, 2026-11-27 (what is natively discovered)"
  - "fleet-ops (private): clean-up prompt, runbook and tools; machine-manager consistency run (detail in the private map)"
refresh:
  cadence: >
    Rebuild the catalogue when a SKILL.md, command, rule or agent file changes on
    origin/main; the deployment check runs per machine (6-hourly once the fleet-ops
    consistency run is live).
  commands:
    count_skills: "git -C <workspace-hub> ls-tree -r --name-only origin/main .claude/skills | grep '/SKILL.md$' | grep -v '^.claude/skills/_archive/' | wc -l"
    count_agents_copy: "git -C <workspace-hub> ls-tree -r --name-only origin/main .agents/skills | grep '/SKILL.md$' | grep -v '/_archive/' | wc -l"
    rebuild_index: "uv run python scripts/ai/build_skill_index.py --check            # stdout only; drop --check to write"
    index_coherence: "uv run python scripts/enforcement/check-skill-index-coherence.py"
    route_a_query: "uv run python scripts/ai/skill_router.py \"<query>\" --top-k 5"
    runtime_build_drift: "bash scripts/enforcement/check-soul-runtime-drift.sh"
    deployment_drift_this_host: "bash scripts/enforcement/check-soul-deployment-drift.sh            # add --no-fetch offline"
    claude_loader_state: "uv run --no-project python scripts/agents/claude_runtime_state.py --repo . --home \"$HOME\" --format json"
    skill_link_health: "bash scripts/skills/resync-skill-links.sh --verbose            # report only; --apply is guard-gated"
    skill_currency: "uv run python scripts/curation/audit_skill_currency.py --stdout            # read only"
    probe_link_type_windows: "(Get-Item <path> -Force).LinkType            # probe only; never restore or delete a link path"
    cli_versions: "claude --version; codex --version; gemini --version; agy --version"
standard:
  rule: .claude/rules/soul-deployment-drift.md
  also:
    - .claude/rules/windows-junction-restore-safety.md
    - .claude/rules/coding-style.md (Agent Harness Files; CLAUDE.md retired as a repo file)
    - .claude/rules/workstation-hygiene.md
    - .claude/rules/README.md (rules index)
  statement: >
    A machine must load what origin/main holds. The authority for every provider
    runtime file is the origin/main blob, compared by SHA-256; a link into a stale
    checkout is drift. Installable providers require a native symlink; a copy is
    reported UNLINKED even when its bytes match. Skill link paths are probed for
    link type before any restore or delete, and junction children belong to the
    link target.
legend:
  claude_native: >
    true = the skill sits at .claude/skills/<name>/SKILL.md and Claude Code lists it
    as a skill. Absent = the skill sits under a category folder; Claude Code 2.1.332
    did not list category-nested skills in the observed session, so these are
    reached through the skill index and router, or by reading the file.
  user_invocable: absent = default true (no skill sets user-invocable false).
  model_invocable: present only where disable-model-invocation is set.
  agents_copy: >
    State of the same path under .agents/skills (Codex native project discovery):
    same = identical blob, differs = provider-adapted or drifted copy, absent = no copy.
  purpose: first 130 characters of the SKILL.md description; client names shown by codename.
entries:
