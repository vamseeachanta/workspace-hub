    - path: config/agents/skill-index-full.yaml
      role: flat per-SKILL.md index for the provider-neutral router (scripts/ai/skill_router.py); kept coherent by scripts/enforcement/check-skill-index-coherence.py
    - path: config/agents/skill-graph-index.yaml
      role: graph form of the skill index (#3190 / #3208)
    - path: .claude/skills/_internal
      role: "templates linked into every ecosystem repo by propagate-ecosystem.sh (SHARED_SKILL_DIRS guidelines, meta, workflows); origin/main holds guidelines and workflows only"
