    title: "OCC entity renumbering breaks boundary layer if parallel"
    resolution: "Children 2 and 3 remain independent — they solve different problems (Child 2: assembly boolean ops; Child 3: boundary layer on any geometry). Physical group tagging contract added as shared convention."

