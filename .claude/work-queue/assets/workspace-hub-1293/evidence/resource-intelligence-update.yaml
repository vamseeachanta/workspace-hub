updated_at: '2026-03-24T03:20:00Z'
lessons_learned:
  - "26 of 44 naval architecture manifests are standards/references without step-by-step worked examples. Future extraction targets should be filtered to textbooks with problem sets."
  - "PEP 723 inline script metadata is needed for uv run --no-project to resolve dependencies. Using 'uv run --no-project python script.py' skips inline metadata; use 'uv run --no-project script.py' instead."
  - "enforce-human-gate.sh had two bugs: set -e killed script on non-zero function returns, and 'no_awaiting' GitHub state was incorrectly classified as 'blocked'."
additions:
  - "26/44 naval architecture manifests are standards/references without worked examples — filter future extraction targets"
  - "PEP 723 inline metadata required for uv run --no-project; use direct script path not 'python script.py'"
  - "enforce-human-gate.sh: set -e kills script on non-zero function returns; use '&& result=0 || result=$?' pattern"
