codebase_findings:
  - description: >
      next-id.sh is a 157-line bash script that assigns WRK IDs by scanning
      pending/working/blocked/archive directories for the highest WRK-NNN
      within the current machine's floor-ceiling range (read from
      config/work-queue/machine-ranges.yaml). It uses noclobber sentinel files
      for atomic ID reservation. Cross-validates against state.yaml last_id and
      auto-corrects drift. Has no awareness of GitHub issue numbers.
    files:
      - scripts/work-queue/next-id.sh
      - config/work-queue/machine-ranges.yaml
      - .claude/work-queue/state.yaml
  - description: >
      The capture pipeline (capture.md action skill) calls next-id.sh for ID
      generation, then creates the WRK file, and THEN creates a GitHub issue
      via update-github-issue.py --create. The GitHub issue title is prefixed
      "WRK-NNN: <title>" and the returned URL is stored as
      github_issue_ref in frontmatter. This is a post-hoc linkage, not
      identity unification. Network failure is non-blocking — issue creation
      can be retried later.
    files:
      - .claude/skills/coordination/workspace/work-queue/actions/capture.md
      - scripts/knowledge/update-github-issue.py
  - description: >
      Machine-partitioned ID ranges: dev-primary 1-4999 (current ~1128),
      licensed-win-1 5000-9999, dev-secondary 10000-14999 (reserved),
      gali-linux-compute-1 15000-19999 (reserved). The system has 396 pending,
      11 working, 10 blocked items. Of 396 pending items, 309 have non-empty
      github_issue_ref values — about 78% coverage.
    files:
      - config/work-queue/machine-ranges.yaml
      - .claude/skills/coordination/workspace/work-queue/machine-wrk-id-ranges/SKILL.md
  - description: >
      WRK IDs are referenced in git commit messages using conventional commit
      format: "fix(WRK-5124): ...", "feat(WRK-1341): ...". This pattern is
      deeply embedded — hundreds of commits reference WRK-NNN. The WRK prefix
      appears in filenames (WRK-NNN.md), directory names (assets/WRK-NNN/),
      frontmatter (id: WRK-NNN), and cross-references throughout skills and docs.
    files:
      - .claude/work-queue/pending/
      - .claude/work-queue/assets/
  - description: >
      The dual-numbering divergence is stark. Examples: WRK-008 -> GitHub #16,
      WRK-5109 -> GitHub #1258, WRK-5095 -> GitHub #1268, WRK-1043 -> GitHub #34.
      The GitHub repo (vamseeachanta/workspace-hub) has its own sequential issue
      counter that is completely independent of WRK numbering. Some WRK items
      reference issues in other repos (e.g., WRK-510 -> digitalmodel #217).
    files:
      - .claude/work-queue/pending/WRK-008.md
      - .claude/work-queue/pending/WRK-5109.md
  - description: >
      update-github-issue.py handles create/update/close/comment operations.
      On --create it runs "gh issue create" and stores the URL. On --update
      it edits the body. It can infer the repo from the github_issue_ref URL.
      The script renders WRK evidence (stages, TDD, implementation) into the
      GitHub issue body. There is no reverse mapping (GitHub issue -> WRK ID)
      except by parsing the issue title prefix "WRK-NNN:".
    files:
      - scripts/knowledge/update-github-issue.py
      - scripts/knowledge/tests/test_update_github_issue.py
online_research:
  - topic: "GitHub CLI issue creation automation"
    summary: >
      gh issue create returns the issue URL (containing the issue number) on
      stdout. The number is auto-incremented by GitHub and cannot be specified
      by the caller. There is no API to reserve or pre-allocate issue numbers.
      This rules out Option C (reserve GitHub issue ranges) as technically
      infeasible without creating and immediately closing placeholder issues.
  - topic: "GitHub issue number reservation"
    summary: >
      GitHub does not support reserving issue numbers or specifying a custom
      issue number at creation time. Issue numbers are strictly sequential
      and include PRs in the same counter. The only way to "align" would be
      to create placeholder issues to consume numbers, which is wasteful and
      fragile.
