  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: 'Task-brief Slides 12–13 promote neighboring wells from "stretch goal"
    to primary signal: geology dip behaves similarly across pad-mates, so an offset
    well''s TVT trajectory is a usable prior for the current well.

    ## What to do

    1. **Spatial index** over (X, Y) of all train wells (\`src/rogii/util/spatial.py\`).
    Use lateral midpoint or full-path KDTree.'
- idempotency_key: gh:vamseeachanta/kaggle-rogii-2026#1
  title: Phase 1 v2 — Heel-as-reference DTW with advancing anchor
  source: github_issue
  source_url: https://github.com/vamseeachanta/kaggle-rogii-2026/issues/1
  gh_state: open
  gh_labels:
  - phase-1
  - status:plan-review
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: 'Phase 1 v1 (\`src/rogii/features/correlation.py\` first cut) scored
    297 ft RMSE vs the 11.53 ft carry-forward floor — see \`docs/decisions.md\` 2026-05-05
    entry. v2 fixes the structural problems.

    ## Three fixes

    1. **Advancing anchor.** v1 pinned the search prior at heel-exit TVT with a per-row
    drift bound, so by mid-toe the search radius spanned the whole typewell. v2 must
    update the anchor to the last predicted TVT after each row.'
