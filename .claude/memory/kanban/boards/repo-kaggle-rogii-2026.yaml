- idempotency_key: gh:vamseeachanta/kaggle-rogii-2026#3
  title: Phase 0.5 — Linear extrapolation baseline
  source: github_issue
  source_url: https://github.com/vamseeachanta/kaggle-rogii-2026/issues/3
  gh_state: open
  gh_labels:
  - phase-0
  - status:plan-approved
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: 'Carry-forward (Phase 0) measured at **11.53 ft RMSE** on a 10-well
    train sample. The floor is much higher than expected — Phase 1 v1 typewell-correlation
    lost on every well (297 ft RMSE).

    ## Hypothesis

    Wells continue their heel-exit dip into the toe more often than they stay flat.
    Linear extrapolation from the last ~200 heel rows (\`slope = polyfit(heel_md,
    heel_tvt, 1)\`) should beat carry-forward on the drift-y wells without losing
    on the flat ones.'
- idempotency_key: gh:vamseeachanta/kaggle-rogii-2026#2
  title: Phase 2 — Offset-well features and pad-aware CV
  source: github_issue
