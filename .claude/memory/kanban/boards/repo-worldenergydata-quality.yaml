    priority: 0
    body_excerpt: '## Problem


      Issue #298 (closed 2026-04-16, commit `eedecf5a`, titled *\"extend catalog and metadata to cover /mnt/ace symlinked data\"*) was caught by a 2026-05-01 audit to have not actually wired the symlinks/path resolution it claimed. 9.5 GB of relocated data is still unreachable through the catalog. This is the **closed-issue-was-not-actually-done** failure mode — issues get closed, work is assumed shipped, and audits months later expose the gap.'
