- idempotency_key: gh:vamseeachanta/worldenergydata#328
  title: 'Tooling: flake8 reports different F821 counts across runs on same codebase
    (uv env race?)'
  source: github_issue
  source_url: https://github.com/vamseeachanta/worldenergydata/issues/328
  gh_state: open
  gh_labels:
  - status:plan-approved
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Context


    During the #314 Block B sweep, three independent `uv run --extra dev flake8 src/
    tests/ --select=F821` runs on main returned **three different counts** on the
    same code. This undercount caused the sweep to miss 33 errors, which required
    a follow-up mop-up (#322).'
- idempotency_key: gh:vamseeachanta/worldenergydata#325
  title: 'Bugs: 8 pre-existing defects surfaced by PR #320''s xfail markers'
  source: github_issue
  source_url: https://github.com/vamseeachanta/worldenergydata/issues/325
  gh_state: open
  gh_labels:
  - status:plan-approved
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Context


    PR #320 (part of #314) replaced a broken `exec()` hack in two compliance test
    files and resurrected 63 tests that had been silently non-executing since a `modules/`
    refactor. Of those, 53 pass cleanly and **10 fail on real implementation bugs**
    — not import issues. They were marked `@pytest.mark.xfail` with specific reasons
    rather than silenced, so they surface in test reports without breaking CI.'
