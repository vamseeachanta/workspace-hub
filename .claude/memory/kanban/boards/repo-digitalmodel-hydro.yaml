      ## Required work'
  - idempotency_key: gh:vamseeachanta/digitalmodel#608
    title: 'OrcaWave: add mesh quality gates before diffraction solve'
    source: github_issue
    source_url: https://github.com/vamseeachanta/digitalmodel/issues/608
    gh_state: open
    gh_labels:
      - enhancement
      - cat:engineering
      - priority:high
      - status:plan-review
      - domain:hydro
      - lane:claude
    gh_assignees: []
    initial_status: triage
    priority: 1
    body_excerpt: '## Problem

      For arbitrary user-supplied meshes, file existence is not enough. Diffraction solves need mesh quality checks before invoking OrcaWave, otherwise users will hit solver failures or poor hydrodynamic results late in the workflow.

      ## Required work'
  - idempotency_key: gh:vamseeachanta/digitalmodel#609
    title: 'OrcaWave: normalize auxiliary mesh handling for control surfaces and QTF inputs'
    source: github_issue
    source_url: https://github.com/vamseeachanta/digitalmodel/issues/609
    gh_state: open
    gh_labels:
      - enhancement
      - cat:engineering
      - priority:high
      - status:plan-review
      - domain:hydro
      - lane:claude
    gh_assignees: []
    initial_status: triage
    priority: 1
    body_excerpt: '## Problem

      Auxiliary mesh handling is inconsistent across the schema, backend, and runner. In particular, the schema supports control surfaces at both `VesselSpec.control_surface` and `BodySpec.control_surface`, while the OrcaWave backend and runner currently read the vessel-level location. This can silently ignore body-level control surface definitions in multi-body specs.

      The same packaging/preflight path should also cover damping lid meshes and free-surface panelled-zone meshes used for QTF workflows.'
