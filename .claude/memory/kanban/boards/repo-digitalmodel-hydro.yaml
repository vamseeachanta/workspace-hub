- idempotency_key: gh:vamseeachanta/digitalmodel#612
  title: 'OrcaWave: add batch mesh convergence and grid sensitivity workflow'
  source: github_issue
  source_url: https://github.com/vamseeachanta/digitalmodel/issues/612
  gh_state: open
  gh_labels:
  - enhancement
  - status:plan-review
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Problem

    Running diffraction from arbitrary meshes requires engineering confidence, not just a single solve. Users need a repeatable workflow for mesh convergence and frequency/heading sensitivity studies.

    ## Required work'
- idempotency_key: gh:vamseeachanta/digitalmodel#609
  title: 'OrcaWave: normalize auxiliary mesh handling for control surfaces and QTF inputs'
  source: github_issue
  source_url: https://github.com/vamseeachanta/digitalmodel/issues/609
  gh_state: open
  gh_labels:
  - enhancement
  - status:plan-review
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Problem

    Auxiliary mesh handling is inconsistent across the schema, backend, and runner. In particular, the schema supports control surfaces at both `VesselSpec.control_surface` and `BodySpec.control_surface`,
    while the OrcaWave backend and runner currently read the vessel-level location. This can silently ignore body-level control surface definitions in multi-body specs.

    The same packaging/preflight path should also cover damping lid meshes and free-surface panelled-zone meshes used for QTF workflows.'
- idempotency_key: gh:vamseeachanta/digitalmodel#608
  title: 'OrcaWave: add mesh quality gates before diffraction solve'
  source: github_issue
  source_url: https://github.com/vamseeachanta/digitalmodel/issues/608
  gh_state: open
  gh_labels:
  - enhancement
  - status:plan-review
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Problem

    For arbitrary user-supplied meshes, file existence is not enough. Diffraction solves need mesh quality checks before invoking OrcaWave, otherwise users will hit solver failures or poor hydrodynamic
    results late in the workflow.

    ## Required work'
