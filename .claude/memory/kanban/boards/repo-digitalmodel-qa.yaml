  - idempotency_key: gh:vamseeachanta/digitalmodel#530
    title: 'OrcaFlex tests: hoist class-scoped fixtures in test_orcaflex_converter_enhanced.py to module level'
    source: github_issue
    source_url: https://github.com/vamseeachanta/digitalmodel/issues/530
    gh_state: open
    gh_labels:
      - enhancement
      - machine:dev-primary
      - status:plan-approved
      - dispatch:ready
      - domain:qa
      - lane:claude
    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Summary

      `tests/solvers/orcaflex/test_orcaflex_converter_enhanced.py` defines 4 pytest fixtures inside class `TestOrcaFlexConverterEnhanced` (L35-62). Sibling test classes in the same file (`TestPerformance` at L415, `TestCLI` at L448) reference these fixtures by method signature but are not subclasses — pytest class-scoped fixtures only propagate down the inheritance chain, not sideways.

      Result: 3 ERRORs at test setup.'
