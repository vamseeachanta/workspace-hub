  - idempotency_key: gh:vamseeachanta/workspace-hub#1636
    title: 'OrcaWave reporting: section-level unit tests for all 7 section builders'
    source: github_issue
    source_url: https://github.com/vamseeachanta/workspace-hub/issues/1636
    gh_state: open
    gh_labels:
      - enhancement
      - priority:medium
      - cat:engineering
      - domain:marine
      - machine:dev-primary
      - dispatch:ready
      - gate:completeness
    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Context\nOvernight run 2026-04-01 (#1585) added 96 tests for the orcawave reporting package covering config models, builder init, and spec validation. However, the 7 individual section builders (, , , , , , ) have no unit-level tests yet — they require a mocked Diffraction object with numpy arrays.\n\n## What to do\n1. Create \n2. Build a mock Diffraction fixture with realistic numpy arrays (frequencies, headings, RAOs, added mass, damping, drift, panel geometry, QTF)\n3. Write tests for each section''s  function:\n   - test_model_summary_returns_html_table\n   - test_rao_plots_returns_tabbed_html (requires plotly)\n   - test_hydro_matrices_returns_card (requires plotly)\n   - test_mean_drift_returns_card (requires plotly)\n   - test_panel_pressures_returns_table\n   - test_multi_body_single_body_no_coupling\n   - test_multi_body_two_bodies_has_heatmap\n   - test_qtf_heatmap_skips_when_no_qtf\n   - test_qa_summary_all_checks_pass\n4. At least 12 test functions total\n5.
      All tests use mocked data — no OrcaWave license needed\n\n## Acceptance criteria\n- At least 12 test functions covering all 7 section builders\n- Tests run without plotly installed (skip with pytest.importorskip)\n- All pass\n\n## Parent\nFollows from #1585'
  - idempotency_key: gh:vamseeachanta/workspace-hub#1637
    title: 'Parametric spec generator: multi-dimensional sweep combinations and CLI interface'
    source: github_issue
    source_url: https://github.com/vamseeachanta/workspace-hub/issues/1637
    gh_state: open
    gh_labels:
      - enhancement
      - priority:medium
      - cat:engineering
      - domain:marine
      - machine:dev-primary
      - dispatch:ready
      - gate:completeness
    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Context\nOvernight run 2026-04-01 (#1596) delivered a parametric spec.yml generator at `digitalmodel/src/digitalmodel/solvers/parametric_spec_generator.py` with frequency, heading, and hull parameter sweeps. Current limitations:\n- Cross-product of sweeps produces N*M specs (can explode)\n- No CLI interface for batch generation\n- No spec naming convention based on sweep parameters\n\n## What to do\n1. Add a `max_specs` guard to prevent accidental generation of >1000 specs\n2. Add a CLI entry point: `uv run python -m digitalmodel.solvers.parametric_spec_generator --base spec.yml --freq-sweep 0.1:2.0:5 --output-dir output/`\n3. Add naming convention: `spec_{vessel}_{sweep_dim}_{value}.yml`\n4. Add combined sweep mode (frequency x heading = cartesian product)\n5. Tests for each new feature\n6. Update docstrings\n\n## Acceptance criteria\n- CLI works: `uv run python -m digitalmodel.solvers.parametric_spec_generator --help`\n- max_specs guard raises ValueError when exceeded\n-
      Naming convention applied to output files\n- All existing 14 tests + new tests pass\n\n## Parent\nFollows from #1596'
