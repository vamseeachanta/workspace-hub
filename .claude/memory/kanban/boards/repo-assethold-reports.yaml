  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Context


    `WatchlistRunner` (landed #39, commit `fd0bc33`) currently requires `--charts-dir
    PATH` when `--render-charts` is passed — the CLI exits 2 with a helpful stderr
    message if not. This is deliberate fail-loud discipline matching Phase 1''s pattern.'
