    foundings + COLREG family + ~25 named tasks)'
  source: github_issue
  source_url: https://github.com/vamseeachanta/llm-wiki/issues/101
  gh_state: open
  gh_labels: []
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: 'On 2026-05-18 a 14-URL LinkedIn batch landed (commits `aa7a8ec4..fa13ceb9`
    fast-forwarded to `main` after rebase over 5 parallel reservoir-engineering commits).
    The batch surfaced two **domain-founding events** plus a **COLREG family bootstrap**
    and a number of substance gaps that were explicitly seeded for follow-on work
    in log entries and source-page "Follow-on work" sections. This issue is the discoverable
    index of those follow-on tasks — without it they fossilize inside per-source-page
    bullets nobody re-reads.


    ## Domain foundings (this batch)'
