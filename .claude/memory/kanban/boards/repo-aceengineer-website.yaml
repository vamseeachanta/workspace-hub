    body_excerpt: '## Source

      Follow-up from #6. Once the About page ships CAP-01/02/03 language ("computational fatigue assessment", "riser & mooring analysis", "diffraction analysis"), the four Core Automation Capability headings on `engineering.html` use a different vocabulary — click-through experience is slightly jarring.

      ## Proposed renames (SEO-sensitive — test before shipping)'
