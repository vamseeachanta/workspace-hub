    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Source

      Structural gap surfaced by #6. The workspace-hub `llm-wiki` is intentionally out of scope for firm marketing copy (methodology only), and the private strategy repo is privacy-walled. That leaves no single public canonical home for reusable firm-description text — today each page (`about.html`, `services.html`, `contact.html`, future pages) duplicates the firm framing, and drift between them is what triggered #6 in the first place.

      ## Problem'
