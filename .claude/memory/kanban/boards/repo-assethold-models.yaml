- idempotency_key: gh:vamseeachanta/assethold#43
  title: Wire insider_tracker into WatchlistRunner.insider_flags_provider
  source: github_issue
  source_url: https://github.com/vamseeachanta/assethold/issues/43
  gh_state: open
  gh_labels:
  - enhancement
  - priority:medium
  - cat:engineering
  - status:plan-approved
  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '## Context


    `WatchlistRunner.insider_flags_provider` (landed in #39, commit `fd0bc33`) is
    a `Callable[[str], list[dict]] | None` slot. When `None` (current default), the
    runner logs a one-shot WARNING at `__init__` and `AlertEngine.build_alerts` is
    called with `insider_flags=[]` — meaning CRITICAL-severity `unusual_insider_activity`
    alerts never fire.'
