- idempotency_key: gh:vamseeachanta/assethold#28
  title: Portfolio future outlook — probabilistic high/low projection bands
  source: github_issue
  source_url: https://github.com/vamseeachanta/assethold/issues/28
  gh_state: open
  gh_labels:
  - status:plan-approved
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Summary


    Project the portfolio''s probable future value range over multiple horizons —
    from 3 months out to **10 years** — using historical return distributions. Display
    as high/low confidence bands (P10/P50/P90) with Monte Carlo simulation lines to
    visualize the full range of possible outcomes.'
