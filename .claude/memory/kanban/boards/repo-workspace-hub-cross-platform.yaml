    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Purpose

      This is the **operational tracker** for fresh-machine setup runs across the workspace-hub fleet. It is intentionally evergreen — never closed once opened. Each time someone bootstraps a new machine via the cross-platform setup tooling (built per [#2751](https://github.com/vamseeachanta/workspace-hub/issues/2751)), they post a comment on this issue with the machine''s harness-parity status report.

      ## How operators use this issue'
