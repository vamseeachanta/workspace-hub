    body_excerpt: 'Child of holistic doc-intel feature. Extend scripts/data/research-literature/download-template.sh into a reusable pipeline: (1) reads online-resource-registry.yaml for entries with download_status=pending, (2) downloads to /mnt/ace/<repo-name>/<domain-name>/, (3) updates registry with local_backup_path and download_status=completed, (4) adds to document-index if PDF/doc. Uses scripts/lib/download-helpers.sh. TDD. Use uv run.'
