      ## Problem

      OrcaWave runner expects mesh files to exist in the output directory but:'
  - idempotency_key: gh:vamseeachanta/digitalmodel#605
    title: 'OrcaWave: produce self-contained solver packages from spec conversion'
    source: github_issue
    source_url: https://github.com/vamseeachanta/digitalmodel/issues/605
    gh_state: open
    gh_labels:
      - enhancement
      - status:plan-review
      - domain:hydro-diffraction
    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Problem

      `diffraction convert-spec --solver orcawave` generates OrcaWave YAML, but it does not yet guarantee the output directory is self-contained and runnable. The backend writes mesh references as basenames, while referenced mesh files and auxiliary meshes may still live beside the source `spec.yml`.

      This overlaps with, but is broader than, #500. #500 covers mesh pre-flight validation and runner auto-copy; this issue is specifically about the conversion/package artifact created by `convert-spec`.'
  - idempotency_key: gh:vamseeachanta/digitalmodel#606
    title: 'OrcaWave: integrate MeshPipeline into spec conversion and runner'
    source: github_issue
    source_url: https://github.com/vamseeachanta/digitalmodel/issues/606
    gh_state: open
    gh_labels:
      - enhancement
      - status:plan-review
      - domain:hydro-diffraction
    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Problem

      The diffraction module has a `MeshPipeline` that can load, validate, and prepare meshes for solvers, but the OrcaWave spec conversion and runner paths do not yet use it to prepare arbitrary mesh inputs.

      Without this integration, a user must already know which mesh formats are solver-ready and manually convert or arrange files before running diffraction.'
  - idempotency_key: gh:vamseeachanta/digitalmodel#607
    title: 'OrcaWave: add given-mesh CLI workflow for diffraction setup'
    source: github_issue
    source_url: https://github.com/vamseeachanta/digitalmodel/issues/607
    gh_state: open
    gh_labels:
      - enhancement
      - status:plan-review
      - domain:hydro-diffraction
    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Problem

      A user with a mesh file should be able to start a diffraction analysis without manually authoring a complete `spec.yml` from scratch. The current path assumes the canonical spec already exists.

      ## Required work'
  - idempotency_key: gh:vamseeachanta/digitalmodel#608
    title: 'OrcaWave: add mesh quality gates before diffraction solve'
    source: github_issue
    source_url: https://github.com/vamseeachanta/digitalmodel/issues/608
    gh_state: open
    gh_labels:
      - enhancement
      - status:plan-review
      - domain:hydro-diffraction
    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Problem

      For arbitrary user-supplied meshes, file existence is not enough. Diffraction solves need mesh quality checks before invoking OrcaWave, otherwise users will hit solver failures or poor hydrodynamic results late in the workflow.

      ## Required work'
  - idempotency_key: gh:vamseeachanta/digitalmodel#609
    title: 'OrcaWave: normalize auxiliary mesh handling for control surfaces and QTF inputs'
    source: github_issue
    source_url: https://github.com/vamseeachanta/digitalmodel/issues/609
    gh_state: open
    gh_labels:
      - enhancement
      - status:plan-review
      - domain:hydro-diffraction
    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Problem

      Auxiliary mesh handling is inconsistent across the schema, backend, and runner. In particular, the schema supports control surfaces at both `VesselSpec.control_surface` and `BodySpec.control_surface`, while the OrcaWave backend and runner currently read the vessel-level location. This can silently ignore body-level control surface definitions in multi-body specs.

      The same packaging/preflight path should also cover damping lid meshes and free-surface panelled-zone meshes used for QTF workflows.'
  - idempotency_key: gh:vamseeachanta/digitalmodel#612
    title: 'OrcaWave: add batch mesh convergence and grid sensitivity workflow'
    source: github_issue
    source_url: https://github.com/vamseeachanta/digitalmodel/issues/612
    gh_state: open
    gh_labels:
