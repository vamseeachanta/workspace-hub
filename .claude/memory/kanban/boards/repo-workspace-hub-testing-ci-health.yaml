    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Context\nThe test health dashboard (`scripts/quality/test-health-dashboard.py`) was created in #1573 and generates `docs/dashboards/test-health-dashboard.md` with per-package pass/fail metrics.\n\nCurrently it must be run manually. It should run weekly like the architecture and staleness scanners.\n\n## Acceptance criteria\n1. Add `test-health-dashboard` entry to `config/scheduled-tasks/schedule-tasks.yaml`\n   - Schedule: Sunday 04:00 UTC (`0 4 * * 0`) — after architecture (02:00) and staleness (03:00)\n   - Machines: dev-primary, ace-linux-1\n   - Auto: git pull, run dashboard, commit, push\n2. Verify YAML valid\n3. Do NOT modify setup-cron.sh\n\n## Parent\n- Part of #1573\n'
