    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Context\nThe test health dashboard (#1573) generates a point-in-time snapshot. For tracking improvement over time, we need historical data and trend detection.\n\n## Acceptance criteria\n1. Write tests first in `tests/quality/test_test_health_dashboard.py` (extend existing)\n2. After each run, append summary to `docs/dashboards/test-health-history.json`\n   - Fields: timestamp, total, passed, failed, errors, skipped, pass_rate\n3. Add trend section to markdown dashboard showing last 8 runs\n4. Add delta detection: if pass_rate drops >5% from previous run, add warning banner\n5. Tests pass\n\n## Parent\n- Follow-up to #1573\n'
