  - idempotency_key: gh:vamseeachanta/workspace-hub#2758
    title: Clarify agent/runtime folder architecture to reduce human and agent confusion
    source: github_issue
    source_url: https://github.com/vamseeachanta/workspace-hub/issues/2758
    gh_state: open
    gh_labels:
      - enhancement
      - priority:medium
      - cat:developer-experience
      - domain:agent-ux
      - domain:repo-organization
      - machine:dev-primary
      - dispatch:ready
      - gate:completeness
    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Summary

      The current agent/runtime folder layout is confusing for both humans and agents. The repo contains overlapping surfaces such as `config/agents/<provider>/`, `.claude/`, `.codex/`, `.gemini/`, `~/.hermes/`, runtime symlinks, memory bridges, skill external dirs, and provider-specific generated artifacts. The same conceptual thing can appear under several names: SOUL, AGENTS, GEMINI, memory, skills, commands, runtime, templates, deltas, snapshots.

      This confusion keeps recurring and causes avoidable friction when deciding where canonical files should live, what is generated vs source-of-truth, what is local-only vs repo-tracked, and which paths each provider actually reads.'
