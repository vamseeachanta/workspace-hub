  - idempotency_key: gh:vamseeachanta/workspace-hub#2721
    title: 'fix(review-tools): submit-to-codex.sh silently degrades in non-TTY contexts — retrofit with `script -qc`'
    source: github_issue
    source_url: https://github.com/vamseeachanta/workspace-hub/issues/2721
    gh_state: open
    gh_labels:
      - priority:high
      - cat:ai-orchestration
      - cat:harness
      - domain:agent-cost-tracking
      - machine:dev-primary
      - dispatch:ready
      - gate:completeness
    gh_assignees: []
    initial_status: triage
    priority: 1
    body_excerpt: '## Symptom

      `scripts/review/submit-to-codex.sh` silently degrades when invoked from any non-TTY context (cron, background processes, Hermes worker, Claude Code''s Bash tool with `run_in_background=true`, any `bash -c ''...''` indirection). The wrapper appears to complete (rc=0, codex-spawn-PID returned) but the codex subprocess hangs at "Reading additional input from stdin..." and never emits the LLM response. Cross-review fanout that depends on Codex''s verdict silently drops to 2-provider consensus (Claude + Gemini only).

      ## Root cause'
