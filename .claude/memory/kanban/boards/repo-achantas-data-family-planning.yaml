  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '**Parent:** #73 · **Horizon:** 90-day immediate action

    **Why:** At 46/40, both Vamsee and Sabitha are at the cheapest underwriting point
    of their lives. Gap-fill before next renewal cycle. Coverage must be sized to
    fund SNT corpus if either parent dies early (Plan A) or support surviving spouse
    + dependents (either plan).

    ## Action'
