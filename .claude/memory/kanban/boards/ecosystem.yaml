board:
  slug: ecosystem
  display_name: Ecosystem · cross-repo themes
  tier: ecosystem
  workspace_path: /mnt/local-analysis/workspace-hub
  description: |
    Tier-0 master board. Cards are strategic themes that span ≥2 repos.
    They are NOT mirrored from GitHub issues — they synthesize directions
    captured in workspace-hub MEMORY.md and in cross-repo project plans.
    Each card points (via hermes kanban link) at the tier-1/tier-2 boards
    where the work actually lands. Use `hermes kanban decompose` on a card
    to fan it out into per-repo child tasks.

