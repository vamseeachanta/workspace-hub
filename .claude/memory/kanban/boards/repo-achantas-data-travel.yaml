    Parent: [#101](https://github.com/vamseeachanta/achantas-data/issues/101)'
- idempotency_key: gh:vamseeachanta/achantas-data#101
  title: 'Travel Explore: Arkansas Broken Bow-style cabin alternatives'
  source: github_issue
  source_url: https://github.com/vamseeachanta/achantas-data/issues/101
  gh_state: open
  gh_labels:
  - documentation
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Summary

    Explore Arkansas Broken Bow-style cabin alternatives for a west-Houston family:
    secluded cabin, private hot tub, forest/mountain setting, hiking or water nearby,
    dog-friendly if possible, and Airbnb/Vrbo acceptable as search channels.

    This is a lodging-first research issue. Existing Arkansas destination issues remain
    useful for activities; this issue tracks booking-fit and cabin-market leads.'
- idempotency_key: gh:vamseeachanta/achantas-data#100
  title: 'Travel Explore: Caddo Lake / Uncertain stretch cabin option details'
  source: github_issue
  source_url: https://github.com/vamseeachanta/achantas-data/issues/100
  gh_state: open
  gh_labels:
  - documentation
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Summary

    Caddo Lake / Uncertain is the most visually distinctive Texas option — cypress
    swamp, Spanish moss, kayaking, still water — but it is a **stretch**, not a clean
    substitute. Live routing from a west-Houston/Katy proxy returned roughly **266.7
    miles / 5.13 hours**, outside the preferred ~4-hour gate.

    Parent exploration: https://github.com/vamseeachanta/achantas-data/issues/95'
- idempotency_key: gh:vamseeachanta/achantas-data#99
  title: 'Travel Explore: New Braunfels / Gruene river-town option details'
  source: github_issue
  source_url: https://github.com/vamseeachanta/achantas-data/issues/99
  gh_state: open
  gh_labels:
  - documentation
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Summary

    New Braunfels / Gruene is a good family river-town getaway, but a weaker Broken
    Bow / Lookout substitute. It wins on Guadalupe/Comal access, Gruene character,
    walkability, and family activities; it loses on secluded hot-tub cabin feel. Prior
    OSRM screen put this cluster around **2.8–3.0 hours** from west Houston.

    Parent exploration: https://github.com/vamseeachanta/achantas-data/issues/95'
- idempotency_key: gh:vamseeachanta/achantas-data#98
  title: 'Travel Explore: Bastrop / Lost Pines cabin option details'
  source: github_issue
  source_url: https://github.com/vamseeachanta/achantas-data/issues/98
  gh_state: open
  gh_labels:
  - documentation
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Summary

    Bastrop / Lost Pines is the shortest practical pine-region fallback from west
    Houston, roughly **2.0 hours** by prior OSRM screen. It can approach the **~$500
    / 3 nights** target if the family accepts state-park/simple cabins or drops hot
    tub, but it is a weaker match for the full Broken Bow spec when dog-friendly +
    private hot tub + secluded cabin are all required.

    Parent exploration: https://github.com/vamseeachanta/achantas-data/issues/95'
- idempotency_key: gh:vamseeachanta/achantas-data#97
  title: 'Travel Explore: Lake Livingston / Sam Houston NF cabin option details'
  source: github_issue
  source_url: https://github.com/vamseeachanta/achantas-data/issues/97
  gh_state: open
  gh_labels:
  - documentation
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Summary

    Lake Livingston / Sam Houston National Forest is the best short-drive pine/lake/hiking
    substitute for Broken Bow. It preserves the **woods + water + cabin** logic within
    roughly **1.7–2.2 hours** of west Houston, but the better hot-tub/dog-friendly
    cabin options appear closer to the OK baseline than the requested **~$500 / 3
    nights** target.

    Parent exploration: https://github.com/vamseeachanta/achantas-data/issues/95'
- idempotency_key: gh:vamseeachanta/achantas-data#96
  title: 'Travel Explore: Wimberley / Canyon Lake cabin option details'
  source: github_issue
  source_url: https://github.com/vamseeachanta/achantas-data/issues/96
  gh_state: open
  gh_labels:
  - documentation
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Summary

    Wimberley / Canyon Lake is the strongest Texas Hill Country substitute for the
    Broken Bow / Lookout feel: private hot tubs, cottage/cabin inventory, decks, kitchens,
    pet-friendly options, nearby swimming holes, river/lake access, and a scenic setting
    within roughly **3.0–3.3 hours** of west Houston.

    Parent exploration: https://github.com/vamseeachanta/achantas-data/issues/95'
- idempotency_key: gh:vamseeachanta/achantas-data#95
  title: 'Travel Explore: Broken Bow-style cabin alternatives within 4 hours of west
    Houston'
  source: github_issue
  source_url: https://github.com/vamseeachanta/achantas-data/issues/95
