  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Summary

    Research Eureka Springs / Beaver Lake as the best overall Arkansas Broken Bow
    analog: wooded cabins, hot tubs, lake access, family-size options, and a destination
