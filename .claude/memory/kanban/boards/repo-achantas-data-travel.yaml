  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Summary

    Arkansas is the strongest near-term scenic upgrade from Houston if we want mountains,
    bluffs, waterfalls, lake/river scenery, and a cabin/lodge style trip within a
    long but reasonable drive.

    **Route:** Houston → Hot Springs / Petit Jean / Buffalo River, Arkansas → Houston'
