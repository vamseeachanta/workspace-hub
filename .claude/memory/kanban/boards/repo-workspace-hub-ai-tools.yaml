    body_excerpt: '## Problem

      `config/ai-tools/agent-capability-scores.yaml` (declared `version: \"2026-03-13\"`, `next_review: \"2026-06-06\"`) drives the radar visualization at [`config/ai-tools/agent-capability-radar.html`](https://github.com/vamseeachanta/workspace-hub/blob/main/config/ai-tools/agent-capability-radar.html) — the user-facing representation of provider capability vs. cost across 6 dimensions.

      The scored dimensions in `provider_comparison.dimensions` are: `Reasoning, Code Generation, Context Window, Cost Efficiency, Research & Docs, Orchestration`. Per-provider scores are 0–10 integers.'
  - idempotency_key: gh:vamseeachanta/workspace-hub#2715
    title: 'bug(infra): codex-cli 0.130.0 stdin-hang regression (recurrence of v0.124 #2479) + Hermes route affected'
    source: github_issue
    source_url: https://github.com/vamseeachanta/workspace-hub/issues/2715
    gh_state: open
    gh_labels:
      - bug
      - priority:high
      - cat:ai-orchestration
      - cat:infrastructure
      - domain:ai-tools
      - machine:dev-primary
      - dispatch:ready
      - gate:completeness
    gh_assignees: []
    initial_status: triage
    priority: 1
    body_excerpt: '## Summary

      `codex-cli 0.130.0` (current installed via `~/.npm-global/bin/codex`) reproduces the v0.124-era stdin-hang regression on **both** stdin and positional invocations, **and** affects Hermes-routed Codex calls because `hermes -z` shells out to `codex exec` subprocess for tool execution. Multiple downstream paths are blocked.

      ## Reproduction (verified 2026-05-15)'
