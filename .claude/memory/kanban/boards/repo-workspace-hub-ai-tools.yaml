  - idempotency_key: gh:vamseeachanta/workspace-hub#2697
    title: 'chore(ai-tools): refresh subscriptions.yaml with current Codex paid plan + bump declared totals'
    source: github_issue
    source_url: https://github.com/vamseeachanta/workspace-hub/issues/2697
    gh_state: open
    gh_labels:
      - enhancement
      - priority:high
      - cat:ai-orchestration
      - domain:ai-tools
      - status:plan-review
      - gate:completeness
    gh_assignees: []
    initial_status: triage
    priority: 1
    body_excerpt: '## Problem

      `config/ai-tools/subscriptions.yaml` (`last_updated: 2025-12-23`) declares a monthly subscription total of **\$156.75/mo** across 4 services (Claude Max, OpenAI Plus, Google AI Pro, GitHub Copilot Pro). It does **not include the Codex paid plan (\$200/mo)** that has been in active use throughout the 2026-04/05 wave and across multiple plan executions (verified at [#2675](https://github.com/vamseeachanta/workspace-hub/issues/2675), [#2683](https://github.com/vamseeachanta/workspace-hub/issues/2683), [#2684](https://github.com/vamseeachanta/workspace-hub/issues/2684) review cycles).

      Net effect: the declared total understates monthly spend by **~\$200/mo (~56% understatement)**. Any cost-routing decision based on this file is wrong; any spend report based on `totals.monthly_subscriptions` ships stale.'
  - idempotency_key: gh:vamseeachanta/workspace-hub#2699
