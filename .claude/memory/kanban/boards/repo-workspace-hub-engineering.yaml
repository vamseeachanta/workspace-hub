- idempotency_key: gh:vamseeachanta/workspace-hub#1637
  title: 'Parametric spec generator: multi-dimensional sweep combinations and CLI interface'
  source: github_issue
  source_url: https://github.com/vamseeachanta/workspace-hub/issues/1637
  gh_state: open
  gh_labels:
  - cat:engineering
  - domain:marine
  - enhancement
  - priority:medium
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Context\nOvernight run 2026-04-01 (#1596) delivered a parametric spec.yml generator at `digitalmodel/src/digitalmodel/solvers/parametric_spec_generator.py` with frequency, heading, and hull parameter sweeps. Current limitations:\n- Cross-product of sweeps produces N*M specs (can explode)\n- No CLI interface for batch generation\n- No spec naming convention based on sweep parameters\n\n## What to do\n1. Add a `max_specs` guard to prevent accidental generation of >1000 specs\n2. Add a CLI entry point: `uv run python -m digitalmodel.solvers.parametric_spec_generator --base spec.yml --freq-sweep 0.1:2.0:5 --output-dir output/`\n3. Add naming convention: `spec_{vessel}_{sweep_dim}_{value}.yml`\n4. Add combined sweep mode (frequency x heading = cartesian product)\n5. Tests for each new feature\n6. Update docstrings\n\n## Acceptance criteria\n- CLI works: `uv run python -m digitalmodel.solvers.parametric_spec_generator --help`\n- max_specs guard raises ValueError when exceeded\n-
    Naming convention applied to output files\n- All existing 14 tests + new tests pass\n\n## Parent\nFollows from #1596'
