- idempotency_key: gh:vamseeachanta/workspace-hub#2774
  title: Private llm-wiki corpus-ingest program (post-2026-05-20 privacy flip)
  source: github_issue
  source_url: https://github.com/vamseeachanta/workspace-hub/issues/2774
  gh_state: open
  gh_labels:
  - documentation
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Goal

    Following the 2026-05-20 visibility flip of \`vamseeachanta/llm-wiki\` from public to private (see [project_llm_wiki_privacy_flip](../../.claude/memory) + [.claude/rules/codes-standards-data-routing.md](../../.claude/rules/codes-standards-data-routing.md)), bulk-ingest the vendor-licensed engineering codes/standards corpora and specialist non-codes corpora from \`/mnt/ace/\` into the private llm-wiki at full fidelity. Pilot complete: OCIMF MEG3/MEG4 Annex A digitized corpus landed 2026-05-20 (llm-wiki \`707af307\`).

    ## Source inventory'
