- idempotency_key: gh:vamseeachanta/workspace-hub#2717
  title: 'infra: live AQWA env access on licensed Windows host — prerequisite for #2709'
  source: github_issue
  source_url: https://github.com/vamseeachanta/workspace-hub/issues/2717
  gh_state: open
  gh_labels:
  - cat:engineering
  - domain:marine
  - enhancement
  - machine:licensed-win-1
  - machine:licensed-win-2
  - priority:high
  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '## Why

    [#2709](https://github.com/vamseeachanta/workspace-hub/issues/2709) (AQWA runner adapter) has been adversarially reviewed twice (r1 Codex MAJOR / 7 blockers, r2 Claude MAJOR / 13 findings, 8 blockers). The reviewer''s closing diagnosis on r2:

    > "Until the live smoke validation actually runs once and is captured, the probe and scrape logic is speculation."'
- idempotency_key: gh:vamseeachanta/workspace-hub#2711
  title: 'feat(provider-data): service-provider data library — Helix 15k IRS pilot'
  source: github_issue
  source_url: https://github.com/vamseeachanta/workspace-hub/issues/2711
  gh_state: open
  gh_labels:
  - cat:engineering
  - domain:marine
  - enhancement
  - priority:medium
  - status:plan-approved
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Why

    User goal 2026-05-14: "also add data from service providers such as helix: example brochure: https://helixesg.com/downloads/Helix_Well_Ops-_IRS_7_15k-_LTR_11-28-23_FINAL.pdf"

    This expands the solver-submission story from "submit a model file" to "build a model from real service-provider equipment data, then submit." Service-provider brochures contain engineering-grade parameters (working pressures, water-depth ratings, bore diameters, design temperature ranges) that should feed directly into OrcaFlex/AQWA riser, vessel, and mooring models.'
- idempotency_key: gh:vamseeachanta/workspace-hub#2709
  title: 'feat(solver-queue): add AQWA runner adapter and schema extension'
  source: github_issue
  source_url: https://github.com/vamseeachanta/workspace-hub/issues/2709
  gh_state: open
  gh_labels:
  - cat:engineering
  - domain:marine
  - enhancement
  - machine:licensed-win-1
  - priority:high
  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '## Why

    Current solver queue supports `orcawave | orcaflex` only. AQWA is referenced in `docs/ops/2026-05-04-multimachine-baseline-inventory.md` §5 as "Run only on licensed Windows hosts" and is in scope for #2641''s broader multi-machine inbox vision, but no runner adapter exists. User goal stated 2026-05-14: "run aqwa and orcaflex analyses as needed from any machine with a prompt and submission of files."

    Related: #2641 (multi-machine inbox parent — broader), #2708 (OrcaFlex validation — proves the pattern for AQWA to mirror).'
