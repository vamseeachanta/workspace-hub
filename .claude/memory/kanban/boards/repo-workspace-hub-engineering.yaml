  - machine:dev-primary
  - priority:medium
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Fill domain gaps in online resource registry — orcawave, fatigue, subsea, geotechnical\n\n**Parent:** #1563 (Data & Resource Intelligence)\n**Depends on:** #1576 (closed), #1577 (closed)\n\n### Context\nDomain resource views revealed several domains with thin coverage:\n- **orcawave**: 0 resources (skipped in view generation)\n- **fatigue**: 0 direct entries (17 fatigue standards exist under structural)\n- **subsea**: 1 resource only\n- **geotechnical**: 0 resources\n- **electrical**: 0 resources (issue #57 already tracks this)\n\n### Scope\n1. Research and add at least 10 resources per thin domain:\n   - **orcawave**: Orcina OrcaWave docs, validation papers, BEM theory refs\n   - **fatigue**: S-N curve databases, crack growth tools (NASGRO, AFGROW), DNV-RP-C203 portal, BS 7608\n   - **subsea**: subsea engineering tools, ROV/AUV resources, flexible pipe refs\n   - **geotechnical**: pile design tools (OPILE, PLAXIS), DNV-RP-C212, ISO 19901-4\n\n2. Re-run `scripts/data/build-online-resource-registry.py`
    to rebuild registry\n3. Re-run `scripts/data/generate-domain-resource-views.py` to update domain pages\n4. New domain pages should appear for orcawave, fatigue (if separated from structural)\n\n### Acceptance Criteria\n- [ ] At least 30 new entries across thin domains\n- [ ] Domain views generated for previously-skipped domains\n- [ ] No domain has fewer than 3 resources\n'
- idempotency_key: gh:vamseeachanta/workspace-hub#1609
  title: Automated resource download pipeline — execute top-priority downloads from registry
  source: github_issue
  source_url: https://github.com/vamseeachanta/workspace-hub/issues/1609
  gh_state: open
  gh_labels:
  - enhancement
  - machine:dev-primary
  - priority:medium
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Automated resource download pipeline — execute top-priority downloads\n\n**Parent:** #1563 (Data & Resource Intelligence)\n**Depends on:** #1576 (closed), #1580 (closed)\n\n### Context\nThe unified online-resource-registry.yaml now has 247 entries, 230 with download_status=not_started.\nThe registry includes local_backup_path targets and relevance_scores for prioritization.\n\n### Scope\n1. Build `scripts/data/download-registry-resources.py` that:\n   - Reads `data/document-index/online-resource-registry.yaml`\n   - For each entry with download_status=not_started, ordered by relevance_score desc:\n     - GitHub repos: `git clone --depth 1` to local_backup_path\n     - PDFs: `wget`/`curl` to local_backup_path\n     - Standard portals: skip (require manual/browser interaction)\n     - Data APIs: basic metadata fetch\n   - Updates download_status in registry after each download\n   - Respects rate limits, retries on failure\n   - Writes download log to `data/document-index/download-log.yaml`\n\n2.
    Priority targets (all relevance_score=5):\n   - The Well (Polymathic AI) — GitHub repo + paper\n   - DNV Standards Explorer (reference, skip download)\n   - API Standards (reference, skip download)\n   - BSEE/EIA/SODIR data APIs\n   - Copernicus CDS API\n   - NDBC ocean observations\n\n3. TDD — tests first\n\n### Acceptance Criteria\n- [ ] Download script with --dry-run mode\n- [ ] At least 20 resources downloaded in first batch\n- [ ] Registry updated with download_status=downloaded for completed items\n- [ ] Download log with timestamps and error tracking\n'
