  - idempotency_key: gh:vamseeachanta/workspace-hub#1782
    title: 'epic: zero-loss agent learnings — git-track ALL AI agent memories, corrections, patterns, and insights'
    source: github_issue
    source_url: https://github.com/vamseeachanta/workspace-hub/issues/1782
    gh_state: open
    gh_labels:
      - enhancement
      - priority:high
      - cat:ai-orchestration
      - cat:harness
      - status:working
      - machine:multi
      - agent:claude
      - agent:codex
      - status:plan-approved
      - dispatch:ready
      - gate:completeness
      - domain:knowledge-management-platform
      - lane:claude
    gh_assignees: []
    initial_status: triage
    priority: 1
    body_excerpt: '## Context

      A full audit of all 4 AI agents (Claude Code, Hermes, Codex, Gemini) revealed that **~6.7GB of machine-local state** has NO git protection. If ace-linux-1 dies, the entire institutional memory built over months of agent interaction is lost.

      The learnings that matter most — user corrections, learned patterns, permission rules, cross-agent insights — total only ~400KB but are scattered across 4 different home directories with no unified backup or portability strategy.'
