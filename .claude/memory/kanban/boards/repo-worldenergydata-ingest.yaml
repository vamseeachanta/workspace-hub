    body_excerpt: '## Background


      Issue #357 (closed 2026-04-29) restored the ProductionAPI12 NPV calculation contract for backward compatibility, unblocking PR #356. The restoration was tactical — it rewires `ProductionAPI12Analysis` to the legacy `NPVCalculator` class (~400 LOC at `bsee/analysis/legacy/api12_economics.py`) which carries pre-2019 Excel-benchmark assumptions and hardcoded prices. This is not the long-term forward path.'
