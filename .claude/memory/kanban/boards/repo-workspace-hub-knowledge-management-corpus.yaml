    body_excerpt: 'Child of holistic doc-intel feature. Scan /mnt/ace/ for resources not tracked in any registry: (1) 8 cloned GitHub repos (WEC-Sim, openfast, gmsh, capytaine, HAMS, MoorDyn, MoorPy, opm-common) — are they in the OSS catalog? (2) 30 conference paper collections in docs/conferences/ — are they indexed? (3) 38 GB O&G-Standards/ — cross-check against standards-transfer-ledger.yaml. (4) docs/engineering-refs/ subdirs. Script: scripts/data/ace-resource-audit.py. Output: docs/reports/ace-undiscovered-resources.md. TDD. Use uv run.'
  - idempotency_key: gh:vamseeachanta/workspace-hub#1611
    title: Fill domain gaps in resource registry — orcawave, fatigue, subsea, geotechnical
    source: github_issue
    source_url: https://github.com/vamseeachanta/workspace-hub/issues/1611
    gh_state: open
    gh_labels:
      - enhancement
      - priority:medium
      - machine:dev-primary
      - dispatch:ready
      - gate:completeness
      - domain:knowledge-management-corpus
    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Fill domain gaps in online resource registry — orcawave, fatigue, subsea, geotechnical\n\n**Parent:** #1563 (Data & Resource Intelligence)\n**Depends on:** #1576 (closed), #1577 (closed)\n\n### Context\nDomain resource views revealed several domains with thin coverage:\n- **orcawave**: 0 resources (skipped in view generation)\n- **fatigue**: 0 direct entries (17 fatigue standards exist under structural)\n- **subsea**: 1 resource only\n- **geotechnical**: 0 resources\n- **electrical**: 0 resources (issue #57 already tracks this)\n\n### Scope\n1. Research and add at least 10 resources per thin domain:\n   - **orcawave**: Orcina OrcaWave docs, validation papers, BEM theory refs\n   - **fatigue**: S-N curve databases, crack growth tools (NASGRO, AFGROW), DNV-RP-C203 portal, BS 7608\n   - **subsea**: subsea engineering tools, ROV/AUV resources, flexible pipe refs\n   - **geotechnical**: pile design tools (OPILE, PLAXIS), DNV-RP-C212, ISO 19901-4\n\n2. Re-run `scripts/data/build-online-resource-registry.py`
      to rebuild registry\n3. Re-run `scripts/data/generate-domain-resource-views.py` to update domain pages\n4. New domain pages should appear for orcawave, fatigue (if separated from structural)\n\n### Acceptance Criteria\n- [ ] At least 30 new entries across thin domains\n- [ ] Domain views generated for previously-skipped domains\n- [ ] No domain has fewer than 3 resources\n'
