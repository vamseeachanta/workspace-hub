- idempotency_key: gh:vamseeachanta/worldenergydata#367
  title: 'refactor(bsee): migrate ProductionAPI12 NPV from legacy path to FDAS forward
    layer (#357 follow-up)'
  source: github_issue
  source_url: https://github.com/vamseeachanta/worldenergydata/issues/367
  gh_state: open
  gh_labels:
  - enhancement
  - cat:engineering
  - priority:medium
  - status:plan-approved
  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '## Background


    Issue #357 (closed 2026-04-29) restored the ProductionAPI12 NPV calculation contract
    for backward compatibility, unblocking PR #356. The restoration was tactical —
    it rewires `ProductionAPI12Analysis` to the legacy `NPVCalculator` class (~400
    LOC at `bsee/analysis/legacy/api12_economics.py`) which carries pre-2019 Excel-benchmark
    assumptions and hardcoded prices. This is not the long-term forward path.'
