- idempotency_key: gh:vamseeachanta/worldenergydata#420
  title: 'policy(legal): operator-aggregation deny-list for public-repo HSE analysis
    (#416 supporting)'
  source: github_issue
  source_url: https://github.com/vamseeachanta/worldenergydata/issues/420
  gh_state: open
  gh_labels:
  - enhancement
  - priority:medium
  - cat:data
  - cat:operations
  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '## Context


    Supports the [#416](https://github.com/vamseeachanta/worldenergydata/issues/416)
    Operator Aggregation Contract. Currently the contract references "deny-list union
    (workspace-hub .legal-deny-list.yaml ∪ common GoM operator names)" but the "common
    GoM operator names" half doesn''t exist as a committed list.'
- idempotency_key: gh:vamseeachanta/worldenergydata#418
  title: 'feat(code): intervention HSE — Phase 2 reusable module extraction (worldenergydata.bsee.analysis.intervention_hse)'
  source: github_issue
  source_url: https://github.com/vamseeachanta/worldenergydata/issues/418
  gh_state: open
  gh_labels:
  - enhancement
  - cat:engineering
  - priority:medium
  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '## Context


    Child of [#416](https://github.com/vamseeachanta/worldenergydata/issues/416).
    Phase 1 (1A + 1B) produces ad-hoc analysis scripts and memos. Phase 2 extracts
    the reusable queries into a committed module so future intervention-HSE questions
    are answerable in minutes, not hours.'
- idempotency_key: gh:vamseeachanta/worldenergydata#407
  title: 'research+plan(vessel_fleet): dry-run findings + Noble/Seadrill vendor→curated
    merge readiness assessment'
