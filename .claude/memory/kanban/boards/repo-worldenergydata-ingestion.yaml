- idempotency_key: gh:vamseeachanta/worldenergydata#275
  title: 'fix(scripts): make migrate_print_to_logging.py AST-aware to avoid mid-import
    injection'
  source: github_issue
  source_url: https://github.com/vamseeachanta/worldenergydata/issues/275
  gh_state: open
  gh_labels:
  - bug
  - cat:engineering
  - status:plan-approved
  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '## Problem


    `scripts/migrate_print_to_logging.py` inserts `get_logger` at a fixed line offset
    without checking whether that position is inside an unclosed `(` block. This broke
    **19 files** in Phase 2B.'
