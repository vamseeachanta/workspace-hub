  priority: 0
  body_excerpt: '## Problem

    `config/ai-tools/agent-capability-scores.yaml` (declared `version: \"2026-03-13\"`, `next_review: \"2026-06-06\"`) drives the radar visualization at [`config/ai-tools/agent-capability-radar.html`](https://github.com/vamseeachanta/workspace-hub/blob/main/config/ai-tools/agent-capability-radar.html) — the user-facing representation of provider capability vs. cost across 6 dimensions.

    The scored dimensions in `provider_comparison.dimensions` are: `Reasoning, Code Generation, Context Window, Cost Efficiency, Research & Docs, Orchestration`. Per-provider scores are 0–10 integers.'
- idempotency_key: gh:vamseeachanta/workspace-hub#2698
  title: 'feat(ai-orchestration): migration plan for AI_ECOSYSTEM_DESIGN.md adoption (day-1 / month-1 / quarter-1)'
  source: github_issue
  source_url: https://github.com/vamseeachanta/workspace-hub/issues/2698
  gh_state: open
  gh_labels:
  - cat:ai-orchestration
  - enhancement
  - priority:medium
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Problem

    [`docs/standards/AI_ECOSYSTEM_DESIGN.md`](https://github.com/vamseeachanta/workspace-hub/blob/main/docs/standards/AI_ECOSYSTEM_DESIGN.md) landed at commit `f30a8fe2d` (parent: [#2675](https://github.com/vamseeachanta/workspace-hub/issues/2675), closed) as the durable design contract for how the repo ecosystem uses Claude, Hermes, Codex, and Gemini together. It declares **what good looks like** per work class (§A), **who owns what** (§B), and **how the work flows** (§C–§D), plus the **failure-mode contract** (§E).

    What''s missing: an **adoption schedule**. The design contract is correct in intent, but the operational world doesn''t reorganize itself overnight to match. Existing `config/agents/`, `config/ai-tools/`, `scripts/review/`, and skill files were written incrementally over months and contain settings that the standards doc supersedes — but no sequence-of-changes is defined to bring them into alignment.'
- idempotency_key: gh:vamseeachanta/workspace-hub#2697
  title: 'chore(ai-tools): refresh subscriptions.yaml with current Codex paid plan + bump declared totals'
  source: github_issue
  source_url: https://github.com/vamseeachanta/workspace-hub/issues/2697
  gh_state: open
  gh_labels:
  - cat:ai-orchestration
  - enhancement
  - priority:high
  - status:plan-review
  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '## Problem

    `config/ai-tools/subscriptions.yaml` (`last_updated: 2025-12-23`) declares a monthly subscription total of **\$156.75/mo** across 4 services (Claude Max, OpenAI Plus, Google AI Pro, GitHub Copilot Pro). It does **not include the Codex paid plan (\$200/mo)** that has been in active use throughout the 2026-04/05 wave and across multiple plan executions (verified at [#2675](https://github.com/vamseeachanta/workspace-hub/issues/2675), [#2683](https://github.com/vamseeachanta/workspace-hub/issues/2683), [#2684](https://github.com/vamseeachanta/workspace-hub/issues/2684) review cycles).

    Net effect: the declared total understates monthly spend by **~\$200/mo (~56% understatement)**. Any cost-routing decision based on this file is wrong; any spend report based on `totals.monthly_subscriptions` ships stale.'
