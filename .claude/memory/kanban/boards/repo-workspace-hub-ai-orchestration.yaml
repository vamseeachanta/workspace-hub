  priority: 1
  body_excerpt: 'Recorded user feedback 2026-05-17 (auto-memory `feedback_memory_aspire_to_hermes_level`): **all AI provider work should flow through Hermes agent''s memory strategy**. Hermes-memory is the canonical backend; per-provider stores (Claude Code auto-memory, Codex state, Gemini session memory) should consolidate to Hermes rather than evolve in parallel.

    ## Architectural ask

    Current state is fragmented:'
