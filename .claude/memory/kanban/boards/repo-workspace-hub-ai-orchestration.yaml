    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Task\nConfigure Telegram bot integration for the Hermes gateway running as a systemd service on ace-linux-1.\n\n## Current State\n- Hermes gateway installed and running as system service (v0.7.0)\n- `GATEWAY_ALLOW_ALL_USERS=true` already set in `~/.hermes/.env`\n- Systemd service properly loads `EnvironmentFile=/home/vamsee/.hermes/.env`\n- No messaging platforms configured yet — gateway logs: "No messaging platforms enabled"\n\n## Required Config (add to `~/.hermes/.env`)\n```\nTELEGRAM_BOT_TOKEN=<bot-token-from-botfather>\nTELEGRAM_ALLOWED_USERS=<user-chat-id>\n```\n\n## Steps\n1. Create bot via @BotFather on Telegram → get token\n2. Start a chat with the bot, send any message\n3. Get chat ID via `curl https://api.telegram.org/bot<TOKEN>/getUpdates`\n4. Add both vars to `~/.hermes/.env`\n5. `hermes gateway restart --system`\n6. Verify gateway logs show Telegram polling started\n7. Send test message to verify end-to-end\n\n## Acceptance\n- Gateway logs show Telegram
      bot connected\n- Bot responds to a test command (e.g., /status)\n- Message delivery to origin works'
