    body_excerpt: '## Context

      A new contract was established 2026-05-19: `.claude/skills/coordination/pre-completion-cleanup-audit/SKILL.md` defines a closeout gate that runs before any agent reports "all done". The must-fire rule in `config/agents/SHARED_SOUL.md` binds standalone agents (Claude main session, Codex CLI, Gemini CLI). This issue tracks the Hermes-side integration so the gate runs **automatically on every sub-agent completion signal**, not just when the sub-agent remembers.

