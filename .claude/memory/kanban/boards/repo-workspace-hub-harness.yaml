  initial_status: triage
  priority: 0
  body_excerpt: '## Problem

    `~/.cache/agent-quota.json` accumulates synthetic per-credential entries with `source: "exhausted_http_429"` when Codex accounts hit usage limits. These entries set `week_messages` to the weekly limit (e.g., 1400) to represent 100% usage. After the actual weekly reset, these entries persist indefinitely — causing false exhaustion warnings.

    ## Proposed Fix'
