    body_excerpt: '## Background

      Subsea production systems use unbonded flexible pipes (API 17B/17J) for dynamic riser and flowline applications. Current `subsea/catenary_riser/` has basic catenary/lazy-wave geometry but no flexible-pipe-specific modeling.

      ## Problem'
