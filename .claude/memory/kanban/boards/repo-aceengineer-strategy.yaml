- idempotency_key: gh:vamseeachanta/aceengineer-strategy#17
  title: Prepare GTM outreach pack for smaller installation vessel owners
  source: github_issue
  source_url: https://github.com/vamseeachanta/aceengineer-strategy/issues/17
  gh_state: open
  gh_labels:
  - priority:P1
  - strategy
  - status:scoping
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Background

    We have an existing digitalmodel vessel-suitability GTM pack with jumper installation,
    mudmat installation, and shallow pipelay capability examples. The next GTM wedge
    is smaller installation vessel owners/operators: regional CSV/MPSV/ROV-support
    fleets, subsea construction contractors, mooring/IMR/decommissioning contractors,
    and commercial teams that need to prove vessel capability in tenders.

    Strategy draft:'
