- idempotency_key: gh:vamseeachanta/workspace-hub#1614
  title: Registry freshness checker — periodic URL validation and dead link detection
  source: github_issue
  source_url: https://github.com/vamseeachanta/workspace-hub/issues/1614
  gh_state: open
  gh_labels:
  - enhancement
  - machine:dev-primary
  - priority:low
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Registry freshness checker — periodic URL validation and dead link detection\n\n**Parent:** #1563 (Data & Resource Intelligence)\n**Depends on:** #1576 (closed)\n\n### Context\nThe online resource registry has 247 URLs. Over time, URLs go dead, content moves, or APIs change.\nNeed a periodic check to keep the registry accurate.\n\n### Scope\n1. Build `scripts/data/check-registry-freshness.py` that:\n   - Reads `data/document-index/online-resource-registry.yaml`\n   - For each URL, performs HEAD request (with timeout/retry)\n   - Updates `last_checked` field with current date\n   - Flags dead links (HTTP 404/410/5xx or connection error)\n   - Reports: alive, redirected, dead, timeout\n\n2. Add to schedule-tasks.yaml as a weekly cron task\n3. TDD\n\n### Acceptance Criteria\n- [ ] Freshness checker validates all 247 URLs\n- [ ] Dead links flagged with `download_status: dead_link`\n- [ ] Cron entry in schedule-tasks.yaml (weekly, off-peak)\n- [ ] Summary report in last run
    output\n'
