- idempotency_key: gh:vamseeachanta/workspace-hub#2662
  title: GTM client-artifact layout inconsistent across repos — no shared bundle convention
  source: github_issue
  source_url: https://github.com/vamseeachanta/workspace-hub/issues/2662
  gh_state: open
  gh_labels:
  - domain:repo-cleanup
  - status:needs-plan
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Problem

    Client-sendable GTM bundles are saved in different layouts, with different date conventions, and in different bundle formats across child repos and within workspace-hub itself. Searching any single canonical path misses bundles delivered from other repos in the same week.

    This was noticed on 2026-05-11 when a recall query for "GTM material from the last week" cited only two of three known bundles — the `digitalmodel` pack was missed because it lives under a different layout root than the `worldenergydata` and `workspace-hub` packs.'
- idempotency_key: gh:vamseeachanta/workspace-hub#2658
  title: 'O&G-Standards consolidator: 8 catalog-classification defects surfaced by parallel-agent ingest'
  source: github_issue
  source_url: https://github.com/vamseeachanta/workspace-hub/issues/2658
  gh_state: open
  gh_labels:
  - cat:data
  - cat:tooling
  - domain:quality
  - domain:standards-tooling
  - llm-wiki
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Summary

    Iterations 8-9 of the LLM-wiki completeness loop ran 9 parallel research agents against `/mnt/ace/O&G-Standards/`. They independently surfaced the same structural classification gap in the upstream **O&G Standards Consolidation System** (per `_catalog.json` `metadata.source`, version 1.0.0, generated 2025-12-25). The consolidator''s outputs — `_catalog.json` (19.5 MB), `_inventory.db` (6.8 GB SQLite), `_catalog.html` — encode the eight defects below, which all downstream wiki ingest, retrieval, and citation consumers inherit.

    Cross-agent confirmation across 9 independent passes makes this a high-confidence, reproducible defect — not a sampling artifact.'
