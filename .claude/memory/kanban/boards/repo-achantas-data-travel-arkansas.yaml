      - lane:claude
      - priority:medium
    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Summary

      Research Eureka Springs / Beaver Lake as the best overall Arkansas Broken Bow analog: wooded cabins, hot tubs, lake access, family-size options, and a destination town. Main tradeoff is the long drive from west Houston.

      Parent: [#101](https://github.com/vamseeachanta/achantas-data/issues/101)'
