    body_excerpt: '## Context

      `_derive_decline_rate_from_eur()` hard-codes `recovery_factor=0.15` (15% of OOIP).  This is a common GoM deepwater rule-of-thumb but is wrong for many reservoir types (e.g. water-flood: 30–40%, tight oil: 5–8%).

