    gh_assignees: []
    initial_status: triage
    priority: 0
    body_excerpt: '## Problem

      `EconomicsInput.__post_init__` coerces `decline_type` from string to `DeclineType` enum **after** the EUR auto-derive block.  If a caller passes `decline_type="linear"` (a string, not the enum), the guard `self.decline_type == DeclineType.LINEAR` evaluates to `False` and EUR auto-derivation is silently skipped.

      ```python'
