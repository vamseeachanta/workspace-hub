- idempotency_key: gh:vamseeachanta/achantas-data#78
  title: Family — devaKrishna Letter of Intent (drafting + incremental maintenance)
  source: github_issue
  source_url: https://github.com/vamseeachanta/achantas-data/issues/78
  gh_state: open
  gh_labels:
  - documentation
  - enhancement
  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '**Parent:** #73 · **Horizon:** v1 draft within 6 months; revised
    annually thereafter

    **Why:** The Letter of Intent (LOI) is the **most important non-legal document**
    for devaKrishna''s lifetime care. It captures everything a successor caregiver
    needs to know — daily routine, preferences, medical, communication patterns, who-knows-him
    list, education history, therapies, social context, financial picture, advocacy
    notes. Builds incrementally over years; legally non-binding but referenced by
    the SNT trustee.

    ## Action'
