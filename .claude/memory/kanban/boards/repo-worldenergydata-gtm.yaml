- idempotency_key: gh:vamseeachanta/worldenergydata#423
  title: 'epic(marketing): Engineering Analytics from Public Regulatory Data — long-term
    marketing pipeline'
  source: github_issue
  source_url: https://github.com/vamseeachanta/worldenergydata/issues/423
