  - status:plan-review
  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '## Umbrella for A&CE''s public-regulatory-data marketing pipeline


    A&CE''s distinctive position: engineering analytics built on public regulatory
    data (BSEE, EPA, OSHA, PHMSA, USCG, IMO). Operators and engineering firms can
    verify the data source — every pattern A&CE surfaces gains credibility-by-source.
    This issue tracks the long-term pipeline of analytical artifacts that exercise
    that capability.'
