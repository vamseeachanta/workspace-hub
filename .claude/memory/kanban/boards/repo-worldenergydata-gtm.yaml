- idempotency_key: gh:vamseeachanta/worldenergydata#363
  title: 'feat(api): public Python query API for HSE module — parity with marine_safety
    surface'
  source: github_issue
  source_url: https://github.com/vamseeachanta/worldenergydata/issues/363
  gh_state: open
  gh_labels:
  - enhancement
  - cat:engineering
  - priority:medium
  - cat:data
  - status:plan-approved
  gh_assignees: []
  initial_status: triage
  priority: 1
  body_excerpt: '## Problem


    `marine_safety` exposes a clean public API: `wed.marine_safety_api.incidents.query(source=''maib'',
    year=2022, incident_type=''collision'')`. The `hse` module has importers + DB
    models but no equivalent query surface. Without it, prospects cannot run \"show
    me operator X''s BSEE-INC trend\" or \"rank gas-distribution incidents by state\"
    without direct DB access — which forces every demo to be hand-curated marketing
    rather than a runnable artifact.'
