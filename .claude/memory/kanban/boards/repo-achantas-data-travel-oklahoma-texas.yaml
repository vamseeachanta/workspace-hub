    body_excerpt: '## Summary

      Caddo Lake / Uncertain is the most visually distinctive Texas option — cypress swamp, Spanish moss, kayaking, still water — but it is a **stretch**, not a clean substitute. Live routing from a west-Houston/Katy proxy returned roughly **266.7 miles / 5.13 hours**, outside the preferred ~4-hour gate.

      Parent exploration: https://github.com/vamseeachanta/achantas-data/issues/95'
