- idempotency_key: gh:vamseeachanta/digitalmodel#611
  title: 'OrcaWave: define result export and postprocess contract for diffraction runs'
  source: github_issue
  source_url: https://github.com/vamseeachanta/digitalmodel/issues/611
  gh_state: open
  gh_labels:
  - enhancement
  - status:plan-review
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Problem

    The OrcaWave runner can save `.owr` and a data file through OrcFxAPI, and separate utilities can read `.xlsx` sidecars or `.owr` results. The workflow needs a clear output contract so downstream OrcaFlex
    handoff, reports, benchmarks, and QA can consume a run consistently.

    ## Required work'
- idempotency_key: gh:vamseeachanta/digitalmodel#606
  title: 'OrcaWave: integrate MeshPipeline into spec conversion and runner'
  source: github_issue
  source_url: https://github.com/vamseeachanta/digitalmodel/issues/606
  gh_state: open
  gh_labels:
  - enhancement
  - status:plan-review
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Problem

    The diffraction module has a `MeshPipeline` that can load, validate, and prepare meshes for solvers, but the OrcaWave spec conversion and runner paths do not yet use it to prepare arbitrary mesh inputs.

    Without this integration, a user must already know which mesh formats are solver-ready and manually convert or arrange files before running diffraction.'
- idempotency_key: gh:vamseeachanta/digitalmodel#605
  title: 'OrcaWave: produce self-contained solver packages from spec conversion'
  source: github_issue
  source_url: https://github.com/vamseeachanta/digitalmodel/issues/605
  gh_state: open
  gh_labels:
  - enhancement
  - status:plan-review
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Problem

    `diffraction convert-spec --solver orcawave` generates OrcaWave YAML, but it does not yet guarantee the output directory is self-contained and runnable. The backend writes mesh references as basenames,
    while referenced mesh files and auxiliary meshes may still live beside the source `spec.yml`.

    This overlaps with, but is broader than, #500. #500 covers mesh pre-flight validation and runner auto-copy; this issue is specifically about the conversion/package artifact created by `convert-spec`.'
