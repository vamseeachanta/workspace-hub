- idempotency_key: gh:vamseeachanta/digitalmodel#529
  title: 'OrcaFlex: convert_batch() parallel path doesn''t aggregate success counts into self.stats'
  source: github_issue
  source_url: https://github.com/vamseeachanta/digitalmodel/issues/529
  gh_state: open
  gh_labels:
  - bug
  - status:plan-approved
  gh_assignees: []
  initial_status: triage
  priority: 0
  body_excerpt: '## Summary

    `OrcaFlexConverterEnhanced.convert_batch()` with `parallel=True` does not update `self.stats[''successful'']`, `self.stats[''failed'']`, `self.stats[''validation_failed'']`, or `self.stats[''errors'']`
    as worker futures complete. The progress bar shows `✓` for each converted file, but `stats[''successful'']` remains `0` after batch completion.

    ## Evidence'
