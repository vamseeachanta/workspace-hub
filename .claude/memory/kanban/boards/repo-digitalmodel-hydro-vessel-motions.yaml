    body_excerpt: '## Background

      Towed barge operations in rivers and shallow waters face strong current-induced risks. We have ocean current support (`data_procurement/metocean/`) and DNV-RP-H103 open-sea current loading, but no river/shallow-water current profiles.

      ## Problem'
