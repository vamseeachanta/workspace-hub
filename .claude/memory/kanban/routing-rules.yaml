# routing-rules.yaml — capability map + provider capacity for issue dispatch
# Read by scripts/dispatch/route.py. Decided with user 2026-05-25.
# Assignment source of truth is GitHub labels; this file only drives the
# rule engine's PROPOSALS (which you approve before any label is written).

# ---------------------------------------------------------------------------
# Label axis cardinality — which axes are SCALARS and which are SETS.
#
# A GitHub label set permits states the domain forbids: nothing stops two
# `status:` labels, but an issue cannot be in two workflow states. Measured
# 2026-07-30 across 1,761 open issues: 146 carried 2+ labels on one axis, 36 of
# them on `status:` — including 14 that were `plan-approved` AND `plan-review`
# at the same time, i.e. approved to one reader and pending to another.
#
# route.py used to resolve those by taking the FIRST matching label, so the
# outcome depended on GitHub's API ordering: silent, non-deterministic, and
# indistinguishable from a correct issue at the point of use. Silently picking
# one of two contradictory answers is worse than refusing — a refusal gets
# fixed, a silent pick gets shipped.
#
# The split has to be DECLARED rather than inferred, because no scan can tell
# "this axis permits multiple" from "this axis was violated 74 times".
# Each entry carries its reason: a bare list invites flipping an axis on a
# hunch; a sentence makes the next person argue with it.
# ---------------------------------------------------------------------------
label_axes:
  single:
    "status:":  "a position in a state machine — an issue cannot be in two at once"
    "machine:": "one execution host; `multi` is the value for work that spans several"
    "lane:":    "one implementing provider; a second opinion is `needs:cross-review`"
    "agent:":   "one agent owns the work item"
  multi:
    "domain:":  "work genuinely spans domains — 74 open issues legitimately do"
    "cat:":     "categories overlap by design"
    "needs:":   "requirements accumulate; an issue can need cross-review AND the frontier tier"

# ---------------------------------------------------------------------------
# Machine roster  -> machine:<id> label values + dispatch/<id>.yaml queue files
# Canonical scheme = the pre-existing in-the-wild vocabulary (user 2026-05-25,
# "adopt existing scheme"): names encode capability, so 0 cards get relabeled.
# `hostname:` lets a script self-identify which machine it is running on.
# ---------------------------------------------------------------------------
machines:
  dev-primary:      {os: linux, role: primary,     hostname: ace-linux-1, notes: "this box; kanban manifest origin"}
  dev-secondary:    {os: linux, role: secondary,   hostname: ace-linux-2}
  cfd-dedicated:    {os: linux, role: compute,     hostname: gpu-claw, capabilities: [cfd, openfoam],
                     notes: "dedicated CFD node reached from ace-linux-1 over the WireGuard VPN"}
  # deckhand#579: licence_verified is a DATED ATTESTATION, not an inference.
  # A licensed capability is only routable when someone recorded that they saw
  # it work, when, and how. `false` is a claim too — it says "checked, does not
  # hold" — and is what keeps a host in the roster without making it a target.
  # CAPABILITY IS TWO DIMENSIONS, not one: a host must have the LICENCE and the
  # CAPACITY. Checking only the dimension you were last burned by is how both
  # defects here happened — see tests/dispatch/test_route_capacity.py.
  licensed-win-1:   {os: windows, role: engineering, capabilities: [orcawave, aqwa, orcaflex],
                     capacity: heavy,
                     licence_verified: false,
                     blocked_on: "deckhand#579 — Sentinel LDK runtime absent (OrcFxAPI.Model() fails
                                  DLLError 25; 1947 not listening, hasplms absent). Owner designates
                                  THIS the licensed execution host; the licence is a prerequisite in
                                  flight, not a reason to route elsewhere.",
                     notes: "THE heavy node: 64 logical cores / 255.7 GB; declared batch target for
                             dm#1553 (OrcaFlex N≈57 parallel sims). SHARED ACMA production box — cap
                             concurrency. AQWA/OrcaWave attestation pending deckhand#542/#544."}
  licensed-win-2:   {os: windows, role: engineering, capabilities: [orcawave, aqwa, orcaflex],
                     capacity: workstation,
                     licence_verified: {at: "2026-07-30", by: "owner",
                                        how: "bokalift orcawave-diffraction-solve ran end-to-end on this host"},
                     aliases: [acma-ws014],
                     notes: "Workstation, NOT sized for batch — owner 2026-07-31: 'ws014 is not powerful
                             enough'. Holds a working licence and is the queue lane's CANONICAL default
                             (policy licensed_host) for UN-ADDRESSED requests, which is a routing
                             fallback, not an execution target for batch work."}
  home-win:         {os: windows, role: aux,        notes: "home windows; statements/scans (e.g. Chase)"}
  macbook-portable: {os: macos,   role: aux,        notes: "portable/mobile work"}
  multi:            {os: any,     role: virtual,    notes: "spans machines / not pinned to one box"}

# Alias map (label-in-the-wild -> canonical machine). route.py folds these so
# machine:acma-ws014 counts as licensed-win-2 without relabeling existing cards.
machine_aliases:
  acma-ws014: licensed-win-2
  ace-linux-1: dev-primary      # hostname-style stragglers -> canonical dispatch name
  ace-linux-2: dev-secondary
  gpu-claw: cfd-dedicated

# ---------------------------------------------------------------------------
# Provider capacity  -> ai:<provider> label values
# CRITICAL: hermes runs VIA codex, so it draws from the codex quota. They share
# ONE budget pool. WIP must be capped on the pool, not per-provider, or a naive
# (codex:2 + hermes:2) silently permits 4 concurrent draws on one budget.
# (user: "gemini has usage limit; hermes runs via codex; claude+codex highest")
# ---------------------------------------------------------------------------
providers:
  claude: {tier: workhorse, auto_routable: true}
  codex:  {tier: workhorse, auto_routable: true, budget_pool: codex_pool}
  hermes: {tier: shared,    auto_routable: true, budget_pool: codex_pool}  # consumes codex quota
  gemini: {tier: scarce,    auto_routable: false, note: "manual ai:gemini only; never auto-route backlog"}

budget_pools:
  codex_pool:
    members: [codex, hermes]
    max_concurrent: 3        # codex + hermes COMBINED, not each

# ---------------------------------------------------------------------------
# WIP caps — backpressure so a bulk assignment can't runaway (260-worker scar)
# ---------------------------------------------------------------------------
wip_caps:
  per_machine:
    default: 1          # fail-closed: any machine not listed (home-win, macbook-portable, multi) caps at 1
    dev-primary: 3
    dev-secondary: 3
    cfd-dedicated: 1
    licensed-win-1: 2
    licensed-win-2: 2
  per_provider:
    claude: 4
    gemini: 1
    # codex + hermes governed by budget_pools.codex_pool.max_concurrent
  overflow: queue   # exceeding a cap -> card stays dispatch:ready in queue, never auto-spawned

# ---------------------------------------------------------------------------
# Capability rules — first match wins. Produce (machine, provider) proposal.
# Matchers: domain (domain:<name>), any gh_label, repo. provider omitted ->
# default_provider. A human-set ai:/machine: label on the issue always overrides.
# Domain matchers: `domain` (exact, or fnmatch glob if it carries `* ? [`) and
# `domain_family` (precise: the parent domain OR a `parent-`child subdomain). Use
# `domain_family` for taxonomy families so ONE rule covers a parent AND its
# workspace-hub#2878 splits WITHOUT over-matching unrelated prefixes (route.py
# _family_matches: `hydro` => hydro, hydro-diffraction — NOT hydrocarbon).
# ---------------------------------------------------------------------------
rules:
  # Windows-only engineering tooling (OrcaWave/AQWA/OrcaFlex) -> licensed boxes.
  # domain_family so the #2878 splits (solver-orcaflex, hydro-diffraction, ...)
  # inherit, but hydrocarbon/hydrostatic/solverless do NOT get pinned to Windows.
  # These target licensed-win-1: THE heavy node (64 cores / 255.7 GB) and the
  # owner-designated licensed execution host.
  #
  # Two corrections got us here, both mine, both the same mistake one axis apart:
  #
  #  1. Originally they targeted licensed-win-1 while its capability list was
  #     inherited from a RETIRED machine — 177 issues routed to a host that could
  #     not obtain a licence (deckhand#579).
  #  2. I then repointed them to licensed-win-2 because it held the only dated
  #     licence attestation. Owner, 2026-07-31: "ws014 is not powerful enough."
  #     licensed-win-2 is a WORKSTATION. I had traded a licence failure for a
  #     capacity failure and called it fixed, because I only re-checked the
  #     dimension I had just been burned by.
  #
  # Capability is LICENCE **and** CAPACITY. licensed-win-1 satisfies capacity and
  # is blocked on the licence prerequisite, which is declared in `blocked_on`
  # rather than routed around: silently sending batch work to a lesser host hides
  # the blockage — the work runs badly instead of visibly waiting.
  #
  # Unchanged: policy.yml `licensed_host` stays ace-win-2. That is the queue
  # lane's default owner for UN-ADDRESSED requests — a different role from the
  # execution target, and #579 holds it until OrcFxAPI.Model() succeeds.
  - match: {repo: vamseeachanta/digitalmodel, domain_family: solver}
    assign: {machine: licensed-win-1}
    reason: "AQWA/OrcaWave/OrcaFlex batch needs the heavy licensed node (solver + solver-* splits)"
  - match: {repo: vamseeachanta/digitalmodel, domain_family: hydro}
    assign: {machine: licensed-win-1}
    reason: "RAO/QTF/seakeeping runs are batch-scale — heavy node (hydro + hydro-* splits)"

  # CFD / OpenFOAM -> dedicated CFD node; ace-linux-2 remains shared/dev.
  - match: {gh_label: "domain:cfd"}
    assign: {machine: cfd-dedicated}
    reason: "Dedicated OpenFOAM CFD node gpu-claw beat ace-linux-2 benchmark in https://github.com/vamseeachanta/digitalmodel/issues/1495"

  # `needs:cross-review` is a PHASE marker, NOT a routing target — no rule here.
  #
  # It used to read `{gh_label: needs:cross-review} -> {provider: codex}`, but the
  # label did not exist in any repo, so the rule had never fired. Creating the
  # label (2026-07-30) would have ARMED it, and rule beats lane: in precedence —
  # silently rerouting 21 issues to codex over a human's explicit lane: choice.
  #
  # Two different ideas were conflated:
  #   "this issue IS a cross-review task"        -> an ASSIGNMENT (who does it)
  #   "this work NEEDS a second-provider review" -> a PHASE (what must happen
  #                                                 before it can close)
  # `needs:` is the vocabulary of a requirement. The review workflow consumes the
  # label; the router must not. Enforced by
  # tests/dispatch/test_cross_review_is_a_phase.py, which generalises to the whole
  # `needs:` namespace so the next such label need not rediscover this.

  # Default catch-all — machine only; provider falls through to defaults.provider
  # (claude) so the ai: label stays ABSENT for default work, written only when a
  # rule or human chooses a non-default provider.
  - match: {}
    assign: {machine: dev-primary}
    reason: "default workhorse"

defaults:
  provider: claude
  machine: dev-primary
  # Only open issues are routable; triage/draft and closed are skipped.
  routable_states: [open]
  skip_if_labeled: [wip, blocked, "status:plan-review"]   # don't auto-route in-flight work
