name: Deckhand Destructive Git Event Alarm

'on':
  push:
    branches:
      - '**'
    tags:
      - '**'
  delete:

permissions:
  contents: read
  issues: write

jobs:
  alert:
    name: Open destructive-event issue
    runs-on: ubuntu-latest
    if: github.event_name == 'delete' || (github.event_name == 'push' && github.event.forced == true)
    steps:
      - name: Open alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PUSH_FORCED: ${{ github.event.forced }}
          PUSH_REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DELETE_REF: ${{ github.event.ref }}
          DELETE_REF_TYPE: ${{ github.event.ref_type }}
        run: |
          set -euo pipefail

          timestamp="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          title="⚠ Deckhand: destructive git event detected"

          if [ "$EVENT_NAME" = "delete" ]; then
            event_type="deletion"
            ref="${DELETE_REF_TYPE}:${DELETE_REF}"
            before="n/a"
            after="n/a"
          elif [ "$PUSH_FORCED" = "true" ]; then
            event_type="force-push"
            ref="$PUSH_REF"
            before="$PUSH_BEFORE"
            after="$PUSH_AFTER"
          else
            exit 0
          fi

          body="$(mktemp)"
          {
            echo "Deckhand detected a destructive git event."
            echo
            echo "- Event type: $event_type"
            echo "- Actor: $ACTOR"
            echo "- Ref: $ref"
            echo "- Before SHA: $before"
            echo "- After SHA: $after"
            echo "- Timestamp: $timestamp"
          } > "$body"

          gh issue create --repo "$REPO" --title "$title" --body-file "$body"
