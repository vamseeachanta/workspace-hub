# Script-to-Stage Mapping for Work Queue
# Generated by WRK-5112: Redistribute scripts to stage folders
#
# Classification criteria:
# - stage-specific: script name/purpose maps to exactly one stage
# - shared: used across multiple stages (dispatch, evidence, validation)
# - utility: general-purpose tools (queue management, migration, auditing)

stage_specific:
  stage-01-capture:
    - wait-for-approval.sh

  stage-03-triage:
    - infer-category.py
    - assign-categories.py
    - assign-workstations.py
    - urgency_score.py

  stage-05-user-review-plan-draft:
    - stage5-plan-dispatch.sh
    - bootstrap-stage5-gate.sh
    - log-user-review-browser-open.sh
    - log-user-review-publish.sh

  stage-06-cross-review:
    - check-p1-resolved.sh

  stage-08-claim-activation:
    - claim-item.sh

  stage-09-routing:
    - stage_dispatch.py

  stage-10-work-execution:
    - feature-status.sh
    - feature-close-check.sh
    - feature-auto-close.sh

  stage-12-tdd-eval:
    - check-acs-pass.sh

  stage-15-future-work:
    - scan-future-work.py

  stage-19-close:
    - close-item.sh

  stage-20-archive:
    - archive-item.sh
    - gate_checks_archive.py

shared:
