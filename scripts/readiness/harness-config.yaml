# harness-config.yaml — Single source of truth for harness readiness checks
# Used by: nightly-readiness.sh, compare-harness-state.sh, remediate-harness.sh
# Update skill_count_baseline / command_count_baseline via:
#   bash scripts/readiness/nightly-readiness.sh --update-baseline
schema_version: 1

required_plugins:
  - frontend-design
  - skill-creator
  - code-review
  - pr-review-toolkit
  - feature-dev
  - playground
  - pyright-lsp
  - claude-md-management
  - hookify
  - superpowers

skill_count_baseline: 0        # set on first --update-baseline run; 0 = skip count check
command_count_baseline: 0      # set on first --update-baseline run; 0 = skip count check

tier1_repos:
  - assetutilities
  - digitalmodel
  - worldenergydata
  - assethold

hook_static_max_lines: 200
# Basenames exempt from the hook_static_max_lines cap. These are large,
# intrinsically-complex validation hooks whose logic does not decompose cleanly
# under the 200-line guideline; refactoring them would harm readability, not help.
# Missing/unreadable key → no exemptions (line check stays fully active).
hook_static_line_exempt:
  - check-skill-content.sh   # ~553L: security pattern catalog (one add_pattern triple per threat) — table-driven, expanding the table is the point
  - session-review.sh        # ~361L: end-of-session multi-section review aggregator — sequential sections, not extractable subroutines
  - capture-corrections.sh   # ~201L: 1 line over; correction-capture state machine across several signal sources
hook_blocking_patterns:
  - 'git commit'
  - 'git push'
  - '\bcurl\b'
  - '\bwget\b'
  - 'http://'
  - 'https://'

workstations:
  dev-primary:
    ws_hub_path: /mnt/local-analysis/workspace-hub
    ssh_target: null
    report_path: .claude/state/harness-readiness-dev-primary.yaml
    # #2801 equality baseline (cold-dim conformance — declared, not voted)
    role: high-context-linux-execution
    compute_floor: {cores_min: 16, ram_gib_min: 16}
    required_data_access: [assetutilities, digitalmodel, worldenergydata, assethold]
    # #2849 solvers baseline (cold-dim): a Linux dev box is EXPECTED to lack solvers → absent
    solvers_baseline: {orcaflex: absent, orcawave: absent, aqwa: absent, ansys: absent}
    # #3591 providers baseline (cold-dim, role-aware): full provider stack on the Hermes host
    providers_baseline: {claude: present, codex: present, gemini: present, hermes: present}
    # #3592 memory + scheduler baselines (cold-dim): leader box — repo-sync AND parity-review crons
    hermes_home_baseline: present
    scheduler_baseline: {repo_sync: required, parity_review: required}
  dev-secondary:
    ws_hub_path: /mnt/local-analysis/workspace-hub
    ssh_target: ace-linux-2
    report_path: .claude/state/harness-readiness-dev-secondary.yaml
    role: linux-execution
    compute_floor: {cores_min: 8, ram_gib_min: 8}
    required_data_access: [assetutilities, digitalmodel, worldenergydata, assethold]
    solvers_baseline: {orcaflex: absent, orcawave: absent, aqwa: absent, ansys: absent}
    # #3591 providers baseline: full Linux execution box
    providers_baseline: {claude: present, codex: present, gemini: present, hermes: present}
    # #3592: execution box — repo-sync required; parity-review is leader-only (dev-primary)
    hermes_home_baseline: present
    scheduler_baseline: {repo_sync: required, parity_review: not-required}
  gpu-claw:
    ws_hub_path: /home/undi/ws/workspace-hub
    ssh_target: gpu-claw
    report_path: .claude/state/harness-readiness-gpu-claw.yaml
    role: linux-execution
    # GPU executor (2x RTX 3090, 64 GiB); only digitalmodel required — CFD lane, not full tier-1
    compute_floor: {cores_min: 8, ram_gib_min: 32}
    required_data_access: [digitalmodel]
    solvers_baseline: {orcaflex: absent, orcawave: absent, aqwa: absent, ansys: absent}
    # #3591 providers baseline: THIN host by policy — CFD lane only, no gemini/hermes
    providers_baseline: {claude: present, codex: present, gemini: absent, hermes: absent}
    # #3592: thin host, no hermes home. repo-sync REQUIRED — installed 2026-07-23 via
    # setup-cron.sh (crontab: repository-sync 4h + equivalence-sentinel 6h + weekly
    # equality report; evidence measured has_repo_sync:true, job_count:3, publish
    # 29639aa94). The earlier same-day not-required flip predated that install; its own
    # flip-back-when-installed condition is now met.
    hermes_home_baseline: absent
    scheduler_baseline: {repo_sync: required, parity_review: not-required}
  ace-win-1:
    ws_hub_path: 'D:\workspace-hub'
    ssh_target: null
    linux_reachable: false
    report_path: .claude/state/harness-readiness-ace-win-1.yaml
    notes: "Scout-only (recon + verification); bug fixes OK, NO feature dev (OS-equivalent dev lives on the Linux boxes). Licensed Windows host — primary role: licensed solver runs. Windows/Git Bash; Windows Task Scheduler writes report to shared mount."
    role: licensed-solver
    # ram_gib_min restored (#2816 W4, owner-confirmed 2026-05-31): collect-equality.ps1 now yields a
    # trustworthy ram_total_mib via CIM. Floor = 12 GiB. Evidence: the paired ace-win-2
    # (acma-ws014) measured ram_total_mib 15982 MiB (~16 GB physical; CIM excludes hardware-reserved)
    # on a real `-Stdout` run. 12 GiB gives margin below spec while still flagging a degraded sub-12
    # GB box. A floor of 16 would false-fail (15982 < 16384). ace-win-1 is the same
    # licensed-solver class (assumed 16 GB); confirm/retune at its first -Stdout run.
    compute_floor: {cores_min: 8, ram_gib_min: 12}
    required_data_access: [digitalmodel, assetutilities]
    # #2849 solvers baseline (cold-dim, STRICT): licensed work routes here — only a `licensed`
    # signal satisfies this baseline. An install-only `present` grades BELOW-BASELINE.
    # NOTE (PR #2850, 2026-05-28): `licensed` is the TARGET, but the probe currently emits at
    # most `present` (install/import detection only — no real license probe). Until the
    # Windows-side license probe follow-up lands, these cells grade BELOW-BASELINE by design.
    solvers_baseline: {orcaflex: licensed, orcawave: licensed, aqwa: licensed, ansys: licensed}
    # #3591 providers baseline: THIN Windows host by policy (keep-Windows-host-thin) — no gemini/hermes
    providers_baseline: {claude: present, codex: present, gemini: absent, hermes: absent}
    # #3592: hermes_home aligned with providers_baseline (thin → absent). Evidence currently
    # reads present — a probe/policy contradiction the BELOW-BASELINE cell surfaces for
    # on-box cleanup (#2815 companion). Task Scheduler repo-sync required.
    hermes_home_baseline: absent
    scheduler_baseline: {repo_sync: required, parity_review: not-required}
  ace-win-2:
    ws_hub_path: 'D:\workspace-hub'
    ssh_target: null
    linux_reachable: false
    report_path: .claude/state/harness-readiness-ace-win-2.yaml
    notes: "Scout-only (recon + verification); bug fixes OK, NO feature dev (OS-equivalent dev lives on the Linux boxes). Licensed Windows host — primary role: document ingestion, email, marketing & admin. Windows/Git Bash; Windows Task Scheduler writes report to shared mount."
    role: licensed-solver
    # ram_gib_min restored (#2816 W4, owner-confirmed 2026-05-31): measured ram_total_mib on this box
    # (acma-ws014) = 15982 MiB (~16 GB physical) via collect-equality.ps1 -Stdout on 2026-05-31.
    # Floor = 12 GiB gives margin below the real spec while still catching a degraded box. A floor of
    # 16 would false-fail (15982 < 16384). See ace-win-1 note above for the class rationale.
    compute_floor: {cores_min: 8, ram_gib_min: 12}
    required_data_access: [digitalmodel, assetutilities]
    # #2849 solvers baseline (cold-dim, STRICT): licensed-solver workstation.
    # NOTE (PR #2850, 2026-05-28): grades BELOW-BASELINE until the Windows license-probe
    # follow-up emits a real `licensed` signal (probe only detects install/import → `present`).
    solvers_baseline: {orcaflex: licensed, orcawave: licensed, aqwa: licensed, ansys: licensed}
    # #3591 providers baseline: full stack observed + intended on this box (doc/email/marketing lane)
    providers_baseline: {claude: present, codex: present, gemini: present, hermes: present}
    # #3592: hermes_home aligned with providers_baseline (full stack → present). Evidence
    # currently reads absent — the inverse contradiction of ace-win-1; the red cell drives
    # the on-box probe/install reconciliation. Task Scheduler repo-sync required.
    hermes_home_baseline: present
    scheduler_baseline: {repo_sync: required, parity_review: not-required}
  home-win:
    ws_hub_path: 'D:\workspace-hub'
    ssh_target: null
    linux_reachable: false
    status: unreachable
    report_path: .claude/state/harness-readiness-home-win.yaml
    notes: "#2801: roster member per #2795; UNREACHABLE/deferred until brought online"
  macbook-portable:
    status: unreachable
    hostname: Vamsees-MacBook-Air
    hostname_aliases: [Vamsees-MacBook-Air.local]
    ws_hub_path: /Users/krishna/workspace-hub
    ssh_target: null
    linux_reachable: false
    report_path: .claude/state/harness-readiness-macbook-portable.yaml
    notes: "macOS portable — no SSH from Linux; no cron; report generated locally"

hermes:
  external_skills_dir_suffix: .claude/skills   # appended to ws_hub_path per workstation
  patch_file: config/agents/hermes/patches/exclude-archive-skill-dirs.patch
  config_template: config/agents/hermes/config.yaml.template
  health_checks:
    - binary_exists        # hermes --version
    - venv_import          # hermes_cli.main importable
    - patch_applied        # EXCLUDED_SKILL_DIRS contains _archive
    - external_skills_dir  # skills.external_dirs path exists and has SKILL.md files
    - config_managed_keys  # managed keys match template values

# #3249 skill-currency line item: families that LEGITIMATELY differ between a provider's skill
# surface and canonical `.claude/skills` are NOT drift. Listed as name-prefixes; a family whose
# diff matches any prefix grades EXPECTED-DIVERGENCE (purple), only UNEXPECTED diffs grade
# SKILLS-DRIFTED (red). When a provider intentionally adds/drops a family, update this list — that
# review prompt is the point. Baseline captured 2026-06-26 from the live .agents/skills diff.
expected_skill_divergence:
  gemini:
    - source-command-       # Gemini-CLI command-sourced skill families (gsd-*, compound, learn)
    - workspace_hub_learned # Gemini-side learned-skill staging dir
    - digitalmodel          # domain skill family not propagated to the Gemini surface
    - memory                # memory-systems family not on the Gemini surface

prerequisites:
  - jq
  - git
  - uv
  - claude
