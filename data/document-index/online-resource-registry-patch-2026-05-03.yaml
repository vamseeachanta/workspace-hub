# Online Resource Registry — Proposed Patch (W2-D, #2593)
#
# Status: PROPOSED — NOT applied to data/document-index/online-resource-registry.yaml.
# This sidecar enumerates ≤20 entries the implementation issue that follows W2-D will consume.
#
# Audit: docs/audits/2026-05-03-online-resource-registry-refresh.md
# Plan:  docs/plans/2026-05-02-issue-2593-llm-wiki-W2D-online-resource-registry-refresh.md
# Snapshot date: 2026-05-03
#
# Schema notes (per W2-D plan + r1 review fixes):
# - REQUIRED fields per patch entry: id, url, name, type, domain, last_checked, revision
# - OPTIONAL fields: code_id (links to standards-transfer-ledger.yaml when applicable),
#                    superseded_or_legacy (true when revision parses to >5 years before snapshot),
#                    notes, source_catalog, relevance_score, local_backup_path, download_status
# - DO NOT introduce a `last_verified` field (W2-D MAJOR-1 fix: reuse existing `last_checked`).
# - DO NOT introduce `superseded_by` here (W2-D risk: forward-prep field with no consumer; defer).
# - Permissive `revision` grammar: date-like (YYYY-MM, YYYY-MM-DD), `Nth Edition`, `(R\d{4})`, or `:YYYY`.
#
# patch_action semantics (NEW field; sidecar-only, not propagated to live registry):
# - `add`     — new entry to be appended to the registry on patch application
# - `update`  — existing registry entry to be modified (id must match a current entry)
#
# Patch entries are grouped: (1) W1 cross-reference fixes, (2) high-value 2025-2026 revisions,
# (3) calc-citation-contract anchors. All ≤20 entries combined.

