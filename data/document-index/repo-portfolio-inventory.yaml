# Repo Portfolio Inventory — source of truth for docs/REPO_MISSION_PORTFOLIO.md
#
# Generated/maintained per docs/plans/2026-05-02-issue-2533-mission-portfolio.md (rev-3).
# Discovery date: 2026-05-13.
# Markdown table is REGENERATED from this YAML by:
#   scripts/tests/check_repo_mission_portfolio.sh --generate
# DO NOT hand-edit docs/REPO_MISSION_PORTFOLIO.md — edit this file and re-run --generate.
#
# Schema (per acceptance criterion C3):
#   repo:                     str  — repo directory name
#   tier:                     str  — tier-1 | tier-2 | tier-3 | inventory-drift
#   mission:                  str  — 1-3 sentence mission paragraph
#   source_path:              str  — relative path of mission source, OR "none",
#                                    OR prefixed with "legacy_source:" for .agent-os/product/mission.md fallback
#   routing_belongs_here:     str  — "work belongs here when..."
#   routing_route_elsewhere:  str  — "work should route elsewhere when..."
#   overlap_notes:            str  — known mission overlaps (must be symmetric per C7)
#   inventory_status:         str  — present-locally | not-present-locally | added-post-plan
#   notes:                    str  — memory-derived facts, provenance caveats, retirement plans

schema_version: 1
discovery_date: 2026-05-13
plan_reference: docs/plans/2026-05-02-issue-2533-mission-portfolio.md
issue_reference: "https://github.com/vamseeachanta/workspace-hub/issues/2533"

repos:

