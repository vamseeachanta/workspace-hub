  - repo: workspace-hub
    tier: tier-1
    mission: >-
      Engineering workspace and portfolio control plane. Houses the GSD framework,
      AI harness, durable cross-repo standards, document-intelligence registries,
      and shared utilities used to perform governance and harness work across all
      Tier-1 repositories.
    source_path: AGENTS.md
    routing_belongs_here: >-
      Work belongs here when it is portfolio-wide governance, harness/orchestration
      infrastructure, durable cross-repo standards, document-intelligence registries,
      or planning/review artifacts that coordinate work across multiple repos.
    routing_route_elsewhere: >-
      Route elsewhere when work is repo-specific execution that has a single owning
      Tier-1 or Tier-2 repo — code/calculations to digitalmodel, shared utilities to
      assetutilities, site delivery to aceengineer-website, per-client work to its
      client repo. Per-repo execution docs live in the owning repo, not here.
    overlap_notes: >-
      Overlaps with per-repo execution docs in every owning Tier-1 repo
      (digitalmodel, assetutilities, aceengineer-website) — workspace-hub owns
      portfolio governance/harness/standards; owning repos own their own
      single-repo execution surfaces. Cross-repo coordination → workspace-hub;
      single-repo-scope → owning repo.
    inventory_status: present-locally
    notes: >-
      Portfolio control plane per #2460 contract. Hosts the four-repo Tier-1
      routing index at docs/ROUTING_INDEX.md.

  - repo: digitalmodel
    tier: tier-1
    mission: >-
      Engineering digital twin and numerical-model library — asset integrity,
      cathodic protection, GIS, hydrodynamics (OrcaWave, OrcaFlex, AQWA), and
      field-development calculation pipelines. Reusable engineering calculation
      code and methodology live here.
    source_path: digitalmodel/AGENTS.md
    routing_belongs_here: >-
      Work belongs here when it is reusable engineering calculation code, tests,
      methodology, OrcaWave/OrcaFlex/AQWA solver workflows, hydrodynamics,
      cathodic protection, asset integrity, GIS, or field-development modules.
    routing_route_elsewhere: >-
      Route elsewhere when the work is one-off client-project data with non-reusable
      inputs (→ matching client vertical like acma-projects, seanation, saipem,
      frontierdeepwater, doris) or shared cross-repo utilities (→ assetutilities).
    overlap_notes: >-
      Overlaps with workspace-hub on portfolio-vs-execution boundary
      (workspace-hub owns governance/harness; digitalmodel owns engineering
      execution). Overlaps with assetutilities on reusable-utility boundary
      (digitalmodel depends on assetutilities; shared utility code belongs in
      assetutilities, not digitalmodel). Overlaps with client/project verticals
      (acma-projects, seanation, saipem, frontierdeepwater, doris): reusable
      engineering code/tests/methodology → digitalmodel; one-off client analysis
      with non-reusable inputs → matching client vertical. Per #2462
      (PR digitalmodel#539) digitalmodel canonical routing surfaces are being
      hardened.
    inventory_status: present-locally
    notes: >-
      Depends on assetutilities. Per #2462 the canonical operator map is being
      consolidated at digitalmodel/docs/maps/digitalmodel-orcawave-orcaflex-operator-map.md.

