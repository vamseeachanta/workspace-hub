# Freshness Cadences and Staleness Signals
# Issue: #2105 — Define expected update frequencies per asset type
# Created: 2026-04-16
# Purpose: Support weekly review (#2089) with freshness expectations

schema_version: "1.0.0"

# Cadence definitions: how often each asset type should be updated
# staleness_days: after this many days without update, flag as stale
# check_method: how to detect last-updated timestamp
cadences:
  # L2 — Registries
  - asset_type: "master-index"
    path: "data/document-index/index.jsonl"
    layer: L2
    expected_cadence: "weekly"
    staleness_days: 14
    check_method: "file_mtime"
    notes: "Regenerated during document pipeline runs"

  - asset_type: "standards-transfer-ledger"
    path: "data/document-index/standards-transfer-ledger.yaml"
    layer: L2
    expected_cadence: "monthly"
    staleness_days: 45
    check_method: "file_mtime"
    notes: "Updated when new standards are indexed or promoted"

  - asset_type: "online-resource-registry"
    path: "data/document-index/online-resource-registry.yaml"
    layer: L2
    expected_cadence: "monthly"
    staleness_days: 60
    check_method: "file_mtime"
    notes: "URL freshness checked by registry-freshness-check.py"

  - asset_type: "conference-index"
    path: "data/document-index/conference-index.jsonl"
    layer: L2
    expected_cadence: "quarterly"
    staleness_days: 120
    check_method: "file_mtime"
    notes: "Updated when new conference collections are indexed"

  # L3 — LLM Wikis
  - asset_type: "wiki-engineering"
    path: "knowledge/wikis/engineering/wiki/"
    layer: L3
    expected_cadence: "nightly"
    staleness_days: 7
    check_method: "git_log_dir"
    notes: "Fed by wiki-ingest-cron.sh nightly"

  - asset_type: "wiki-marine-engineering"
    path: "knowledge/wikis/marine-engineering/wiki/"
    layer: L3
    expected_cadence: "weekly"
    staleness_days: 14
    check_method: "git_log_dir"
    notes: "Grows via batch-ingest and standards promotions"

  - asset_type: "wiki-cross-links"
    path: "knowledge/wikis/cross-links.md"
    layer: L3
    expected_cadence: "weekly"
    staleness_days: 14
    check_method: "file_mtime"
    notes: "Regenerated by wiki-cross-links.py"

  # L4 — Entry Points
  - asset_type: "accessibility-registry"
    path: "data/document-index/intelligence-accessibility-registry.yaml"
    layer: L4
    expected_cadence: "monthly"
    staleness_days: 45
    check_method: "file_mtime"
    notes: "Updated when new assets are added to the ecosystem"

  - asset_type: "doc-intelligence-index"
    path: "docs/document-intelligence/README.md"
    layer: L4
    expected_cadence: "monthly"
    staleness_days: 60
    check_method: "file_mtime"
    notes: "Navigation index for the intelligence architecture"

# Staleness signals — what to look for during weekly review
signals:
  - name: "nightly-ingest-zero-files"
    description: "Nightly ingest ran but ingested 0 files for >3 consecutive days"
    severity: medium
    detection: "grep 'ingested: 0' logs/wiki-ingest/ingest-*.log | tail -3"

  - name: "cross-links-stale"
    description: "Cross-links not regenerated in >14 days"
    severity: low
    detection: "stat -c %Y knowledge/wikis/cross-links.md vs current date"

  - name: "registry-dead-links"
    description: "Freshness checker found dead URLs in registry"
    severity: medium
    detection: "uv run scripts/knowledge/registry-freshness-check.py --json"

  - name: "conformance-regression"
    description: "Previously passing conformance checks now failing"
    severity: high
    detection: "uv run scripts/knowledge/pyramid-conformance-check.py --json"
