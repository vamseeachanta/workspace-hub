tool_practices:
  - tool: OpenROAD
    practice: use an integrated open-source RTL-to-GDS physical-design application for synthesis/place/route/report literacy
    source_url: https://openroad.readthedocs.io/
    accessed: 2026-04-27
    supports: OpenROAD is the primary open-source physical-design engine for the #2509 learner demo.
  - tool: OpenROAD-flow-scripts
    practice: run reproducible reference flows and preserve metrics/logs as evidence
    source_url: https://openroad-flow-scripts.readthedocs.io/
    accessed: 2026-04-27
    supports: Flow scripts provide demo structure and artifact expectations for RTL-to-GDS practice.
  - tool: OpenLane
    practice: use a packaged open-source RTL-to-GDS flow for educational designs and CI-oriented reproducibility
    source_url: https://openlane.readthedocs.io/
    accessed: 2026-04-27
    supports: OpenLane anchors a practical flow alternative for #2509.
  - tool: KLayout
    practice: inspect GDS/OASIS layouts and write scripted checks/macros for layout QA
    source_url: https://www.klayout.de/doc.html
    accessed: 2026-04-27
    supports: KLayout is the visual/scripted inspection bridge for #2510 outputs.
  - tool: GDSFactory
    practice: build Python-parametric layout cells and export layout artifacts for repeatable demos
    source_url: https://gdsfactory.github.io/gdsfactory/
    accessed: 2026-04-27
    supports: GDSFactory supports Python layout automation and reusable component generation.
  - tool: SkyWater SKY130 PDK
    practice: constrain open educational EDA examples to documented open PDK rules and examples
    source_url: https://github.com/google/skywater-pdk
    accessed: 2026-04-27
    supports: SKY130 is an open PDK anchor for educational layout/flow work.
  - tool: GF180MCU Open PDK
    practice: use the open GF180 documentation as a second PDK reference for portability awareness
    source_url: https://gf180mcu-pdk.readthedocs.io/
    accessed: 2026-04-27
    supports: GF180MCU provides another open PDK reference without proprietary foundry access.
  - tool: CalculiX
    practice: run structural/thermal finite-element benchmarks where open solver capability is sufficient
    source_path: docs/research/open-source-fea-survey.md
    accessed: 2026-04-27
    supports: Existing local FEA survey identifies CalculiX as a reusable open solver candidate.
  - tool: FEniCSx/scikit-fem
    practice: create transparent Python FEM prototypes and verification notebooks before heavier solver coupling
    source_path: docs/research/scikit-fem-eval.md
    accessed: 2026-04-27
    supports: Existing local evaluation supports Python-native FEM experimentation.
