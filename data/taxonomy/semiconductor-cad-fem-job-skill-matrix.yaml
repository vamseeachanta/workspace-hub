role_families:
  - id: ic-packaging-simulation
    name: IC Packaging Simulation Engineer
    domains: [package-fem-thermal-mechanical]
    target_titles: [IC Packaging Simulation Engineer, Package Simulation Engineer, Electronics Packaging FEA Engineer]
    required_skills: [thermal resistance modeling, thermo-mechanical stress, CTE mismatch, solder/package fatigue screening, FEA model verification, Python post-processing]
    tools: [CalculiX, FEniCSx, Elmer, scikit-fem, ParaView, Python]
    local_evidence: [docs/research/open-source-fea-survey.md, docs/research/scikit-fem-eval.md, docs/resources/structural-resources.md]
    source_limitations: JEDEC and IPC sources are restricted or not locally ingested; use only as vocabulary/follow-up targets until source text is available.
    portfolio_artifacts: ["#2511 package thermal/thermo-mechanical FEM benchmark with traceable assumptions"]
    child_issues_or_followups: ["#2511"]
  - id: semiconductor-mechanical-thermal-engineer
    name: Semiconductor Mechanical/Thermal Engineer
    domains: [package-fem-thermal-mechanical]
    target_titles: [Mechanical Engineer with Semiconductor Experience, Thermal Engineer, Thermal Analyst]
    required_skills: [heat-transfer boundary conditions, package material stacks, reliability-oriented stress interpretation, design-of-experiments, Python reporting]
    tools: [FEniCSx, Elmer, CalculiX, Plotly, Pandas]
    local_evidence: [docs/strategy/gtm/job-market-scan/raw-results/2026-04-20.json]
    source_limitations: Local job data contains direct semiconductor and many thermal-adjacent roles; classify relevance explicitly.
    portfolio_artifacts: [thermal model comparison report, package warpage/stress sensitivity dashboard]
    child_issues_or_followups: ["#2511", "follow-up: electronics-cooling source ingestion"]
  - id: advanced-packaging-engineer
    name: Advanced Packaging Engineer
    domains: [package-fem-thermal-mechanical, layout-cad-automation]
    target_titles: [Principal Engineer Advanced Packaging, Packaging Engineer Microelectronics, Advanced Packaging Engineer]
    required_skills: [heterogeneous integration vocabulary, chiplet/package interface awareness, substrate/package geometry abstraction, thermal-mechanical design tradeoffs]
    tools: [GDSFactory, KLayout, Python, CalculiX]
    local_evidence: [docs/strategy/gtm/job-market-scan/raw-results/2026-04-13.json]
    source_limitations: Job scan has sparse semiconductor-specific hits; use external open-tool docs for practice claims.
    portfolio_artifacts: [package geometry generator linked to a thermal benchmark]
    child_issues_or_followups: ["#2510", "#2511"]
  - id: asic-eda-technical-program-role
    name: ASIC/EDA Technical Program Role
    domains: [eda-flow]
    target_titles: [Sr Technical Program Manager ASIC, EDA Flow Program Manager, Silicon CAD Program Manager]
    required_skills: [RTL-to-GDS flow vocabulary, CI/reproducibility framing, milestone/risk tracking, PDK/open-source EDA boundaries, cross-functional review]
    tools: [OpenROAD, OpenLane, OpenROAD-flow-scripts, Sky130, GF180MCU, GitHub Actions]
    local_evidence: [docs/strategy/gtm/job-market-scan/raw-results/2026-04-02.json]
    source_limitations: This is a bridge role; portfolio should demonstrate flow literacy rather than claim chip-tapeout ownership.
    portfolio_artifacts: ["#2509 reproducible RTL-to-GDS demo report with logs and generated artifacts"]
    child_issues_or_followups: ["#2509"]
  - id: physical-design-eda-flow-learner-track
    name: Physical-design / EDA-flow Learner Track
    domains: [eda-flow]
    target_titles: [Physical Design Engineer Learner, CAD Flow Engineer, OpenROAD Flow Contributor]
    required_skills: [synthesis, floorplanning, placement, CTS, routing, DRC/LVS vocabulary, PDK constraints, report interpretation]
    tools: [OpenROAD, OpenLane, OpenROAD-flow-scripts, Yosys, Magic, KLayout, Sky130, GF180MCU]
    local_evidence: [docs/roadmaps/chip-design-cad-fem-career-roadmap.md]
    source_limitations: Keep work to open educational designs and open PDKs unless a foundry agreement exists.
    portfolio_artifacts: [tiny RTL-to-GDS runbook, timing/area/power report interpretation note]
    child_issues_or_followups: ["#2509"]
  - id: layout-cad-automation-track
    name: Layout/CAD Automation Track
    domains: [layout-cad-automation]
    target_titles: [Python CAD Automation Engineer, Layout Automation Engineer, EDA/CAD Tooling Engineer]
    required_skills: [parametric geometry, GDS/OASIS layout concepts, design-rule-aware scripting, KLayout inspection, reusable Python APIs]
    tools: [GDSFactory, KLayout, Python, Shapely, pytest]
    local_evidence: [docs/roadmaps/chip-design-cad-fem-career-roadmap.md]
    source_limitations: Generated geometries should be demo/educational and must not imply foundry signoff.
    portfolio_artifacts: ["#2510 Python layout/CAD automation demo for chip/package geometries"]
    child_issues_or_followups: ["#2510"]
