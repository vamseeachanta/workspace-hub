name: legal-rule-authority

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fork-boundary:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    name: strict-scan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require owner-mediated fork promotion
        run: |
          echo 'owner review required' >&2
          exit 1

  strict-scan:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: strict-scan
    uses: vamseeachanta/workspace-hub/.github/workflows/legal-rule-authority-reusable.yml@bdd50a3155a7b4e40c539f92b3d18e2b1e098cf7
    with:
      event_name: ${{ github.event_name }}
      repository: ${{ github.repository }}
      head_repository: ${{ github.event.pull_request.head.repo.full_name }}
      base_ref: refs/heads/main
      head_sha: ${{ github.event.pull_request.head.sha }}
