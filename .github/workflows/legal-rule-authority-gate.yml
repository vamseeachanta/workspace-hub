name: Legal Rule Authority

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fork-denied:
    name: strict-scan
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "owner review required" && exit 1

  strict-scan:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: vamseeachanta/workspace-hub/.github/workflows/legal-rule-authority-reusable.yml@cb9fb83863e66a5451be63c44659c27840dd5d35
