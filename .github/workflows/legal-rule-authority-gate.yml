name: Legal Rule Authority

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  strict-scan:
    uses: vamseeachanta/workspace-hub/.github/workflows/legal-rule-authority-reusable.yml@0c2f21fd37e56327604e2197569b06c2dafaf22e
    with:
      head_oid: ${{ github.event.pull_request.head.sha }}
      is_fork: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      tool_sha: 0c2f21fd37e56327604e2197569b06c2dafaf22e
    secrets:
      LEGAL_SCAN_AUTH_CURRENT: ${{ secrets.LEGAL_SCAN_AUTH_CURRENT }}
