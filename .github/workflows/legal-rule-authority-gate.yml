name: Legal Rule Authority

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fork-denied:
    name: strict-scan
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "owner review required" && exit 1

  # Runs the legal sanity scan directly. The previous implementation delegated to
  # legal-rule-authority-reusable.yml, which required secrets.LEGAL_SCAN_AUTH_CURRENT
  # — a secret that was never provisioned in this repo. `test -n "$AUTH_ENVELOPE"`
  # therefore exited 1 on EVERY same-repo PR, so the gate had never once run a real
  # check; it only forced owner overrides to land anything (#3729, #3730, #3735,
  # #3742, #3745). Owner directive 2026-08-01: there is no auth-envelope process —
  # run the scan the usual way. Client-name/PII coverage remains in
  # legal-client-pii-gate.yml, which is green and independent of this job.
  strict-scan:
    name: strict-scan
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify required ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          rg --version
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Legal scanner regression tests
        run: |
          uv run --no-project --with pytest python -B -m pytest tests/legal -q --junitxml="$RUNNER_TEMP/legal-tests.xml"
          uv run --no-project python - "$RUNNER_TEMP/legal-tests.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().findall(".//testcase")
          if not cases or any(case.find("skipped") is not None for case in cases):
              raise SystemExit("Legal regressions must execute without skipped cases")
          if not any("test_ripgrep_contract.sh" in case.get("name", "") for case in cases):
              raise SystemExit("Required ripgrep contract regression was not collected")
          PY
      - name: Legal sanity scan
        run: bash scripts/legal/legal-sanity-scan.sh
