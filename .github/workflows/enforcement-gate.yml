name: Enforcement Gate

# PR-level enforcement of review gate and plan approval.
# Mirrors local pre-push/pre-commit gates in CI so reviewers see compliance status.
# Issue: #2028 | Related: #1839 (governance), #2047 (strict mode)

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  scheduler-mutation-surfaces:
    name: Scheduler Mutation Surface Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Validate scheduler mutation registry
        run: uv run python scripts/enforcement/check-scheduler-mutation-surfaces.py
      - name: Validate exact cron identity inventory
        run: uv run python scripts/cron/build-cron-identity-inventory.py --check
      - name: Verify scheduler mutation audit report
        run: uv run python scripts/enforcement/check-scheduler-mutation-surfaces.py --check-html docs/reports/2026-07-11-issue-3470-scheduler-mutation-safety.html
      # The catalog SCHEMA validator ran in neither CI nor pre-commit until 2026-08-01.
      # It enforces that every `machines:` value exists in config/workstations/registry.yaml,
      # that `roles:`/`requires:` resolve, that cron expressions parse, and that ids are
      # unique — none of which the three checks above look at. They validate the mutation
      # REGISTRY and the identity digest, not the task definitions themselves. Wiring it in
      # is non-breaking: it reports "OK: 66 tasks validated" on main today.
      - name: Validate scheduled-task catalog schema
        run: uv run python scripts/cron/validate-schedule.py

  stage-prompt-drift:
    name: Stage Prompt Drift Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # PYTHONPATH=src is REQUIRED for `from workspace_hub...` imports because:
      #   1. src/workspace_hub/ has NO __init__.py — it's an intentional PEP 420
      #      implicit namespace package (see commit 2694b2865).
      #   2. pyproject.toml [tool.setuptools.packages.find] include = ["src*"]
      #      installs the literal `src` package, NOT `workspace_hub`.
      # The smoke step below catches a regression of either assumption with a
      # precise error before the deep import traceback fires. Issue #2532.
      - name: Smoke — workspace_hub importable (PEP 420 + PYTHONPATH=src)
        env:
          PYTHONPATH: src
        run: |
          uv sync --frozen --group dev
          uv run python -m pytest tests/ci_smoke/test_workspace_hub_importable.py -v --tb=short

      - name: Check newly introduced stage prompt drift
        env:
          PYTHONPATH: src
        run: |
          echo "## Stage Prompt Drift Guard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          uv run python scripts/analysis/stage_prompt_drift_check.py \
            --base-ref origin/main \
            --head-ref HEAD \
            --output-json /tmp/stage-prompt-drift.json \
            --output-md /tmp/stage-prompt-drift.md \
            --fail-on-issues

      - name: Publish drift summary
        if: always()
        run: |
          if [[ -f /tmp/stage-prompt-drift.md ]]; then
            cat /tmp/stage-prompt-drift.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No stage prompt drift report produced." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check brand token drift (#3402)
        run: |
          echo "## Brand-Token Drift Guard (#3402)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run python scripts/enforcement/check-brand-token-drift.py | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  review-evidence:
    name: Review Evidence Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for commit range analysis

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check review evidence for PR commits
        env:
          REVIEW_GATE_STRICT: "1"
        run: |
          echo "## Review Evidence Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          MERGE_BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [[ -z "$MERGE_BASE" ]]; then
            echo "Could not determine merge base — checking last 10 commits"
            MERGE_BASE=""
          fi

          # Use the existing review gate script logic
          chmod +x scripts/enforcement/require-review-on-push.sh

          # The review gate expects LOCAL_OID and REMOTE_OID
          if scripts/enforcement/require-review-on-push.sh HEAD "$MERGE_BASE" 2>&1; then
            echo "**Result:** PASS — review evidence found" >> $GITHUB_STEP_SUMMARY
          else
            EXIT_CODE=$?
            echo "**Result:** FAIL — no review evidence for feature/fix commits" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### How to fix" >> $GITHUB_STEP_SUMMARY
            echo "Run an adversarial review before pushing:" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "scripts/review/cross-review.sh <file_or_diff> all --type implementation" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Or bypass locally with: \`SKIP_REVIEW_GATE=1 git push\`" >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

  plan-approval:
    name: Plan Approval Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check plan approval for implementation commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PLAN_APPROVAL_GATE_ENABLED: ${{ vars.PLAN_APPROVAL_GATE_ENABLED }}
          PLAN_APPROVAL_ADMIN_PREREQS_CONFIRMED: ${{ vars.PLAN_APPROVAL_ADMIN_PREREQS_CONFIRMED }}
          PLAN_APPROVAL_OWNERS: ${{ vars.PLAN_APPROVAL_OWNERS }}
        run: |
          echo "## Plan Approval Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          set +e
          if command -v uv >/dev/null 2>&1; then
            uv run python scripts/workflow/plan_approval_gate_check.py
          else
            python3 scripts/workflow/plan_approval_gate_check.py
          fi
          PLAN_APPROVAL_LABEL_GATE_RC=$?
          set -e

          # PLAN_APPROVAL_GATE_ENABLED=1 is intentionally blocking. Keep it unset
          # until this check is required and the protected-label ruleset is live.
          chmod +x scripts/enforcement/require-plan-approval.sh

          if scripts/enforcement/require-plan-approval.sh --strict 2>&1; then
            echo "**Result:** PASS — plan approval evidence found or no implementation changes" >> $GITHUB_STEP_SUMMARY
          else
            EXIT_CODE=$?
            echo "**Result:** FAIL — implementation changes without plan approval" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### How to fix" >> $GITHUB_STEP_SUMMARY
            echo "1. Create a plan: \`/gsd:plan\`" >> $GITHUB_STEP_SUMMARY
            echo "2. Get review: \`/gsd:review --phase N\`" >> $GITHUB_STEP_SUMMARY
            echo "3. Approval creates marker in \`.planning/plan-approved/\`" >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

          if [[ "$PLAN_APPROVAL_LABEL_GATE_RC" -ne 0 ]]; then
            echo "**Result:** FAIL — label-authority plan approval gate failed" >> $GITHUB_STEP_SUMMARY
            exit "$PLAN_APPROVAL_LABEL_GATE_RC"
          fi

  marker-label-parity:
    name: Marker-Label Parity Check
    # Reverse-direction plan-approval gate: if a PR adds/modifies any
    # .planning/plan-approved/<n>.md marker, require the corresponding GH
    # issue to also carry status:plan-approved set by a non-bot account.
    # Companion to plan-approval (forward direction). Filed for the failure
    # mode observed in #2703 (agent rationalized dispatch as approval and
    # wrote the marker file directly). See also #2701 (forward-direction
    # audit: 17 labels without markers).
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate marker files added in this PR have user-set labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## Marker-Label Parity Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          chmod +x scripts/enforcement/check-marker-label-parity.sh

          if scripts/enforcement/check-marker-label-parity.sh \
              --strict \
              --base-ref origin/${{ github.base_ref }} \
              --head-ref HEAD 2>&1 | tee /tmp/marker-parity.log; then
            echo "**Result:** PASS — no marker added without user-set label" >> $GITHUB_STEP_SUMMARY
          else
            EXIT_CODE=$?
            echo "**Result:** FAIL — marker file added without backing label" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/marker-parity.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

  model-id-sourcing:
    name: Model-ID Sourcing Guard
    # Ratchet guard (#3060, epic #3058): flags NEW hardcoded model IDs outside
    # config/agents/model-registry.yaml vs the grandfathered baseline. ADVISORY
    # first (does not fail the build) per the #3060 plan; promote to --enforce
    # once trusted by flipping the run line below.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for newly hardcoded model IDs (advisory)
        run: |
          set -o pipefail
          echo "## Model-ID Sourcing Guard (advisory)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          chmod +x scripts/enforcement/check-model-id-sourcing.sh
          scripts/enforcement/check-model-id-sourcing.sh 2>&1 | tee /tmp/model-id.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/model-id.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  skill-index-coherence:
    name: Skill-Index Coherence
    # #3208 (epic #3058): binds the curated skill graph and the generated full
    # index. BLOCKING checks: (a) curated skill basename exists in the tree;
    # (c) the full index is freshly regenerable (no diff). (b) authored-but-
    # backfilled is advisory (stderr only). Runs red in PR checks on drift;
    # becomes merge-blocking once added to the protected-branch ruleset.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check skill-index coherence
        run: |
          set -o pipefail
          echo "## Skill-Index Coherence (#3208)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          uv run python scripts/enforcement/check-skill-index-coherence.py 2>&1 | tee /tmp/skidx.log
          rc=${PIPESTATUS[0]}
          cat /tmp/skidx.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $rc

  compliance-dashboard:
    name: Compliance Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run compliance dashboard
        continue-on-error: true  # advisory — does not block PRs
        run: |
          echo "## Compliance Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          chmod +x scripts/enforcement/compliance-dashboard.sh

          # Run in 168h window (1 week) for broader context
          COMPLIANCE_WINDOW_HOURS=168 scripts/enforcement/compliance-dashboard.sh 2>&1 | tee /tmp/compliance-report.txt || true

          # Extract key metrics for summary
          RATE=$(grep -oP 'Compliance rate:\s+\K\d+' /tmp/compliance-report.txt 2>/dev/null || echo "N/A")
          VERDICT=$(grep -oP 'Verdict:\s+\K\w+' /tmp/compliance-report.txt 2>/dev/null || echo "N/A")

          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Compliance Rate | ${RATE}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Verdict | ${VERDICT} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Full Report</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/compliance-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
