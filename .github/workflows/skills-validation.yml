name: Skills Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.claude/skills/**/SKILL.md'
      - 'scripts/skills/*.sh'
      - 'scripts/skills/*.py'
      - 'tests/enforcement/test_validate_skills_frontmatter.py'
      - '.github/workflows/skills-validation.yml'
  push:
    branches:
      - main
    paths:
      - '.claude/skills/**/SKILL.md'
      - 'scripts/skills/*.sh'
      - 'scripts/skills/*.py'
      - 'tests/enforcement/test_validate_skills_frontmatter.py'
      - '.github/workflows/skills-validation.yml'
  workflow_dispatch:

jobs:
  validate-skills:
    name: Validate SKILL.md frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Run skill validator
        run: |
          UV_CACHE_DIR=.claude/state/uv-cache bash scripts/skills/validate-skills.sh

      - name: Run validator regression tests
        run: |
          UV_CACHE_DIR=.claude/state/uv-cache uv run --no-project --with pytest --with pyyaml pytest tests/enforcement/test_validate_skills_frontmatter.py -v

      - name: Generate skills summary
        if: always()
        run: |
          echo "## Skills Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(find .claude/skills -name 'SKILL.md' | wc -l)
          echo "**Total SKILL.md files:** ${TOTAL}" >> $GITHUB_STEP_SUMMARY
