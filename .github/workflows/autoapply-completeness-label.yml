name: autoapply-completeness-label

# #2798 (#3) — keep the completeness gate comprehensive for NEW work.
# Apply `gate:completeness` to new issues and legacy issues entering active work.
# Completeness remains independent of separate plan approval (#3943).
# Existing bulk-labeled backlog is not enrolled without a new work transition.
#
# Safe by construction: only ADDS a label (idempotent — re-adding is a no-op); never
# closes/reopens/removes. The completeness gate itself (completeness-gate.yml) is what
# enforces at close.

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  add-gate-label:
    runs-on: ubuntu-latest
    # New issues and explicit work-state transitions enter the rollout.
    if: >-
      github.event.action == 'opened' ||
      github.event.label.name == 'status:plan-review' ||
      github.event.label.name == 'status:in-progress' ||
      github.event.label.name == 'status:plan-approved'
    steps:
      - name: Add gate:completeness (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # self-heal: ensure the label exists (no-op if present)
          gh label create "gate:completeness" --repo "${{ github.repository }}" \
            --color 5319e7 --description "Opt-in: completeness score required before close (#2798)" 2>/dev/null || true
          gh label create "gate:completeness-v2" --repo "${{ github.repository }}" \
            --color 5319e7 --description "Task-authorized completeness enrollment; no plan approval prerequisite (#3943)" 2>/dev/null || true
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "gate:completeness,gate:completeness-v2"
