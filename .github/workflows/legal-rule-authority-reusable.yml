name: Legal Rule Authority Reusable

on:
  workflow_call:
    inputs:
      head_oid:
        required: true
        type: string
    secrets:
      LEGAL_SCAN_AUTH_CURRENT:
        required: true

permissions:
  contents: read

jobs:
  strict-scan:
    name: strict-scan
    environment: legal-rule-authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate immutable object id
        env:
          HEAD_OID: ${{ inputs.head_oid }}
        run: |
          [[ "$HEAD_OID" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - name: Checkout trusted authority tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
      - name: Materialize protected envelope
        shell: bash
        env:
          AUTH_ENVELOPE: ${{ secrets.LEGAL_SCAN_AUTH_CURRENT }}
        run: |
          set +x
          umask 077
          test -n "$AUTH_ENVELOPE"
          printf '%s' "$AUTH_ENVELOPE" > "$RUNNER_TEMP/authority-envelope"
      - name: Validate public authority
        run: >-
          uv run --no-project python scripts/legal/manage_rule_authority.py validate-public
          --registry config/legal-rule-registry.json
          --policy config/legal-rule-authority-policy.json
