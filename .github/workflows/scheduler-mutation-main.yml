name: Scheduler Mutation Main Guard

# Validate scheduler generated state on the commit that actually lands on main.
on:
  push:
    branches:
      - main

jobs:
  scheduler-mutation-surfaces:
    name: Scheduler Mutation Landed-Tree Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout landed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Validate scheduler mutation registry
        run: uv run python scripts/enforcement/check-scheduler-mutation-surfaces.py
      - name: Validate exact cron identity inventory
        run: uv run python scripts/cron/build-cron-identity-inventory.py --check
      - name: Verify scheduler mutation audit report
        run: uv run python scripts/enforcement/check-scheduler-mutation-surfaces.py --check-html docs/reports/2026-07-11-issue-3470-scheduler-mutation-safety.html
