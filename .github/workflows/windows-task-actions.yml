name: Windows scheduled task actions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  windows-task-actions:
    name: Windows task preview and execution
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise disposable task actions
        shell: powershell
        run: |
          $scratch = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          & ./tests/readiness/windows-task-actions.ps1 -ScratchDirectory $scratch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exported context root with Git Bash
        shell: powershell
        run: |
          $env:PATH = (Join-Path $env:ProgramFiles 'Git\bin') + ';' + $env:PATH
          python -m pip install pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scratch = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python -m pytest tests/readiness/test_windows_task_actions.py::test_context_derives_and_exports_root_from_script -q -rA -p no:cacheprovider --basetemp=$scratch
