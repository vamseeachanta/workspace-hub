name: Legal Identifier Gate

# Client identifier gate over the WHOLE tracked tree (owner decision C15, the
# digitalmodel#2167 design adopted under C11).
#
# legal-client-pii-gate.yml scans only the files a pull request changes, so
# content already on main is never re-read, and pre-commit is optional: a direct
# push or a web edit skips it. This job makes every identifier category --
# operator/client, field/project, vessel, person or Windows user, private path,
# machine hostname -- fail CI wherever it sits in the tree.
#
# The rules are .legal-identifier-gate.yaml: public pattern classes and salted
# name hashes. CI has no private list. The checker prints file and line, and
# the quoted line of a finding; it never prints a private pattern.
#
# Files the gate cannot read (PDFs, archives, solver binaries) pass only when
# the committed manifest .legal-uninspectable-baseline.txt lists their path
# with the same sha256; a new, changed or unlisted binary fails. After reviewing
# the content locally, accept it with
#   python scripts/legal/check_identifiers.py --all --update-baseline
# and commit the manifest diff. The update refuses to run in CI.
#
# Scheduled run (#3775): commits pushed to main with the default GITHUB_TOKEN
# (the kanban-reconcile board commit) raise no workflow run, so `push` never
# sees them. A daily schedule re-scans main. The job is read-only: contents
# read, no persisted credential, no write command.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identifier-gate:
    name: Client identifier gate (whole tree)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML and pytest
        run: python -m pip install --quiet pyyaml pytest

      - name: Test the gate
        run: python -m pytest -q -p no:cacheprovider tests/legal/test_check_identifiers.py tests/legal/test_check_identifiers_r4.py tests/legal/test_check_identifiers_r5.py tests/legal/test_check_numeric_text.py tests/legal/test_legal_gate_schedules.py

      - name: Scan the tracked tree
        run: python scripts/legal/check_identifiers.py --all --baseline .legal-uninspectable-baseline.txt
