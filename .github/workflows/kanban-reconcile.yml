name: Kanban Reconcile

on:
  # Phase 2 (#2826): the */20 cron is ACTIVE now that the
  # KANBAN_RECONCILE_APP_ID / KANBAN_RECONCILE_APP_KEY GitHub App secrets exist.
  # The App installation token is minted per-run (see the "Mint GitHub App token"
  # step) and used ONLY for cross-repo issue reads; the board push keeps using the
  # default GITHUB_TOKEN so bot pushes do not retrigger CI (anti-loop split).
  schedule:
    - cron: "*/20 * * * *"
  # repository_dispatch lets sibling repos send low-latency nudges (see the
  # kanban-nudge.yml template under .github/workflow-templates/). Correctness
  # remains cron-reconciler-primary; nudges only shorten latency.
  repository_dispatch:
    types: [kanban-nudge]   # only the nudge event triggers a run (narrow surface)
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: kanban-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Materialize private client map from secret
        # reconcile.py fails CLOSED (exit 3, writes nothing) without the private
        # client-codename map: board cards embed raw GitHub issue titles, this
        # repo is PUBLIC, and the board is pushed to main every 20 minutes
        # (#3768). Without this step the cron exits 3 on every run.
        #
        # Same handling as .github/workflows/legal-client-pii-gate.yml: the
        # secret reaches the shell ONLY through env (never interpolated into the
        # script body), is written with `printf '%s'` (no trailing newline, no
        # backslash interpretation), and the file is passed onward BY PATH — it
        # is never read back to a log, because these logs are public.
        #
        # It lands in $RUNNER_TEMP, outside the workspace, so the reconcile
        # loop's `git reset --hard` cannot disturb it and it can never become a
        # committable working-tree file in a public repo.
        #
        # NO degrade-open here. The PII gate degrades open because it runs on
        # fork PRs; this workflow is cron/dispatch-only on the main repo, and a
        # missing secret must go RED rather than let unredacted issue titles
        # reach a public branch. Failing here also avoids minting an App token
        # for a run that cannot succeed.
        env:
          LEGAL_CLIENT_MAP_SECRET: ${{ secrets.LEGAL_CLIENT_MAP }}
        run: |
          if [[ -z "$LEGAL_CLIENT_MAP_SECRET" ]]; then
            echo "::error::LEGAL_CLIENT_MAP secret is not set — refusing to reconcile. Board cards embed raw issue titles and this repo is PUBLIC (#3768). Provision the secret; do not relax the redaction requirement."
            exit 1
          fi
          printf '%s' "$LEGAL_CLIENT_MAP_SECRET" > "$RUNNER_TEMP/client-map.yaml"
          echo "LEGAL_CLIENT_MAP=$RUNNER_TEMP/client-map.yaml" >> "$GITHUB_ENV"
          echo "client map materialized ($(wc -c < "$RUNNER_TEMP/client-map.yaml") bytes)" >&2

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KANBAN_RECONCILE_APP_ID }}
          private-key: ${{ secrets.KANBAN_RECONCILE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          # Least-privilege: constrain this run's token to issue reads even if the
          # installation is granted more (the reconciler only reads sibling issues).
          permission-issues: read

      - name: Reconcile, commit, and push one batched run
        env:
          # App installation token: cross-repo issue reads via `gh api graphql`.
          # This token is exported as GH_TOKEN for the reconcile invocation ONLY.
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          # Default repo-scoped token: used by `git push` (via persisted checkout
          # credentials) so the board commit does NOT carry the App token and does
          # NOT retrigger CI. This is the anti-loop split.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # Start each attempt from the current remote branch, regenerate the
            # board state, then create one fresh batched commit. This makes both
            # rebase conflicts and push races retryable instead of wedging the run
            # behind a stale generated commit.
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"

            # Reconcile uses the App installation token so `gh api graphql` can read
            # sibling-repo issues cross-repo. Scoped to this invocation only — the
            # push below uses the persisted default-token checkout credential.
            GH_TOKEN="$APP_TOKEN" GITHUB_TOKEN="$APP_TOKEN" uv run python scripts/kanban/reconcile.py

            if git diff --quiet -- .claude/memory/kanban/boards; then
              echo "No kanban board changes."
              exit 0
            fi

            git add .claude/memory/kanban/boards
            git commit -m "chore: reconcile kanban board"

            push_stderr="$(mktemp)"
            if git push origin "HEAD:$GITHUB_REF_NAME" 2>"$push_stderr"; then
              rm -f "$push_stderr"
              exit 0
            fi
            push_error="$(cat "$push_stderr")"
            rm -f "$push_stderr"
            printf '%s\n' "$push_error" >&2
            if ! grep -Eiq 'non-fast-forward|fetch first' <<<"$push_error"; then
              echo "Non-retryable git push failure." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

          echo "Failed to push kanban reconcile after bounded retries." >&2
          exit 1
