# =============================================================================
# Client identifier gate -- workspace-hub (PUBLIC repository)
# =============================================================================
# Read by scripts/legal/check_identifiers.py (owner decision C15, 2026-09-25),
# the checker of digitalmodel#2167 (owner decision C11) adapted to this
# repository. CI runs it over the whole tracked tree on every push and pull
# request (.github/workflows/legal-identifier-gate.yml); pre-commit runs it on
# staged files (hook id client-identifier-gate).
#
# WHY THIS IS NOT .legal-deny-list.yaml
#
# The legacy list holds client and field names in plain text, and
# scripts/legal/legal-sanity-scan.sh greps every "- pattern:" line of it as a
# literal string. A deny list of client names, committed to a public
# repository, is itself a list of clients; and a structural regular expression
# placed there would be searched as text. This file is read only by the
# identifier gate.
#
# Two kinds of rule:
#
#   structural  Patterns, not names: a job code, a project document number, a
#               mapped drive, a UNC share, a Windows user profile, an address at
#               someone else's domain, a physical machine hostname. Publishing
#               the shape discloses nothing.
#
#   hashed      Names, as salted SHA-256 of the lowercased token. The checker
#               hashes each candidate word and compares. The salt is published:
#               it stops accidental matches, not a determined reader with a word
#               list. Anything genuinely secret belongs in the private list.
#
# An optional private list extends this one: WORKSPACE_HUB_DENY_LIST names it
# (missing -> the check FAILS), else ~/.config/workspace-hub/
# identifier-deny-list.txt is read when present. A line "re:<pattern>" is a
# private regular expression; findings name the scanned line, never the pattern.
# CI has no private list and relies on the classes and hashes below.
#
# A line that documents a pattern may carry "identifier-gate: example"; the
# structural rules skip that line and only that line. Names are still checked.
# =============================================================================

version: "1.0"
updated: "2026-09-25"

salt: "workspace-hub-identifier-check-v1"

structural:
  - id: job-code
    pattern: '(?i)(?<![A-Za-z0-9])B1[0-9]{3}(?![A-Za-z0-9])'
    severity: block
    message: >-
      Internal job code. Use a neutral placeholder such as <job-code>.

  - id: project-document-number
    # C15: engagement document numbers -- a four- or five-digit job number, a
    # document type and a serial (calculation, manual, report, comment sheet,
    # drawing, specification). Workbooks named this way were extracted into the
    # public tree. Dates and standard numbers do not have the type field.
    pattern: '(?i)(?<![A-Za-z0-9])[0-9]{4,5}-(?:cal|man|rpt|csh|dwg|spc)-[0-9]{3,4}(?![0-9])'
    severity: block
    message: >-
      Project document number. Use <document-number>.

  - id: ctr-number
    pattern: '\bCTR\s*[0-9]{1,3}\b'
    severity: block
    message: >-
      Contract/CTR number. Identifies a specific engagement.

  - id: mapped-drive-path
    pattern: '\b[D-Zd-z]:\\+[A-Za-z0-9_ .\\-]{6,}'
    severity: block
    message: >-
      Path on a mapped or network drive. Replace with <private-data> or a
      repository-relative path. C: is excluded because vendor install paths
      live there and disclose nothing.

  - id: unc-share
    # Two backslashes, a host, one separator and a name, or the escaped form
    # (four, a host, two). LaTeX, escaped relative paths and registry keys do
    # not match (digitalmodel#2167).
    pattern: '(?<![\w\\:.])(?:\\\\[A-Za-z0-9][A-Za-z0-9._-]*\\(?=[\w$.-])|\\\\\\\\[A-Za-z0-9][A-Za-z0-9._-]*\\\\(?=[\w$.-]))'
    severity: block
    message: >-
      UNC share path. Names an internal server.

  - id: windows-user-path
    pattern: '(?i)\b[A-Z]:(?:\\|/)+Users(?:\\|/)+(?!(?:public|default|all users)(?:[\\/"''\s]|$))(?![<%$])[A-Za-z0-9][A-Za-z0-9._-]*'
    severity: block
    message: >-
      Windows user profile path: names the account. Replace with
      <private-data>/... or a repository-relative path.

  - id: onedrive-org
    pattern: 'OneDrive\s+-\s+(?!<)[A-Za-z]'
    severity: block
    message: >-
      Organisation OneDrive folder. Names the employer or client.

  - id: solver-export-user
    pattern: '#\s*User:\s*(?![(<]|&lt;)\S'
    severity: block
    message: >-
      Solver export header names the Windows account. Write "# User: (removed)".

  - id: solver-export-machine
    # C15: fleet runbooks here head sections "# Machine: <logical label>";
    # the sanctioned labels are exempt, a physical name is not.
    pattern: '#\s*Machine:\s*(?![(<]|&lt;|(?:ace-(?:win|linux)-[0-9]+|licensed-win-[0-9]+|home-win|macbook-portable)\b)\S'
    severity: block
    message: >-
      Solver export header names the machine. Write "# Machine: (removed)".

  - id: windows-hostname
    # Logical fleet labels (ace-win-1, ace-linux-1, ...) do not match and are
    # the replacement.
    pattern: '(?i)\b[a-z]{2,6}-(?:[a-z]{2,4}-)?(?:rds|ansys|ws|host|fs|srv|dc)[0-9]{2,}\b'
    severity: block
    message: >-
      Physical machine hostname. Use the logical fleet label (ace-win-1,
      ace-win-2, ...) or "a Windows workstation".

  - id: foreign-domain-email
    # C15 adds two shapes that name no person: an SSH remote (git@host:path)
    # and a noreply / no-reply sender, which is the co-author trailer on agent
    # commits. The match starts at the beginning of the local part, so a
    # longer local part ending in "noreply" is still an address. The local
    # part starts with a letter or digit ("+@pytest.fixture" in a diff is a
    # decorator), and a final label that is a file extension rather than a
    # top-level domain ("tool@alpha-data.json") is a file name.
    pattern: '(?<![A-Za-z0-9._%+-])(?!no-?reply@)(?!git@[A-Za-z0-9.-]+\.[A-Za-z]{2,}:)[A-Za-z0-9][A-Za-z0-9._%+-]*@(?!example\.|localhost)[A-Za-z0-9.-]+\.(?!(?:json|ya?ml|txt|csv|html?|js|ts|toml|lock|xml|log)\b)[A-Za-z]{2,}'
    severity: block
    message: >-
      Email address. An address identifies a person, and at a client domain
      the engagement too. Use an address at example.com.

  - id: project-archive-path
    pattern: '\bacma-projects\b'
    severity: block
    message: >-
      Internal project archive name.

# ---------------------------------------------------------------------------
# Hashed names. Salted SHA-256 of the lowercased token.
#
# Deliberately unannotated: a comment naming each hash would publish the list
# the hashing withholds. To check whether a name is covered:
#
#   python scripts/legal/check_identifiers.py --hash "<token>"
#
# To add one, append the hash it prints, with no comment saying what it is.
# ---------------------------------------------------------------------------
