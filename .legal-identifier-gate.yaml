# ---------------------------------------------------------------------------
# Binary types that carry no inspectable text, exempt only when their leading
# bytes ARE that type. Any other binary fails unless the baseline lists it.
# ---------------------------------------------------------------------------
binary_media_extensions:
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .bmp
  - .ico
  - .webp
  - .woff
  - .woff2
  - .ttf
  - .otf

