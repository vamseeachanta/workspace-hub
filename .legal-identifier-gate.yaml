# ---------------------------------------------------------------------------
# Binary types that carry no inspectable text, exempt only when their leading
# bytes ARE that type. Any other binary fails unless the baseline lists it.
# ---------------------------------------------------------------------------
binary_media_extensions:
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .bmp
  - .ico
  - .webp
  - .woff
  - .woff2
  - .ttf
  - .otf

# ---------------------------------------------------------------------------
# Paths excluded from the check, each with its reason. Keep this list short;
# an exclusion is how a gate stops being one.
# ---------------------------------------------------------------------------
exclusions:
  - path: .legal-identifier-gate.yaml
    reason: this file necessarily contains the patterns it matches
  - path: scripts/legal/check_identifiers.py
    reason: the checker's messages and documentation quote example shapes